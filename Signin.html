<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>登录 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #fff;
        }
        /* 返回按钮：纯文字无背景，跳转index.html */
        .back-btn {
            position: absolute;
            top: 3%;
            left: 4%;
            font-size: 2.2vw;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            background: transparent;
            padding: 0;
            border-radius: 0;
            backdrop-filter: none;
        }
        /* 顶部标题：登录/注册 */
        .title {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.6vw;
            font-weight: bold;
            color: #000;
            text-shadow: none;
        }
        /* 广仙世界logo */
        .logo-mini {
            position: absolute;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            width: 32%;
            max-width: 220px;
        }
        /* 表单区域：纯白无背景无阴影 */
        .form-area {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            background: transparent;
            border-radius: 0;
            padding: 0;
            backdrop-filter: none;
            box-shadow: none;
        }
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 1.8vw;
            gap: 2%;
        }
        .row label {
            width: 22%;
            font-size: 1.8vw;
            font-weight: 600;
            color: #000;
        }
        /* 输入框：浅灰色背景，统一圆角8px */
        .row input {
            flex: 1;
            background: #d1d1d1;
            border: none;
            border-radius: 8px;
            padding: 1vw 1.8vw;
            font-size: 1.6vw;
            outline: none;
            font-family: inherit;
            color: #000;
        }
        /* 确定按钮：深灰色背景，统一圆角8px */
        .btn-confirm {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            background: #666666;
            color: white;
            font-size: 2.1vw;
            padding: 0.9vw 5vw;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: none;
            transition: 0.05s linear;
        }
        .btn-confirm:active {
            transform: translateX(-50%) scale(0.97);
            background: #555555;
        }
        .btn-confirm:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: translateX(-50%) scale(1);
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 修正返回按钮跳转至index.html -->
        <div class="back-btn" onclick="window.location.href='index.html'">← 返回</div>
        <div class="title">登录/注册</div>
        <img src="https://xiaoye6661234.github.io/GuangXianWorld/logo.png" class="logo-mini" />
        <div class="form-area">
            <div class="row"><label>账号：</label><input type="text" id="username" placeholder="手机号/邮箱" /></div>
            <div class="row"><label>密码：</label><input type="password" id="password" placeholder="******" /></div>
            <div class="row" id="confirmRow"><label>确认密码：</label><input type="password" id="confirmPass" placeholder="再次输入" /></div>
        </div>
        <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>
    <script>
        // ========== 核心功能100%保留 未做任何修改 ==========
        const confirmBtn = document.getElementById('confirmBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPass');
        const confirmRow = document.getElementById('confirmRow');
        // 检查是否已有数据，决定显示登录还是注册
        (function checkMode() {
            const existing = localStorage.getItem('GuangXianData');
            if (existing) {
                try {
                    const data = JSON.parse(existing);
                    if (data && data.user && data.user.username) {
                        // 已有账号 → 登录模式
                        usernameInput.value = data.user.username;
                        usernameInput.disabled = true;
                        confirmRow.style.display = 'none';
                        document.querySelector('.title').textContent = '欢迎回来';
                        return;
                    }
                } catch (e) { /* 数据损坏，按注册处理 */ }
            }
            // 无数据 → 注册模式
            usernameInput.disabled = false;
            confirmRow.style.display = 'flex';
            document.querySelector('.title').textContent = '登录/注册';
        })();
        confirmBtn.addEventListener('click', () => {
            let clickAudio = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            clickAudio.volume = 0.5;
            clickAudio.play().catch(e => {});
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            if (!username || !password) {
                alert('账号/密码不可为空');
                return;
            }
            // 检查是否已有数据
            const existing = localStorage.getItem('GuangXianData');
            let parsedExisting = null;
            if (existing) {
                try {
                    parsedExisting = JSON.parse(existing);
                } catch (e) { /* 忽略 */ }
            }
            // ===== 登录模式（已有账号且用户名匹配） =====
            if (parsedExisting && parsedExisting.user && parsedExisting.user.username === username) {
                // 验证密码
                if (parsedExisting.user.password !== password) {
                    alert('密码错误！');
                    return;
                }
                // 登录成功
                localStorage.setItem('GuangXianData', JSON.stringify(parsedExisting));
                // 检查数据完整性，决定跳转
                const user = parsedExisting.user;
                if (!user.role) {
                    window.location.href = 'ChooseRole.html';
                    return;
                }
                if (!user.nickname || user.nickname === '云游仙友' || !user.region) {
                    window.location.href = 'PersonalInformation.html';
                    return;
                }
                // 完整 → 进入大厅
                window.location.href = 'Hall.html';
                return;
            }
            // ===== 注册模式（新账号 或 用户名不匹配） =====
            if (parsedExisting && parsedExisting.user && parsedExisting.user.username !== username) {
                // 用户名不匹配：询问是否覆盖
                if (!confirm(`当前已有账号 "${parsedExisting.user.username}"，是否创建新账号 "${username}"？\n（原有数据将被覆盖）`)) {
                    return;
                }
            }
            // 验证密码一致性（注册模式）
            if (password !== confirm) {
                alert('两次密码不一致');
                return;
            }
            // 创建新账号
            const newData = {
                user: {
                    username: username,
                    password: password,
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    loginStreak: 0,
                    lastLoginDate: new Date().toISOString().split('T')[0],
                    joinedDate: new Date().toISOString().split('T')[0],
                    role: '',
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 }
                }
            };
            localStorage.setItem('GuangXianData', JSON.stringify(newData));
            // 询问是否下载 data.json
            if (confirm('注册成功！是否现在下载您的 data.json 数据文件？')) {
                const blob = new Blob([JSON.stringify(newData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                a.click();
                URL.revokeObjectURL(url);
            }
            // 跳转到选角色
            window.location.href = 'ChooseRole.html';
        });
    </script>
</body>
</html>
