<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>登录 · 广仙世界</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        /* ===== 返回按钮 ===== */
        .back-btn {
            position: absolute;
            top: 2.8%;
            left: 4.5%;
            font-size: 2vw;
            font-weight: 700;
            cursor: pointer;
            color: #000000;
            background: transparent;
            padding: 0;
            border: none;
            line-height: 1;
            letter-spacing: -0.02em;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:active {
            opacity: 0.6;
        }

        /* ===== 顶部标题 ===== */
        .title {
            position: absolute;
            top: 2.8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2vw;
            font-weight: 700;
            color: #000000;
            letter-spacing: 0.04em;
            white-space: nowrap;
            z-index: 10;
        }

        /* ===== Logo ===== */
        .logo-mini {
            position: absolute;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            width: 32%;
            max-width: 220px;
            pointer-events: none;
            /* 完全禁止交互 → 无法长按 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            draggable: false;
        }

        /* ===== 表单区域 ===== */
        .form-area {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 64%;
            background: transparent;
            padding: 0;
            box-shadow: none;
        }

        /* 每一行 */
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 1.6vw;
            gap: 1.2%;
        }

        /* 标签 */
        .row label {
            width: 20%;
            font-size: 1.6vw;
            font-weight: 600;
            color: #000000;
            letter-spacing: 0.02em;
            flex-shrink: 0;
            text-align: left;
        }

        /* 输入框 */
        .row input {
            flex: 1;
            background: #d1d1d1;
            border: none;
            border-radius: 8px;
            padding: 0.9vw 1.8vw;
            font-size: 1.4vw;
            outline: none;
            font-family: inherit;
            color: #000000;
            min-height: 3.2vw;
            -webkit-user-select: text;
            user-select: text;
            /* 输入框内允许选中文本以便编辑 */;
        }
        .row input::placeholder {
            color: #777;
            font-weight: 400;
            font-size: 1.3vw;
        }
        .row input:disabled {
            background: #c5c5c5;
            color: #333;
            opacity: 0.85;
        }

        /* ===== 确定按钮 ===== */
        .btn-confirm {
            position: absolute;
            bottom: 16%;
            left: 50%;
            transform: translateX(-50%);
            background: #666666;
            color: #ffffff;
            font-size: 1.9vw;
            font-weight: 700;
            padding: 0.85vw 4.8vw;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.08s ease, transform 0.08s ease;
            letter-spacing: 0.04em;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-confirm:active {
            transform: translateX(-50%) scale(0.97);
            background: #555555;
        }
        .btn-confirm:disabled {
            background: #aaaaaa;
            cursor: not-allowed;
            transform: translateX(-50%) scale(1);
        }

        /* ===== 竖屏适配 ===== */
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }

        /* ===== 禁止图片长按/右键 ===== */
        img {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 返回 → index.html -->
        <div class="back-btn" onclick="window.location.href='index.html'">← 返回</div>

        <!-- 标题 -->
        <div class="title">登录/注册</div>

        <!-- Logo (防下载) -->
        <img
        src="https://xiaoye6661234.github.io/GuangXianWorld/logo.png"
        class="logo-mini"
        draggable="false"
        oncontextmenu="return false"
        alt="广仙世界"
        />

        <!-- 表单 -->
        <div class="form-area">
            <div class="row">
                <label>账号：</label>
                <input type="text" id="username" placeholder="手机号/邮箱" />
            </div>
            <div class="row">
                <label>密码：</label>
                <input type="password" id="password" placeholder="******" />
            </div>
            <div class="row" id="confirmRow">
                <label>确认密码：</label>
                <input type="password" id="confirmPass" placeholder="再次输入" />
            </div>
        </div>

        <!-- 确定按钮 -->
        <button class="btn-confirm" id="confirmBtn">确定</button>

    </div>

    <script>
        // ================================================================
        //  核心功能 100% 保留（仅跳转目标改为 PersonalInformation.html）
        // ================================================================

        var confirmBtn = document.getElementById('confirmBtn');
        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var confirmInput = document.getElementById('confirmPass');
        var confirmRow = document.getElementById('confirmRow');

        // ---- 检查模式：已有数据则进入登录模式 ----
        (function checkMode() {
            var existing = localStorage.getItem('GuangXianData');
            if (existing) {
                try {
                    var data = JSON.parse(existing);
                    if (data && data.user && data.user.username) {
                        usernameInput.value = data.user.username;
                        usernameInput.disabled = true;
                        confirmRow.style.display = 'none';
                        document.querySelector('.title').textContent = '欢迎回来';
                        return;
                    }
                } catch (e) { /* 数据损坏，按注册处理 */ }
            }
            usernameInput.disabled = false;
            confirmRow.style.display = 'flex';
            document.querySelector('.title').textContent = '登录/注册';
        })();

        // ---- 确定按钮 ----
        confirmBtn.addEventListener('click', function() {
            // 点击音效（不影响核心逻辑）
            var clickAudio = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            clickAudio.volume = 0.5;
            clickAudio.play().catch(function(e) {});

            var username = usernameInput.value.trim();
            var password = passwordInput.value;
            var confirm = confirmInput.value;

            if (!username || !password) {
                alert('账号/密码不可为空');
                return;
            }

            // 读取已有数据
            var existing = localStorage.getItem('GuangXianData');
            var parsedExisting = null;
            if (existing) {
                try {
                    parsedExisting = JSON.parse(existing);
                } catch (e) { /* 忽略 */ }
            }

            // ===== 登录模式（已有账号且用户名匹配） =====
            if (parsedExisting && parsedExisting.user && parsedExisting.user.username === username) {
                if (parsedExisting.user.password !== password) {
                    alert('密码错误！');
                    return;
                }
                // 登录成功，保存数据
                localStorage.setItem('GuangXianData', JSON.stringify(parsedExisting));
                // ★ 统一跳转到 PersonalInformation.html
                window.location.href = 'PersonalInformation.html';
                return;
            }

            // ===== 注册模式（新账号 或 用户名不匹配） =====
            if (parsedExisting && parsedExisting.user && parsedExisting.user.username !== username) {
                if (!confirm('当前已有账号 "' + parsedExisting.user.username + '"，是否创建新账号 "' + username + '"？\n（原有数据将被覆盖）')) {
                    return;
                }
            }

            // 验证密码一致性
            if (password !== confirm) {
                alert('两次密码不一致');
                return;
            }

            // 创建新账号
            var newData = {
                user: {
                    username: username,
                    password: password,
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    loginStreak: 0,
                    lastLoginDate: new Date().toISOString().split('T')[0],
                    joinedDate: new Date().toISOString().split('T')[0],
                    role: '',
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 }
                }
            };
            localStorage.setItem('GuangXianData', JSON.stringify(newData));

            // 询问是否下载 data.json
            if (confirm('注册成功！是否现在下载您的 data.json 数据文件？')) {
                var blob = new Blob([JSON.stringify(newData, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                a.click();
                URL.revokeObjectURL(url);
            }

            // ★ 统一跳转到 PersonalInformation.html
            window.location.href = 'PersonalInformation.html';
        });
    </script>

</body>
</html>
