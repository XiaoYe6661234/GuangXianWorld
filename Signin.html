<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>登录 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #f5efe6;
            overflow: hidden;
        }
        .back-btn {
            position: absolute;
            top: 3%;
            left: 4%;
            font-size: 2vw;
            font-weight: 700;
            cursor: pointer;
            color: #333;
            z-index: 10;
            background: rgba(200, 200, 200, 0.5);
            padding: 0.3vw 1.5vw;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            border: none;
        }
        .back-btn:active {
            transform: scale(0.95);
        }
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.2vw;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 0.06em;
        }
        .logo-mini {
            position: absolute;
            top: 16%;
            left: 50%;
            transform: translateX(-50%);
            width: 28%;
            max-width: 200px;
            pointer-events: none;
            draggable: false;
        }
        .form-area {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 500px;
            background: transparent;
        }
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 1.6vw;
            gap: 1.2%;
        }
        .row label {
            width: 22%;
            font-size: 1.6vw;
            font-weight: 600;
            color: #1a1a1a;
            flex-shrink: 0;
            text-align: left;
        }
        .row input {
            flex: 1;
            background: #e8e0d8;
            border: none;
            border-radius: 8px;
            padding: 0.9vw 1.8vw;
            font-size: 1.4vw;
            outline: none;
            font-family: inherit;
            color: #1a1a1a;
            min-height: 3.2vw;
            -webkit-user-select: text;
            user-select: text;
        }
        .row input::placeholder {
            color: #999;
            font-weight: 400;
            font-size: 1.2vw;
        }
        .row input:disabled {
            background: #d5cdc5;
            color: #555;
            opacity: 0.85;
        }
        .btn-confirm {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            background: #ffb300;
            color: #fff;
            font-size: 2vw;
            font-weight: 700;
            padding: 0.8vw 5vw;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 16px rgba(255, 179, 0, 0.3);
            letter-spacing: 0.04em;
        }
        .btn-confirm:active {
            transform: translateX(-50%) scale(0.96);
            background: #ffa000;
        }
        .btn-confirm:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: translateX(-50%) scale(1);
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
        @media (max-width: 600px) {
            .title {
                font-size: 5vw;
            }
            .row label {
                font-size: 2.8vw;
                width: 28%;
            }
            .row input {
                font-size: 2.4vw;
                padding: 1.2vw 2.5vw;
                min-height: 5vw;
            }
            .btn-confirm {
                font-size: 3.5vw;
                padding: 1.2vw 8vw;
            }
            .logo-mini {
                width: 40%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">← 返回</button>
        <div class="title">登录 / 注册</div>
        <img src="https://xiaoye6661234.github.io/GuangXianWorld/logo.png" class="logo-mini" draggable="false" alt="广仙世界" />
        <div class="form-area">
            <div class="row">
                <label>账号：</label>
                <input type="text" id="username" placeholder="手机号 / 邮箱" />
            </div>
            <div class="row">
                <label>密码：</label>
                <input type="password" id="password" placeholder="******" />
            </div>
            <div class="row" id="confirmRow">
                <label>确认密码：</label>
                <input type="password" id="confirmPass" placeholder="再次输入" />
            </div>
        </div>
        <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>

    <script>
        // ================================================================
        //  统一数据操作（所有页面共用）
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch (e) { return null; }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: '',
                    adWatchCount: 0,
                    adWatchDate: '',
                    moneyPicks: 0,
                    moneyPickDate: '',
                    hasDrawnBefore: false,
                    totalDraws: 0,
                    tenDrawsCount: 0,
                    taskData: {
                        monstersKilled: 0,
                        healItemsUsed: 0,
                        bossesKilled: 0,
                        minionsKilled: 0,
                        coinsSpent: 0,
                        coinsGained: 0,
                        nicknameChanges: 0,
                        avatarChanges: 0,
                        hardModeWins: 0,
                        totalDraws: 0,
                        tenDrawsCount: 0,
                        moneyPicks: 0
                    },
                    taskRefreshDate: '',
                    currentTasks: [],
                    taskStates: {}
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        // ================================================================
        //  登录 / 注册逻辑
        // ================================================================

        var usernameInput = document.getElementById('username');
        var passwordInput = document.getElementById('password');
        var confirmInput = document.getElementById('confirmPass');
        var confirmRow = document.getElementById('confirmRow');

        // 检查已有数据 → 登录模式
        (function() {
            var data = loadData();
            if (data && data.user && data.user.username) {
                usernameInput.value = data.user.username;
                usernameInput.disabled = true;
                confirmRow.style.display = 'none';
                document.querySelector('.title').textContent = '欢迎回来';
            }
        })();

        document.getElementById('confirmBtn').addEventListener('click', function() {
            var username = usernameInput.value.trim();
            var password = passwordInput.value;
            var confirm = confirmInput.value;

            if (!username || !password) {
                alert('账号和密码不能为空');
                return;
            }

            var data = loadData();

            // 登录模式（已有账号且匹配）
            if (data && data.user && data.user.username === username) {
                if (data.user.password !== password) {
                    alert('密码错误！');
                    return;
                }
                data.user.lastLoginDate = new Date().toISOString().split('T')[0];
                saveData(data);
                window.location.href = 'Hall.html';
                return;
            }

            // 注册模式（新账号或覆盖）
            if (data && data.user && data.user.username !== username) {
                if (!confirm('当前已有账号 "' + data.user.username + '"，是否创建新账号 "' + username + '"？\n（原有数据将被覆盖）')) {
                    return;
                }
            }

            if (password !== confirm) {
                alert('两次密码不一致');
                return;
            }

            var newData = createDefaultData();
            newData.user.username = username;
            newData.user.password = password;
            newData.user.lastLoginDate = new Date().toISOString().split('T')[0];
            newData.user.joinedDate = new Date().toISOString().split('T')[0];
            saveData(newData);

            if (confirm('注册成功！是否下载您的 data.json 数据文件？')) {
                var blob = new Blob([JSON.stringify(newData, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            window.location.href = 'ChooseRole.html';
        });
    </script>
</body>
</html>
