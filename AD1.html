<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广告 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .ad-container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 2vw;
        }
        .ad-title {
            font-size: 3.5vw;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            margin-bottom: 0.5vw;
        }
        .ad-subtitle {
            font-size: 1.8vw;
            color: #aaa;
            margin-bottom: 1.5vw;
        }
        .ad-video-wrapper {
            width: 60%;
            max-width: 600px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.15);
            position: relative;
        }
        .ad-video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .ad-timer {
            font-size: 4vw;
            font-weight: bold;
            color: #ff4444;
            margin-top: 1.2vw;
            text-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }
        .ad-timer span {
            font-size: 5vw;
        }
        .ad-progress {
            width: 50%;
            height: 0.8vw;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 0.8vw;
        }
        .ad-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8800, #ffcc00);
            border-radius: 10px;
            transition: width 0.3s linear;
        }
        .ad-hint {
            font-size: 1.5vw;
            color: #888;
            margin-top: 0.8vw;
        }
        @media (orientation: portrait) {
            .ad-container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="ad-title">🎮 广仙世界 · 广告时间</div>
        <div class="ad-subtitle">感谢您的支持，观看10秒即可获得250广仙币</div>
        <div class="ad-video-wrapper">
            <video id="adVideo" src="https://xiaoye6661234.github.io/GuangXianWorld/AD1.mp4" preload="auto" playsinline></video>
        </div>
        <div class="ad-timer"><span id="timerDisplay">10</span> 秒</div>
        <div class="ad-progress">
            <div class="ad-progress-fill" id="progressFill"></div>
        </div>
        <div class="ad-hint">⏳ 视频播放中，请耐心等待...</div>
    </div>

    <script>
        // ================================================================
        //  广告倒计时逻辑（与视频同步）
        // ================================================================

        var totalTime = 10;
        var remaining = totalTime;
        var timerId = null;
        var isCompleted = false;

        var timerDisplay = document.getElementById('timerDisplay');
        var progressFill = document.getElementById('progressFill');
        var video = document.getElementById('adVideo');

        // 尝试自动播放视频
        function playVideo() {
            video.play().catch(function() {
                // 如果自动播放被阻止，用户点击任意位置后尝试播放
                document.addEventListener('click', function playOnClick() {
                    video.play().catch(function(e) {});
                    document.removeEventListener('click', playOnClick);
                });
            });
        }

        // 视频加载完成后开始播放
        video.addEventListener('loadeddata', function() {
            playVideo();
        });

        // 如果视频无法加载，仍然启动倒计时
        video.addEventListener('error', function() {
            console.warn('视频加载失败，倒计时继续');
            startTimer();
        });

        // 视频播放结束后继续倒计时（如果还没完成）
        video.addEventListener('ended', function() {
            if (!isCompleted) {
                // 视频结束但倒计时可能还没到，继续倒计时
            }
        });

        function startTimer() {
            if (timerId) return;
            timerId = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            remaining--;
            timerDisplay.innerText = remaining;
            var progress = ((totalTime - remaining) / totalTime) * 100;
            progressFill.style.width = progress + '%';

            if (remaining <= 0) {
                clearInterval(timerId);
                timerId = null;
                isCompleted = true;
                progressFill.style.width = '100%';
                timerDisplay.innerText = '0';
                notifyParent();
            }
        }

        function notifyParent() {
            // 使用 postMessage 通知父窗口
            if (window.opener) {
                try {
                    window.opener.postMessage({ type: 'adCompleted', reward: 250 }, '*');
                } catch (e) {
                    console.warn('无法通知父窗口:', e);
                }
            }

            // 显示完成信息
            document.querySelector('.ad-timer').innerHTML = '✅ 广告完成！';
            document.querySelector('.ad-hint').innerText = '🎉 奖励已发放，页面即将关闭...';

            // 2秒后自动关闭
            setTimeout(function() {
                window.close();
            }, 2000);
        }

        // 启动倒计时（先等待视频加载，如果3秒后仍未加载则强制启动）
        setTimeout(function() {
            if (!timerId) {
                startTimer();
            }
        }, 3000);

        // 视频加载完成后立即启动倒计时
        video.addEventListener('canplaythrough', function() {
            if (!timerId) {
                startTimer();
            }
        });

        // 禁止用户通过点击跳过
        document.addEventListener('click', function(e) {
            if (!isCompleted) {
                e.preventDefault();
            }
        });

        window.addEventListener('beforeunload', function(e) {
            if (!isCompleted) {
                // 没有完成，不发放奖励
            }
        });

        console.log('📺 AD1 广告页面加载完成，倒计时 10 秒');
    </script>
</body>
</html>
