<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广告 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .ad-container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 2vw;
        }
        .ad-title {
            font-size: 3.5vw;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            margin-bottom: 0.5vw;
        }
        .ad-subtitle {
            font-size: 1.8vw;
            color: #aaa;
            margin-bottom: 1.5vw;
        }
        .ad-video-wrapper {
            width: 60%;
            max-width: 600px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.15);
            position: relative;
        }
        .ad-video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .ad-timer {
            font-size: 4vw;
            font-weight: bold;
            color: #ff4444;
            margin-top: 1.2vw;
            text-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }
        .ad-timer span {
            font-size: 5vw;
        }
        .ad-progress {
            width: 50%;
            height: 0.8vw;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 0.8vw;
        }
        .ad-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8800, #ffcc00);
            border-radius: 10px;
            transition: width 0.3s linear;
        }
        .ad-hint {
            font-size: 1.5vw;
            color: #888;
            margin-top: 0.8vw;
        }
        .skip-btn {
            position: absolute;
            top: 2vw;
            right: 2vw;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 0.6vw 1.5vw;
            font-size: 2vw;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: 0.2s;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }
        .skip-btn:active {
            transform: scale(0.95);
        }
        @media (orientation: portrait) {
            .ad-container {
                transform: rotate(-90deg) scale(0.8);
            }
            .skip-btn {
                top: 1vw;
                right: 1vw;
                font-size: 2.5vw;
                padding: 0.8vw 2vw;
            }
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <button class="skip-btn" id="skipBtn" onclick="skipAd()">跳过 &gt;&gt;</button>

        <div class="ad-title">🎮 广告时间</div>
        <div class="ad-subtitle">感谢您的支持，观看10秒即可获得250广仙币</div>
        <div class="ad-video-wrapper">
            <video id="adVideo" src="https://xiaoye6661234.github.io/GuangXianWorld/AD1.mp4" preload="auto" playsinline></video>
        </div>
        <div class="ad-timer"><span id="timerDisplay">10</span> 秒</div>
        <div class="ad-progress">
            <div class="ad-progress-fill" id="progressFill"></div>
        </div>
        <div class="ad-hint">⏳ 视频播放中，请耐心等待...</div>
    </div>

    <script>
        var totalTime = 10;
        var remaining = totalTime;
        var timerId = null;
        var isCompleted = false;

        var timerDisplay = document.getElementById('timerDisplay');
        var progressFill = document.getElementById('progressFill');
        var skipBtn = document.getElementById('skipBtn');
        var video = document.getElementById('adVideo');

        // 跳过广告（仅在完成后有效）
        function skipAd() {
            if (isCompleted) {
                // 尝试关闭窗口
                window.close();
                // 如果 close 失败（某些浏览器限制），提示手动关闭
                setTimeout(function() {
                    if (!window.closed) {
                        alert('请手动关闭此窗口。');
                    }
                }, 500);
            }
        }

        function playVideo() {
            video.play().catch(function() {
                document.addEventListener('click', function playOnClick() {
                    video.play().catch(function(e) {});
                    document.removeEventListener('click', playOnClick);
                });
            });
        }

        video.addEventListener('loadeddata', function() {
            playVideo();
        });

        video.addEventListener('error', function() {
            console.warn('视频加载失败，倒计时继续');
            startTimer();
        });

        function startTimer() {
            if (timerId) return;
            timerId = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            remaining--;
            timerDisplay.innerText = remaining;
            var progress = ((totalTime - remaining) / totalTime) * 100;
            progressFill.style.width = progress + '%';

            if (remaining <= 0) {
                clearInterval(timerId);
                timerId = null;
                isCompleted = true;
                progressFill.style.width = '100%';
                timerDisplay.innerText = '0';
                // 显示跳过按钮
                skipBtn.style.display = 'block';
                document.querySelector('.ad-hint').innerText = '✅ 广告已完成，点击右上角“跳过”关闭页面';
                // 通知父窗口
                notifyParent();
                // 尝试自动关闭（延迟1秒）
                setTimeout(function() {
                    if (window.opener && !window.closed) {
                        window.close();
                    }
                }, 1000);
            }
        }

        function notifyParent() {
            if (window.opener) {
                try {
                    window.opener.postMessage({ type: 'adCompleted', reward: 250 }, '*');
                } catch (e) {
                    console.warn('无法通知父窗口:', e);
                }
            }
        }

        // 如果视频加载慢，3秒后强制开始倒计时
        setTimeout(function() {
            if (!timerId) {
                startTimer();
            }
        }, 3000);

        video.addEventListener('canplaythrough', function() {
            if (!timerId) {
                startTimer();
            }
        });

        // 阻止提前点击跳过（但点击视频区域不受影响）
        document.addEventListener('click', function(e) {
            if (!isCompleted && e.target !== video && e.target !== skipBtn) {
                e.preventDefault();
            }
        });

        window.addEventListener('beforeunload', function(e) {
            if (!isCompleted) {
                // 没有完成，不发放奖励（但不会阻止关闭）
            }
        });

        console.log('📺 AD1 广告页面加载完成，倒计时 10 秒');
    </script>
</body>
</html>
