<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>完善信息 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #f5efe6;
            overflow: hidden;
        }
        .back {
            position: absolute;
            top: 3%;
            left: 4%;
            font-size: 2vw;
            font-weight: 700;
            cursor: pointer;
            color: #333;
            z-index: 10;
            background: rgba(200, 200, 200, 0.5);
            padding: 0.3vw 1.5vw;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            border: none;
            transition: 0.2s;
        }
        .back:active {
            transform: scale(0.95);
        }
        .header {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.2vw;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 0.06em;
        }
        .grid-container {
            position: absolute;
            top: 20%;
            left: 4%;
            width: 92%;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1.2fr 1.8fr;
            gap: 3%;
            align-items: start;
        }
        .col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 1.8vw;
            font-weight: 600;
            color: #1a1a1a;
        }
        .img-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: #d5cdc5;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            margin-top: 0.8vw;
            position: relative;
            font-size: 1.4vw;
            color: #777;
            text-align: center;
            padding: 0.5vw;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            draggable: false;
        }
        .img-box .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.4vw;
            color: #777;
            line-height: 1.4;
        }
        .input-box {
            width: 100%;
            height: 3.8vw;
            background: #e8e0d8;
            border: none;
            border-radius: 8px;
            padding: 0 1.5vw;
            font-size: 1.5vw;
            outline: none;
            font-family: inherit;
            margin-top: 0.8vw;
            color: #1a1a1a;
            -webkit-user-select: text;
            user-select: text;
        }
        .input-box::placeholder {
            color: #999;
            font-weight: 400;
            font-size: 1.2vw;
        }
        .tip {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
            font-size: 1.4vw;
            color: #888;
            letter-spacing: 0.02em;
        }
        .btn-confirm {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: #ffb300;
            color: #fff;
            font-size: 2.2vw;
            padding: 0.8vw 6vw;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.15s;
            box-shadow: 0 4px 16px rgba(255, 179, 0, 0.3);
        }
        .btn-confirm:active {
            transform: translateX(-50%) scale(0.96);
            background: #ffa000;
        }
        .hidden-input {
            display: none;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5efe6;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            gap: 2vw;
        }
        .loading-overlay .title-lg {
            font-size: 3vw;
            font-weight: 900;
            color: #1a1a1a;
        }
        .loading-overlay .sub {
            font-size: 1.6vw;
            color: #666;
        }
        .loading-overlay .upload-btn {
            background: #ffb300;
            color: #fff;
            font-size: 2.2vw;
            padding: 0.8vw 3vw;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        .loading-overlay .new-btn {
            background: #666;
            color: #fff;
            font-size: 2.2vw;
            padding: 0.8vw 3vw;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr 1fr;
                gap: 2%;
                top: 16%;
            }
            .col {
                font-size: 2.8vw;
            }
            .input-box {
                height: 6vw;
                font-size: 2.4vw;
            }
            .img-box {
                font-size: 2.2vw;
            }
            .header {
                font-size: 5vw;
            }
            .btn-confirm {
                font-size: 3.5vw;
                padding: 1.2vw 8vw;
            }
            .tip {
                font-size: 2vw;
                bottom: 16%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="title-lg">📂 加载个人数据</div>
            <div class="sub">请上传 data.json 文件，或创建全新数据</div>
            <input type="file" id="dataJsonInput" accept=".json" class="hidden-input" />
            <button class="upload-btn" onclick="document.getElementById('dataJsonInput').click()">📤 选择 data.json</button>
            <div style="font-size:1.4vw;color:#999;">— 或者 —</div>
            <button class="new-btn" onclick="createNewData()">✨ 创建新数据</button>
        </div>

        <button class="back" onclick="history.back()">← 上一步</button>
        <div class="header">完善个人信息</div>

        <div class="grid-container">
            <div class="col">
                <div>1. 头像</div>
                <div class="img-box" id="avatarBox">
                    <div class="placeholder" id="avatarPlaceholder">点击选择</div>
                    <input type="file" id="avatarInput" accept="image/*" class="hidden-input" />
                    <img id="avatarPreview" style="display:none;" draggable="false" />
                </div>
            </div>
            <div class="col">
                <div>2. 昵称</div>
                <input type="text" class="input-box" id="nickname" placeholder="请输入昵称" />
            </div>
            <div class="col">
                <div>3. 地区</div>
                <input type="text" class="input-box" id="region" placeholder="请输入地区" />
            </div>
            <div class="col">
                <div>4. 主页背景</div>
                <div class="img-box" id="bgBox">
                    <div class="placeholder" id="bgPlaceholder">点击选择</div>
                    <input type="file" id="bgInput" accept="image/*" class="hidden-input" />
                    <img id="bgPreview" style="display:none;" draggable="false" />
                </div>
            </div>
        </div>

        <div class="tip">Tip：昵称和地区一旦保存将无法更改！</div>
        <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>

    <script>
        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch (e) { return null; }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: '',
                    adWatchCount: 0,
                    adWatchDate: '',
                    moneyPicks: 0,
                    moneyPickDate: '',
                    hasDrawnBefore: false,
                    totalDraws: 0,
                    tenDrawsCount: 0,
                    taskData: {
                        monstersKilled: 0,
                        healItemsUsed: 0,
                        bossesKilled: 0,
                        minionsKilled: 0,
                        coinsSpent: 0,
                        coinsGained: 0,
                        nicknameChanges: 0,
                        avatarChanges: 0,
                        hardModeWins: 0,
                        totalDraws: 0,
                        tenDrawsCount: 0,
                        moneyPicks: 0
                    },
                    taskRefreshDate: '',
                    currentTasks: [],
                    taskStates: {}
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        var userData = null;
        var avatarBase64 = null;
        var bgBase64 = null;

        // 上传 data.json
        document.getElementById('dataJsonInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        var parsed = JSON.parse(ev.target.result);
                        if (!parsed || !parsed.user) {
                            alert('❌ data.json 格式无效：缺少 user 字段');
                            return;
                        }
                        userData = parsed;
                        fillForm(userData);
                        document.getElementById('loadingOverlay').style.display = 'none';
                        alert('✅ 数据加载成功！欢迎回来，' + (userData.user.nickname || '仙友'));
                    } catch (err) {
                        alert('❌ 文件解析失败：' + err.message);
                    }
                };
                reader.readAsText(this.files[0]);
            }
        });

        function createNewData() {
            userData = createDefaultData();
            fillForm(userData);
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('✅ 已创建新数据，请完善个人信息');
        }

        function fillForm(data) {
            var u = data.user;
            if (u.nickname && u.nickname !== '云游仙友') document.getElementById('nickname').value = u.nickname;
            if (u.region) document.getElementById('region').value = u.region;
            if (u.avatar && u.avatar !== 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg') {
                avatarBase64 = u.avatar;
                var img = document.getElementById('avatarPreview');
                img.src = u.avatar;
                img.style.display = 'block';
                document.getElementById('avatarPlaceholder').style.display = 'none';
            }
            if (u.bgImage) {
                bgBase64 = u.bgImage;
                var img = document.getElementById('bgPreview');
                img.src = u.bgImage;
                img.style.display = 'block';
                document.getElementById('bgPlaceholder').style.display = 'none';
            }
        }

        document.getElementById('avatarBox').addEventListener('click', function() {
            document.getElementById('avatarInput').click();
        });
        document.getElementById('avatarInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    avatarBase64 = ev.target.result;
                    var img = document.getElementById('avatarPreview');
                    img.src = avatarBase64;
                    img.style.display = 'block';
                    document.getElementById('avatarPlaceholder').style.display = 'none';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        document.getElementById('bgBox').addEventListener('click', function() {
            document.getElementById('bgInput').click();
        });
        document.getElementById('bgInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    bgBase64 = ev.target.result;
                    var img = document.getElementById('bgPreview');
                    img.src = bgBase64;
                    img.style.display = 'block';
                    document.getElementById('bgPlaceholder').style.display = 'none';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        document.getElementById('confirmBtn').addEventListener('click', function() {
            var nickname = document.getElementById('nickname').value.trim();
            var region = document.getElementById('region').value.trim();
            if (!nickname) { alert('请输入昵称！'); return; }
            if (!region) { alert('请输入地区！'); return; }

            if (!userData) userData = createDefaultData();
            userData.user.nickname = nickname;
            userData.user.region = region;
            if (avatarBase64) userData.user.avatar = avatarBase64;
            else if (!userData.user.avatar) userData.user.avatar = 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg';
            if (bgBase64) userData.user.bgImage = bgBase64;
            if (!userData.user.role) userData.user.role = '铭';

            saveData(userData);

            if (confirm('✅ 信息已保存！是否下载 data.json 数据文件？')) {
                var blob = new Blob([JSON.stringify(userData, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            window.location.href = 'Hall.html';
        });

        (function init() {
            var data = loadData();
            if (data && data.user && data.user.nickname && data.user.region) {
                userData = data;
                fillForm(userData);
                document.getElementById('loadingOverlay').style.display = 'none';
                return;
            }
            document.getElementById('loadingOverlay').style.display = 'flex';
        })();
    </script>
</body>
</html>
