<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>完善个人信息 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #fff;
        }
        .back {
            position: absolute;
            top: 3%;
            left: 4%;
            font-size: 2.2vw;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            -webkit-tap-highlight-color: transparent;
        }
        .back:active {
            opacity: 0.6;
        }
        .header {
            font-size: 2.4vw;
            font-weight: bold;
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            color: #000;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .grid-container {
            position: absolute;
            top: 22%;
            width: 92%;
            left: 4%;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1.2fr 2fr;
            gap: 4%;
            align-items: start;
        }
        .col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 1.8vw;
            font-weight: 500;
            color: #000;
        }
        .img-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: #cccccc;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.6vw;
            color: #666;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 1vw;
            position: relative;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            draggable: false;
        }
        .img-box .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1.6vw;
            line-height: 1.4;
            text-align: center;
        }
        .input-box {
            width: 100%;
            height: 3.8vw;
            background: #cccccc;
            border: none;
            padding: 0 1.5vw;
            font-size: 1.5vw;
            border-radius: 12px;
            margin-top: 1vw;
            outline: none;
            font-family: inherit;
            -webkit-user-select: text;
            user-select: text;
        }
        .input-box::placeholder {
            color: #777;
            font-weight: 400;
            font-size: 1.3vw;
        }
        .tip {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
            font-size: 1.2vw;
            color: #000;
            letter-spacing: 0.02em;
        }
        .btn-confirm {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: #666666;
            color: white;
            font-size: 2.0vw;
            padding: 1vw 7vw;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.05s linear;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-confirm:active {
            transform: translateX(-50%) scale(0.97);
            background: #555555;
        }
        .btn-confirm:disabled {
            background: #999;
            cursor: not-allowed;
            transform: translateX(-50%) scale(1);
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            gap: 2vw;
        }
        .loading-overlay .title-lg {
            font-size: 3vw;
            font-weight: bold;
            color: #333;
        }
        .loading-overlay .sub {
            font-size: 1.6vw;
            color: #666;
            margin-bottom: 1vw;
        }
        .loading-overlay .upload-btn {
            background: #ffb300;
            color: white;
            font-size: 2.2vw;
            padding: 0.8vw 3vw;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .loading-overlay .or-text {
            font-size: 1.4vw;
            color: #999;
            margin: 0.5vw 0;
        }
        .loading-overlay .new-btn {
            background: #666;
            color: white;
            font-size: 2.2vw;
            padding: 0.8vw 3vw;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .hidden-input {
            display: none;
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="title-lg">📂 加载个人数据</div>
            <div class="sub">请上传您之前下载的 data.json 文件，或创建全新数据</div>
            <input type="file" id="dataJsonInput" accept=".json" class="hidden-input" />
            <button class="upload-btn" onclick="document.getElementById('dataJsonInput').click()">📤 选择 data.json</button>
            <div class="or-text">— 或者 —</div>
            <button class="new-btn" onclick="createNewData()">✨ 创建新数据</button>
        </div>

        <div class="back" id="backBtn" onclick="history.back()">← 上一步</div>
        <div class="header">请完善个人信息</div>

        <div class="grid-container">
            <div class="col">
                <div>1. 头像</div>
                <div class="img-box" id="avatarBox">
                    <div class="placeholder" id="avatarPlaceholder">点击从相册选择</div>
                    <input type="file" id="avatarInput" accept="image/*" class="hidden-input" />
                    <img id="avatarPreview" style="display:none;" draggable="false" oncontextmenu="return false" />
                </div>
            </div>
            <div class="col">
                <div>2. 昵称</div>
                <input type="text" class="input-box" id="nickname" placeholder="请输入昵称" />
            </div>
            <div class="col">
                <div>3. 地区</div>
                <input type="text" class="input-box" id="region" placeholder="请输入地区" />
            </div>
            <div class="col">
                <div>4. 主页背景图</div>
                <div class="img-box" id="bgBox">
                    <div class="placeholder" id="bgPlaceholder">点击从相册选择</div>
                    <input type="file" id="bgInput" accept="image/*" class="hidden-input" />
                    <img id="bgPreview" style="display:none;" draggable="false" oncontextmenu="return false" />
                </div>
            </div>
        </div>

        <div class="tip">Tip：昵称和地区一旦保存将无法更改！</div>
        <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>

    <script>
        // ================================================================
        //  统一 data.json 操作函数（与所有页面共享）
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: ''
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        // ================================================================
        //  核心功能
        // ================================================================

        var userData = null;
        var avatarBase64 = null;
        var bgBase64 = null;

        // ---- 加载 data.json 文件（上传） ----
        document.getElementById('dataJsonInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        var parsed = JSON.parse(ev.target.result);
                        // 验证数据结构是否包含 user
                        if (!parsed || !parsed.user) {
                            alert('❌ data.json 格式无效：缺少 user 字段');
                            return;
                        }
                        userData = parsed;
                        fillForm(userData);
                        document.getElementById('loadingOverlay').style.display = 'none';
                        alert('✅ 数据加载成功！欢迎回来，' + (userData.user.nickname || '仙友'));
                    } catch (err) {
                        alert('❌ 文件解析失败：' + err.message);
                    }
                };
                reader.readAsText(this.files[0]);
            }
        });

        // ---- 创建新数据 ----
        function createNewData() {
            userData = createDefaultData();
            fillForm(userData);
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('✅ 已创建新数据，请完善您的个人信息');
        }

        // ---- 填充表单 ----
        function fillForm(data) {
            var u = data.user;
            if (u.nickname && u.nickname !== '云游仙友') {
                document.getElementById('nickname').value = u.nickname;
            }
            if (u.region) {
                document.getElementById('region').value = u.region;
            }
            if (u.avatar && u.avatar !== 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg') {
                avatarBase64 = u.avatar;
                var img = document.getElementById('avatarPreview');
                img.src = u.avatar;
                img.style.display = 'block';
                document.getElementById('avatarPlaceholder').style.display = 'none';
            }
            if (u.bgImage) {
                bgBase64 = u.bgImage;
                var img = document.getElementById('bgPreview');
                img.src = u.bgImage;
                img.style.display = 'block';
                document.getElementById('bgPlaceholder').style.display = 'none';
            }
        }

        // ---- 头像选择 ----
        document.getElementById('avatarBox').addEventListener('click', function() {
            document.getElementById('avatarInput').click();
        });
        document.getElementById('avatarInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    avatarBase64 = ev.target.result;
                    var img = document.getElementById('avatarPreview');
                    img.src = avatarBase64;
                    img.style.display = 'block';
                    document.getElementById('avatarPlaceholder').style.display = 'none';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        // ---- 背景图选择 ----
        document.getElementById('bgBox').addEventListener('click', function() {
            document.getElementById('bgInput').click();
        });
        document.getElementById('bgInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    bgBase64 = ev.target.result;
                    var img = document.getElementById('bgPreview');
                    img.src = bgBase64;
                    img.style.display = 'block';
                    document.getElementById('bgPlaceholder').style.display = 'none';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        // ---- 确定按钮 ----
        document.getElementById('confirmBtn').addEventListener('click', function() {
            var click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            click.volume = 0.5;
            click.play().catch(function() {});

            var nickname = document.getElementById('nickname').value.trim();
            var region = document.getElementById('region').value.trim();

            if (!nickname) { alert('请输入昵称！'); return; }
            if (!region) { alert('请输入地区！'); return; }

            // 如果 userData 为空，创建默认数据
            if (!userData) {
                userData = createDefaultData();
            }

            // 更新数据
            userData.user.nickname = nickname;
            userData.user.region = region;
            if (avatarBase64) {
                userData.user.avatar = avatarBase64;
            } else if (!userData.user.avatar) {
                userData.user.avatar = 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg';
            }
            if (bgBase64) {
                userData.user.bgImage = bgBase64;
            }
            if (!userData.user.role) {
                userData.user.role = '铭'; // 默认角色，后续可在 ChooseRole 修改
            }

            // 保存到 data.json
            saveData(userData);

            if (confirm('✅ 信息已保存！是否下载您的 data.json 数据文件？')) {
                var jsonStr = JSON.stringify(userData, null, 2);
                var blob = new Blob([jsonStr], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            window.location.href = 'Hall.html';
        });

        // ---- 页面初始化：优先从 data.json 加载 ----
        (function init() {
            var data = loadData();
            if (data && data.user && data.user.nickname && data.user.region) {
                userData = data;
                fillForm(userData);
                document.getElementById('loadingOverlay').style.display = 'none';
                return;
            }
            // 如果没有完整数据，显示加载弹窗
            document.getElementById('loadingOverlay').style.display = 'flex';
        })();
    </script>
</body>
</html>
