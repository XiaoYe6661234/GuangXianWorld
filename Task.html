<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>任务 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #f5efe6;
            overflow: hidden;
        }
        .top-bar {
            position: absolute;
            top: 2.5%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3%;
            z-index: 10;
        }
        .btn-back {
            background: #ccc;
            color: #333;
            font-size: 1.8vw;
            font-weight: 700;
            padding: 0.5vw 2vw;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .btn-back:active {
            transform: scale(0.96);
        }
        .page-title {
            font-size: 3.8vw;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 0.06em;
        }
        .notice {
            position: absolute;
            top: 12%;
            left: 5%;
            width: 90%;
            font-size: 1.8vw;
            color: #333;
            line-height: 1.6;
            z-index: 5;
            background: rgba(255, 255, 255, 0.6);
            padding: 1vw 2vw;
            border-radius: 10px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .notice .highlight {
            color: #c0392b;
            font-weight: 700;
        }
        .tasks-container {
            position: absolute;
            top: 24%;
            left: 4%;
            width: 92%;
            height: 66%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2vw 2vw;
            z-index: 5;
            overflow-y: auto;
            padding-bottom: 1vw;
        }
        .tasks-container::-webkit-scrollbar {
            width: 4px;
        }
        .tasks-container::-webkit-scrollbar-thumb {
            background: #aaa;
            border-radius: 4px;
        }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #8a8a8a;
            border-radius: 8px;
            padding: 0.6vw 1.2vw;
            min-height: 4.5vw;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: 0.15s;
        }
        .task-desc {
            flex: 1;
            font-size: 1.5vw;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            padding-right: 1vw;
        }
        .task-desc .reward-tag {
            display: inline-block;
            background: rgba(255, 215, 0, 0.25);
            color: #ffd700;
            font-size: 1.2vw;
            padding: 0.1vw 0.8vw;
            border-radius: 10px;
            margin-left: 0.5vw;
            font-weight: 700;
        }
        .task-btn {
            flex-shrink: 0;
            padding: 0.4vw 1.8vw;
            border: none;
            border-radius: 6px;
            font-size: 1.5vw;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            min-width: 5vw;
            text-align: center;
        }
        .task-btn:active {
            transform: scale(0.95);
        }
        .task-btn.go {
            background: #b0b0b0;
            color: #fff;
        }
        .task-btn.claim {
            background: #ffb300;
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 179, 0, 0.3);
        }
        .task-btn.claim:hover {
            transform: scale(1.03);
        }
        .task-btn.claimed {
            background: #b0b0b0;
            color: #fff;
            cursor: default;
            opacity: 0.7;
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
        @media (max-width: 600px) {
            .page-title {
                font-size: 5vw;
            }
            .btn-back {
                font-size: 2.8vw;
                padding: 0.8vw 3vw;
            }
            .notice {
                font-size: 2.8vw;
                padding: 1.5vw 3vw;
                top: 14%;
            }
            .tasks-container {
                top: 28%;
                gap: 1.5vw;
                height: 60%;
            }
            .task-item {
                padding: 1vw 2vw;
                min-height: 7vw;
            }
            .task-desc {
                font-size: 2.4vw;
            }
            .task-desc .reward-tag {
                font-size: 1.8vw;
            }
            .task-btn {
                font-size: 2.4vw;
                padding: 0.6vw 2.5vw;
                min-width: 8vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <button class="btn-back" onclick="window.location.href='Hall.html'">← 返回大厅</button>
            <div class="page-title">📋 任务</div>
        </div>
        
        <div class="notice">
            开发中...请耐心等待
        </div>
        <div class="tasks-container" id="tasksContainer"></div>
    </div>
</body>
</html>
