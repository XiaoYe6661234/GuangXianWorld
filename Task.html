<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>任务 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #f5efe6;
            overflow: hidden;
        }

        /* ===== 顶部导航 ===== */
        .top-bar {
            position: absolute;
            top: 2.5%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3%;
            z-index: 10;
        }
        .btn-back {
            background: #ccc;
            color: #333;
            font-size: 1.8vw;
            font-weight: bold;
            padding: 0.5vw 2vw;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-back:hover {
            background: #bbb;
            transform: scale(1.02);
        }
        .btn-back:active {
            transform: scale(0.96);
        }
        .page-title {
            font-size: 3.8vw;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 0.06em;
        }

        /* ===== 提示文字 ===== */
        .notice {
            position: absolute;
            top: 12%;
            left: 5%;
            width: 90%;
            font-size: 1.8vw;
            color: #333;
            line-height: 1.6;
            z-index: 5;
            background: rgba(255, 255, 255, 0.6);
            padding: 1vw 2vw;
            border-radius: 10px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .notice .highlight {
            color: #c0392b;
            font-weight: 700;
        }

        /* ===== 任务列表 ===== */
        .tasks-container {
            position: absolute;
            top: 24%;
            left: 4%;
            width: 92%;
            height: 66%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vw 2.5vw;
            z-index: 5;
            overflow-y: auto;
            padding-bottom: 1vw;
        }
        .tasks-container::-webkit-scrollbar {
            width: 4px;
        }
        .tasks-container::-webkit-scrollbar-thumb {
            background: #aaa;
            border-radius: 4px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #7a7a7a;
            border-radius: 8px;
            padding: 0.6vw 1.2vw;
            min-height: 4.5vw;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: 0.15s;
        }
        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .task-desc {
            flex: 1;
            font-size: 1.6vw;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            padding-right: 1vw;
        }
        .task-desc .reward-tag {
            display: inline-block;
            background: rgba(255, 215, 0, 0.25);
            color: #ffd700;
            font-size: 1.2vw;
            padding: 0.1vw 0.8vw;
            border-radius: 10px;
            margin-left: 0.5vw;
            font-weight: 700;
        }

        .task-btn {
            flex-shrink: 0;
            padding: 0.4vw 2vw;
            border: none;
            border-radius: 6px;
            font-size: 1.6vw;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            min-width: 6vw;
            text-align: center;
        }
        .task-btn:active {
            transform: scale(0.95);
        }

        .task-btn.go {
            background: #b0b0b0;
            color: #fff;
            cursor: pointer;
        }
        .task-btn.go:hover {
            background: #9a9a9a;
        }

        .task-btn.claim {
            background: #ffb300;
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 179, 0, 0.3);
        }
        .task-btn.claim:hover {
            background: #ffa000;
            transform: scale(1.03);
        }

        .task-btn.claimed {
            background: #b0b0b0;
            color: #fff;
            cursor: default;
            opacity: 0.7;
        }

        /* ===== 响应式 ===== */
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
        @media (max-width: 600px) {
            .page-title {
                font-size: 5vw;
            }
            .btn-back {
                font-size: 2.8vw;
                padding: 0.8vw 3vw;
            }
            .notice {
                font-size: 2.8vw;
                padding: 1.5vw 3vw;
                top: 14%;
            }
            .tasks-container {
                top: 28%;
                gap: 1.5vw;
                height: 60%;
            }
            .task-item {
                padding: 1vw 2vw;
                min-height: 7vw;
            }
            .task-desc {
                font-size: 2.4vw;
            }
            .task-desc .reward-tag {
                font-size: 1.8vw;
            }
            .task-btn {
                font-size: 2.4vw;
                padding: 0.6vw 3vw;
                min-width: 10vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="top-bar">
            <button class="btn-back" onclick="goBackToHall()">← 返回大厅</button>
            <div class="page-title">📋 任务</div>
        </div>

        <!-- 提示文字 -->
        <div class="notice">
            ⚠️ 注意，该任务每 <strong>3天</strong> 会自动刷新，并且完成任务请及时到此页面领取奖励，<span class="highlight">刷新后之前的任务奖励无法获取</span>。
        </div>

        <!-- 任务列表 -->
        <div class="tasks-container" id="tasksContainer"></div>
    </div>

    <script>
        // ================================================================
        //  1. 统一 data.json 操作
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: '',
                    adWatchCount: 0,
                    adWatchDate: '',
                    // 赚钱相关
                    moneyPicks: 0,
                    moneyPickDate: '',
                    // 抽奖相关
                    hasDrawnBefore: false,
                    totalDraws: 0,
                    tenDrawsCount: 0,
                    // 任务系统追踪数据
                    taskData: {
                        monstersKilled: 0,
                        healItemsUsed: 0,
                        bossesKilled: 0,
                        minionsKilled: 0,
                        coinsSpent: 0,
                        coinsGained: 0,
                        nicknameChanges: 0,
                        avatarChanges: 0,
                        hardModeWins: 0,
                        totalDraws: 0,
                        tenDrawsCount: 0,
                        moneyPicks: 0
                    },
                    // 任务系统刷新数据
                    taskRefreshDate: '',
                    currentTasks: [],
                    taskStates: {}
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        // ================================================================
        //  2. 任务定义
        // ================================================================

        var ALL_TASKS = [{
            id: 'kill_50_monsters',
            desc: '击败50只怪物',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.monstersKilled || 0) >= 50;
            }
        }, {
            id: 'use_3_heal_items',
            desc: '使用3个回血道具',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.healItemsUsed || 0) >= 3;
            }
        }, {
            id: 'reach_level_10',
            desc: '等级达到LV10',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.level || 0) >= 10;
            }
        }, {
            id: 'reach_level_20',
            desc: '等级达到LV20',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.level || 0) >= 20;
            }
        }, {
            id: 'kill_3_bosses',
            desc: '击败3只BOSS',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.bossesKilled || 0) >= 3;
            }
        }, {
            id: 'kill_50_minions',
            desc: '击败50只小兵小怪',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.minionsKilled || 0) >= 50;
            }
        }, {
            id: 'spend_50_coins',
            desc: '消费50广仙币',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.coinsSpent || 0) >= 50;
            }
        }, {
            id: 'spend_500_coins',
            desc: '消费500广仙币',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.coinsSpent || 0) >= 500;
            }
        }, {
            id: 'gain_500_coins',
            desc: '获得500广仙币',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.coinsGained || 0) >= 500;
            }
        }, {
            id: 'change_nickname',
            desc: '更改一次昵称',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.nicknameChanges || 0) >= 1;
            }
        }, {
            id: 'change_avatar',
            desc: '更改一次头像',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.taskData?.avatarChanges || 0) >= 1;
            }
        }, {
            id: 'reach_level_5',
            desc: '等级升级到LV5',
            reward: 250,
            category: 'left',
            check: function(data) {
                return (data.user.level || 0) >= 5;
            }
        }, {
            id: 'kill_10_bosses',
            desc: '击败10只BOSS',
            reward: 500,
            category: 'right',
            check: function(data) {
                return (data.user.taskData?.bossesKilled || 0) >= 10;
            }
        }, {
            id: 'kill_25_monsters',
            desc: '击败25只任意怪物',
            reward: 500,
            category: 'right',
            check: function(data) {
                return (data.user.taskData?.monstersKilled || 0) >= 25;
            }
        }, {
            id: 'win_hard_mode',
            desc: '胜利一次超难模式',
            reward: 500,
            category: 'right',
            check: function(data) {
                return (data.user.taskData?.hardModeWins || 0) >= 1;
            }
        }, {
            id: 'draw_once',
            desc: '抽一次奖',
            reward: 500,
            category: 'right',
            check: function(data) {
                return (data.user.taskData?.totalDraws || 0) >= 1;
            }
        }, {
            id: 'draw_ten_times',
            desc: '完成一次10连抽',
            reward: 500,
            category: 'right',
            check: function(data) {
                return (data.user.taskData?.tenDrawsCount || 0) >= 1;
            }
        }, {
            id: 'pick_card_once',
            desc: '去赚钱页面翻一次卡牌',
            reward: 500,
            category: 'right',
            check: function(data) {
                return (data.user.taskData?.moneyPicks || 0) >= 1;
            }
        }];

        // ================================================================
        //  3. 任务系统核心逻辑
        // ================================================================

        function checkTaskRefresh(data) {
            if (!data.user.taskRefreshDate) {
                refreshTasks(data);
                return;
            }
            var lastRefresh = new Date(data.user.taskRefreshDate);
            var now = new Date();
            var diffDays = (now - lastRefresh) / (1000 * 60 * 60 * 24);
            if (diffDays >= 3) {
                refreshTasks(data);
            }
        }

        function refreshTasks(data) {
            // 检查是否有未领取的任务
            var unclaimed = false;
            var states = data.user.taskStates || {};
            var current = data.user.currentTasks || [];
            for (var i = 0; i < current.length; i++) {
                if (states[current[i]] === 'completed') {
                    unclaimed = true;
                    break;
                }
            }
            if (unclaimed) {
                alert('⚠️ 有未领取的任务奖励即将失效，请先领取！');
                return;
            }

            // 重置任务数据
            data.user.taskData = {
                monstersKilled: 0,
                healItemsUsed: 0,
                bossesKilled: 0,
                minionsKilled: 0,
                coinsSpent: 0,
                coinsGained: 0,
                nicknameChanges: 0,
                avatarChanges: 0,
                hardModeWins: 0,
                totalDraws: 0,
                tenDrawsCount: 0,
                moneyPicks: 0
            };

            // 随机抽取10个任务
            var shuffled = ALL_TASKS.slice();
            for (var i = shuffled.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = shuffled[i];
                shuffled[i] = shuffled[j];
                shuffled[j] = temp;
            }
            var selected = shuffled.slice(0, 10);

            // 确保左右各5个
            var leftTasks = [];
            var rightTasks = [];
            for (var i = 0; i < selected.length; i++) {
                if (selected[i].category === 'left' && leftTasks.length < 5) {
                    leftTasks.push(selected[i]);
                } else if (selected[i].category === 'right' && rightTasks.length < 5) {
                    rightTasks.push(selected[i]);
                }
            }
            // 补充
            while (leftTasks.length < 5) {
                var fallback = ALL_TASKS.filter(function(t) { return t.category === 'left'; });
                var idx = Math.floor(Math.random() * fallback.length);
                // 避免重复
                var exists = false;
                for (var k = 0; k < leftTasks.length; k++) {
                    if (leftTasks[k].id === fallback[idx].id) { exists = true; break; }
                }
                if (!exists) {
                    leftTasks.push(fallback[idx]);
                } else {
                    // 简单处理：直接再试一次
                }
            }
            while (rightTasks.length < 5) {
                var fallback = ALL_TASKS.filter(function(t) { return t.category === 'right'; });
                var idx = Math.floor(Math.random() * fallback.length);
                var exists = false;
                for (var k = 0; k < rightTasks.length; k++) {
                    if (rightTasks[k].id === fallback[idx].id) { exists = true; break; }
                }
                if (!exists) {
                    rightTasks.push(fallback[idx]);
                }
            }

            var finalTasks = leftTasks.concat(rightTasks);
            data.user.currentTasks = finalTasks.map(function(t) { return t.id; });
            data.user.taskStates = {};
            for (var i = 0; i < finalTasks.length; i++) {
                data.user.taskStates[finalTasks[i].id] = 'not_started';
            }
            data.user.taskRefreshDate = new Date().toISOString().split('T')[0];
            saveData(data);
        }

        function getTaskById(id) {
            for (var i = 0; i < ALL_TASKS.length; i++) {
                if (ALL_TASKS[i].id === id) return ALL_TASKS[i];
            }
            return null;
        }

        function updateTaskStates(data) {
            var current = data.user.currentTasks || [];
            var states = data.user.taskStates || {};
            var changed = false;
            for (var i = 0; i < current.length; i++) {
                var taskId = current[i];
                var taskDef = getTaskById(taskId);
                if (!taskDef) continue;
                if (states[taskId] === 'not_started' && taskDef.check(data)) {
                    states[taskId] = 'completed';
                    changed = true;
                }
            }
            if (changed) {
                data.user.taskStates = states;
                saveData(data);
            }
        }

        function claimTask(taskId) {
            var data = loadData();
            if (!data) return;
            var states = data.user.taskStates || {};
            if (states[taskId] !== 'completed') return;
            var taskDef = getTaskById(taskId);
            if (!taskDef) return;
            // 发放奖励
            data.user.coins = (data.user.coins || 0) + taskDef.reward;
            states[taskId] = 'claimed';
            data.user.taskStates = states;
            saveData(data);
            renderTasks();
            alert('🎉 恭喜获得 ' + taskDef.reward + ' 广仙币！');
        }

        // ================================================================
        //  4. UI 渲染
        // ================================================================

        function renderTasks() {
            var data = loadData();
            if (!data) return;
            var container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            var current = data.user.currentTasks || [];
            var states = data.user.taskStates || {};
            // 按 category 分组
            var leftTasks = [];
            var rightTasks = [];
            for (var i = 0; i < current.length; i++) {
                var taskDef = getTaskById(current[i]);
                if (taskDef) {
                    if (taskDef.category === 'left') {
                        leftTasks.push(taskDef);
                    } else {
                        rightTasks.push(taskDef);
                    }
                }
            }
            // 排序：左边先渲染，右边后渲染
            var orderedTasks = leftTasks.concat(rightTasks);
            for (var i = 0; i < orderedTasks.length; i++) {
                var task = orderedTasks[i];
                var state = states[task.id] || 'not_started';
                var div = document.createElement('div');
                div.className = 'task-item';

                var descSpan = document.createElement('span');
                descSpan.className = 'task-desc';
                descSpan.innerHTML = task.desc + ' <span class="reward-tag">💰+' + task.reward + '</span>';
                div.appendChild(descSpan);

                var btn = document.createElement('button');
                btn.className = 'task-btn';
                if (state === 'not_started') {
                    btn.className += ' go';
                    btn.innerText = '前往';
                    btn.onclick = function() {
                        window.location.href = 'Game.html';
                    };
                } else if (state === 'completed') {
                    btn.className += ' claim';
                    btn.innerText = '领取';
                    btn.onclick = function() {
                        claimTask(task.id);
                    };
                } else {
                    btn.className += ' claimed';
                    btn.innerText = '已领取';
                    btn.disabled = true;
                }
                div.appendChild(btn);
                container.appendChild(div);
            }
        }

        // ================================================================
        //  5. 页面初始化
        // ================================================================

        function init() {
            var data = loadData();
            if (!data) {
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user) {
                alert('数据异常，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user.role) {
                window.location.href = 'ChooseRole.html';
                return;
            }
            if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                window.location.href = 'PersonalInformation.html';
                return;
            }

            // 检查任务刷新
            checkTaskRefresh(data);
            // 更新任务状态
            updateTaskStates(data);
            // 渲染任务
            renderTasks();
        }

        function goBackToHall() {
            window.location.href = 'Hall.html';
        }

        // 启动
        init();

        console.log('📋 广仙世界 · 任务系统已加载');
        console.log('📖 共 ' + ALL_TASKS.length + ' 个任务，每3天随机刷新10个');
        console.log('💾 数据与 data.json 完全互通');
    </script>
</body>
</html>
