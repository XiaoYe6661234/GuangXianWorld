<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广仙世界大厅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            overflow: hidden;
            background: #f0f0f0;
        }
        .hall-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/Lobby Background.png');
            background-size: cover;
            background-position: center;
        }
        .top-bar {
            position: absolute;
            top: 3%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2%;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-adventure {
            background: #ffb300;
            color: white;
            font-size: 2.8vw;
            padding: 0.6vw 2.5vw;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-adventure:active {
            transform: scale(0.97);
        }
        .currency-box {
            background: #e0e0e0;
            border-radius: 20px;
            padding: 0.3vw 1.5vw;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 2.5vw;
            gap: 1vw;
        }
        .currency-box img {
            width: 3vw;
            height: 3vw;
        }
        .currency-box .add-btn {
            background: #666;
            color: white;
            width: 3.2vw;
            height: 3.2vw;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 2.2vw;
            font-weight: bold;
        }
        .top-icons {
            display: flex;
            gap: 1.5vw;
            align-items: center;
        }
        .top-icons img {
            width: 4vw;
            cursor: pointer;
            transition: 0.1s;
        }
        .top-icons img:active {
            transform: scale(0.95);
        }
        .user-card {
            position: absolute;
            bottom: 5%;
            left: 2%;
            display: flex;
            flex-direction: column;
            gap: 0.5vw;
            z-index: 10;
            cursor: pointer;
        }
        .user-card img {
            width: 9vw;
            height: 9vw;
            border: 3px solid white;
            border-radius: 4px;
            object-fit: cover;
            background: #ccc;
        }
        .user-info .nickname {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 2.2vw;
            font-weight: bold;
            padding: 0.3vw 1.5vw;
            border-radius: 6px;
            margin-bottom: 0.3vw;
        }
        .user-info .lvl {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 2.8vw;
            font-weight: bold;
            padding: 0.3vw 1.5vw;
            border-radius: 6px;
        }
        .pet-btn {
            position: absolute;
            bottom: 5%;
            right: 2%;
            width: 8vw;
            height: 8vw;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border: 3px solid black;
        }
        .pet-btn img {
            width: 5vw;
            height: 5vw;
        }
        .center-char {
            position: absolute;
            left: 50%;
            top: 18%;
            transform: translateX(-50%);
            height: 65%;
            z-index: 5;
        }
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .modal-content {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/Setting background.jpg');
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
        }
        .modal-close {
            position: absolute;
            top: 2%;
            right: 3%;
            font-size: 5vw;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            z-index: 25;
            line-height: 1;
        }
        .notice-tabs {
            position: absolute;
            top: 0;
            left: 0;
            width: 15%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: 5%;
        }
        .tab-item {
            font-size: 3.5vw;
            font-weight: bold;
            padding: 2vw 0;
            text-align: center;
            cursor: pointer;
            color: #000;
        }
        .tab-item.active {
            border-left: 1vw solid #ff9900;
        }
        .notice-content {
            position: absolute;
            top: 0;
            left: 15%;
            width: 85%;
            height: 100%;
            padding: 5% 8%;
        }
        .modal-title {
            text-align: center;
            font-size: 4vw;
            font-weight: bold;
            margin-bottom: 4vw;
            color: #000;
        }
        .notice-text {
            font-size: 2.5vw;
            line-height: 1.6;
            margin-bottom: 5vw;
        }
        .modal-btn {
            background: #ff8800;
            color: white;
            font-size: 3vw;
            border: none;
            border-radius: 8px;
            padding: 1vw 6vw;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-btn.disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .recharge-container {
            padding: 8% 5%;
        }
        .recharge-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 18%;
            cursor: pointer;
        }
        .recharge-item .coin-box {
            width: 100%;
            aspect-ratio: 1/1;
            border: 0.5vw solid #ff9900;
            background: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5vw;
        }
        .recharge-item img {
            width: 60%;
        }
        .recharge-item .amount {
            font-size: 2.5vw;
            font-weight: bold;
        }
        .settings-container {
            padding: 8% 8%;
        }
        .settings-row {
            display: flex;
            align-items: center;
            margin-bottom: 3vw;
            font-size: 2.5vw;
            gap: 1.5vw;
        }
        .settings-row input[type=range] {
            width: 45%;
            height: 1.5vw;
            accent-color: #666;
        }
        .settings-btn {
            background: #666;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.8vw 3vw;
            font-size: 2.2vw;
            cursor: pointer;
            font-weight: bold;
        }
        .profile-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .profile-left {
            width: 55%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-left img {
            height: 70%;
        }
        .profile-right {
            width: 45%;
            height: 100%;
            padding: 5% 3%;
            position: relative;
        }
        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 1.5vw;
            margin-bottom: 3vw;
        }
        .profile-avatar {
            width: 10vw;
            height: 10vw;
            border: 3px solid white;
            border-radius: 4px;
            object-fit: cover;
            background: #ccc;
            cursor: pointer;
        }
        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 0.8vw;
            flex: 1;
        }
        .profile-nickname {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 2.5vw;
            font-weight: bold;
            padding: 0.4vw 1.5vw;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            outline: none;
            width: 100%;
        }
        .profile-details {
            display: flex;
            gap: 1vw;
        }
        .profile-lvl,
        .profile-region {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 2.2vw;
            font-weight: bold;
            padding: 0.3vw 1.2vw;
            border-radius: 6px;
        }
        .profile-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            cursor: pointer;
        }
        .profile-join {
            font-size: 2.2vw;
            margin-top: 2vw;
        }
        .profile-save-btn {
            position: absolute;
            bottom: 5%;
            right: 5%;
            background: #ff8800;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.8vw 3vw;
            font-size: 2vw;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }
        .hidden-input {
            display: none;
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hall-bg"></div>

        <div class="top-bar">
            <button class="btn-adventure" id="adventureBtn">开始冒险!</button>
            <div class="currency-box">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/CuangXianCoin.png" alt="金币" />
                <span id="coinDisplay">1000</span>
                <div class="add-btn" onclick="openModal('recharge')">+</div>
            </div>
            <div class="top-icons">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/email.png" alt="邮件" onclick="openModal('mail')" />
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Notice.png" alt="公告" onclick="openModal('notice')" />
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Volume on.png" id="volIcon" alt="音量" onclick="toggleBGM()" />
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/setting.png" alt="设置" onclick="openModal('settings')" />
            </div>
        </div>

        <div class="user-card" onclick="openModal('profile')">
            <img id="avatarDisplay" src="https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg" alt="头像" />
            <div class="user-info">
                <div class="nickname" id="nickDisplay">昵称</div>
                <div class="lvl" id="lvlDisplay">LV.1</div>
            </div>
        </div>

       

        <img src="https://xiaoye6661234.github.io/GuangXianWorld/Ming.png" class="center-char" id="centerChar" alt="角色" />

        <div id="modalOverlay" class="modal-overlay">
            <div class="modal-content" id="modalContent">
                <div class="modal-close" onclick="closeModal()">✕</div>
                <div id="modalBody"></div>
            </div>
        </div>

        <input type="file" id="avatarEditInput" accept="image/*" class="hidden-input" />
        <input type="file" id="bgEditInput" accept="image/*" class="hidden-input" />
    </div>

    <script>
        // ========== 全局数据 ==========
        let currentModal = '';
        let gData = {};
        let isProfileEditing = false;
        let tempNickname = '';
        let tempAvatar = '';
        let tempBgImage = '';

        // ========== 数据加载与完整性检查 ==========
        function loadData() {
            const raw = localStorage.getItem('GuangXianData');
            if (!raw) {
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            try {
                gData = JSON.parse(raw);
                if (!gData.user) {
                    alert('数据异常，请重新登录！');
                    window.location.href = 'Signin.html';
                    return;
                }
                if (!gData.user.role) {
                    window.location.href = 'ChooseRole.html';
                    return;
                }
                if (!gData.user.nickname || gData.user.nickname === '云游仙友' || !gData.user.region) {
                    window.location.href = 'PersonalInformation.html';
                    return;
                }
                updateUI();
            } catch (e) {
                alert('数据损坏，请重新登录！');
                window.location.href = 'Signin.html';
            }
        }

        // 更新所有UI显示
        function updateUI() {
            document.getElementById('coinDisplay').innerText = gData.user.coins || 0;
            document.getElementById('nickDisplay').innerText = gData.user.nickname || '仙友';
            document.getElementById('lvlDisplay').innerText = 'LV.' + (gData.user.level || 1);
            if (gData.user.avatar) {
                document.getElementById('avatarDisplay').src = gData.user.avatar;
            }
            if (gData.user.role === '清') {
                document.getElementById('centerChar').src = 'https://xiaoye6661234.github.io/GuangXianWorld/Qing.png';
            } else {
                document.getElementById('centerChar').src = 'https://xiaoye6661234.github.io/GuangXianWorld/Ming.png';
            }
        }

        // 保存数据到 localStorage
        function saveData() {
            localStorage.setItem('GuangXianData', JSON.stringify(gData));
            // 自动导出 data.json（静默下载）
            autoExportData();
        }

        // ========== 自动导出 data.json ==========
        function autoExportData() {
            try {
                const jsonStr = JSON.stringify(gData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.warn('自动导出 data.json 失败:', e);
            }
        }

        // ========== 手动导出 data.json（供设置按钮调用） ==========
        function manualExportData() {
            playClickSound();
            try {
                const jsonStr = JSON.stringify(gData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('✅ data.json 已导出！');
            } catch (e) {
                alert('❌ 导出失败: ' + e.message);
            }
        }

        // 页面加载
        loadData();

        // ========== 弹窗管理 ==========
        function openModal(type) {
            currentModal = type;
            isProfileEditing = false;
            document.getElementById('modalOverlay').style.display = 'flex';
            const body = document.getElementById('modalBody');
            playClickSound();

            if (type === 'mail') {
                body.innerHTML = `
                    <div style="padding:8% 5%;">
                        <div class="modal-title">📧 官方邮件</div>
                        <div style="font-size:2vw; line-height:1.6; background: rgba(255,255,255,0.7); padding:3vw; border-radius:10px;">
                            <p><strong>主题：</strong> 欢迎登录广仙世界</p>
                            <p><strong>内容：</strong> 尊敬的仙友 ${gData.user.nickname || '道友'}，欢迎来到广仙世界！<br />祝您在此修仙路上，快意恩仇，逍遥自在！</p>
                            <p style="margin-top:2vw; color:#555;">—— 广仙世界运营团队</p>
                        </div>
                    </div>
                `;
            } else if (type === 'notice') {
                const today = new Date().toISOString().split('T')[0];
                const isDailyClaimed = gData.user.lastDailyWelfare === today;
                const isNoticeClaimed = gData.user.hasClaimedNotice || false;
                body.innerHTML = `
                    <div class="notice-tabs">
                        <div class="tab-item active" onclick="switchTab('notice')">公告</div>
                        <div class="tab-item" onclick="switchTab('signin')">签到</div>
                    </div>
                    <div class="notice-content">
                        <div class="modal-title">公告</div>
                        <div class="notice-text">
                            广仙世界今天正式上架，所以，我们特意为所有用户们准备了1000广仙币作为福利！
                        </div>
                        <button class="modal-btn" id="claimNoticeBtn" onclick="claimNotice()" ${isNoticeClaimed ? 'disabled' : ''}>
                            ${isNoticeClaimed ? '✅ 已领取' : '领取'}
                        </button>
                    </div>
                `;
            } else if (type === 'recharge') {
                body.innerHTML = `
                    <div class="recharge-container">
                        <div class="modal-title">充值广仙币</div>
                        <div style="margin-top:5vw;">
                            <div style="font-size:3vw; font-weight:bold; margin-bottom:2vw;">每日免费</div>
                            <div class="recharge-item" onclick="receiveFree()">
                                <div class="coin-box">
                                    <img src="https://xiaoye6661234.github.io/GuangXianWorld/CuangXianCoin.png" />
                                </div>
                                <div class="amount">×250</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (type === 'settings') {
                const vol = gData.user.settings?.bgmVolume || 50;
                const sfx = gData.user.settings?.sfxVolume || 50;
                body.innerHTML = `
                    <div class="settings-container">
                        <div class="modal-title">设置</div>
                        <div class="settings-row">
                            <span>背景音乐:</span>
                            <input type="range" min="0" max="100" value="${vol}" onchange="setBGMVol(this.value)" />
                            <span>${vol}%</span>
                        </div>
                        <div class="settings-row">
                            <span>音效设置:</span>
                            <input type="range" min="0" max="100" value="${sfx}" onchange="setSFXVol(this.value)" />
                            <span>${sfx}%</span>
                       </div>
                          
                        <div class="settings-row">
                            <span>清除数据</span>
                            <button class="settings-btn" onclick="clearData()">清除</button>
                        </div>
                        <div class="settings-row">
                            <span>重置密码</span>
                            <button class="settings-btn" onclick="resetPass()">验证</button>
                        </div>
                    </div>
                `;
            } else if (type === 'profile') {
                const joinDate = gData.user.joinedDate ? new Date(gData.user.joinedDate) : new Date();
                const now = new Date();
                const years = now.getFullYear() - joinDate.getFullYear();
                const bgImage = gData.user.bgImage || 'https://xiaoye6661234.github.io/GuangXianWorld/Lobby Background.png';
                const charImg = gData.user.role === '清' ?
                    'https://xiaoye6661234.github.io/GuangXianWorld/Qing.png' :
                    'https://xiaoye6661234.github.io/GuangXianWorld/Ming.png';

                tempNickname = gData.user.nickname;
                tempAvatar = gData.user.avatar;
                tempBgImage = bgImage;

                body.innerHTML = `
                    
                    <div class="profile-container">
                        <div class="profile-left" style="background-image: url('${bgImage}');">
                            <img src="${charImg}" alt="角色" />
                        </div>
                        <div class="profile-right">
                            <div class="profile-bg" id="profileBg" onclick="editBgImage()" style="background-image: url('${bgImage}');"></div>
                            <div class="profile-header">
                            
                            
                                <img src="${gData.user.avatar || 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg'}" 
                                     class="profile-avatar" id="profileAvatar" onclick="editAvatar()" alt="头像" />
                                <div class="profile-info">
                                    <div class="profile-nickname" id="profileNickname" onclick="editNickname()">${gData.user.nickname}</div>
                                    <div class="profile-details">
                                        <div class="profile-lvl">LV.${gData.user.level || 1}</div>
                                        <div class="profile-region">${gData.user.region || '未知'}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="profile-join">
                                你已经加入广仙世界${years}年了！
                            </div>
                            <button class="profile-save-btn" id="profileSaveBtn" onclick="saveProfileChanges()">保存</button>
                        </div>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            isProfileEditing = false;
        }

        function switchTab(tab) {
            playClickSound();
            document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`.tab-item[onclick="switchTab('${tab}')"]`).classList.add('active');

            const content = document.querySelector('.notice-content');
            if (tab === 'notice') {
                const isNoticeClaimed = gData.user.hasClaimedNotice || false;
                content.innerHTML = `
                    <div class="modal-title">公告</div>
                    <div class="notice-text">
                        广仙世界今天正式上架，所以，我们特意为所有用户们准备了1000广仙币作为福利！
                    </div>
                    <button class="modal-btn" id="claimNoticeBtn" onclick="claimNotice()" ${isNoticeClaimed ? 'disabled' : ''}>
                        ${isNoticeClaimed ? '✅ 已领取' : '领取'}
                    </button>
                `;
            } else if (tab === 'signin') {
                const today = new Date().toISOString().split('T')[0];
                const isDailyClaimed = gData.user.lastDailyWelfare === today;
                content.innerHTML = `
                    <div class="modal-title">每日签到</div>
                    <div class="notice-text" style="text-align:center;">
                        今日可领 <strong style="color:#ff5500;">100～250</strong> 广仙币（随机）
                    </div>
                    <button class="modal-btn" id="claimDailyBtn" onclick="claimDailyWelfare()" ${isDailyClaimed ? 'disabled' : ''}>
                        ${isDailyClaimed ? '✅ 今日已签到' : '立即签到'}
                    </button>
                `;
            }
        }

        // ========== 个人中心编辑功能 ==========
        function editAvatar() {
            playClickSound();
            document.getElementById('avatarEditInput').click();
        }

        function editBgImage() {
            playClickSound();
            document.getElementById('bgEditInput').click();
        }

        function editNickname() {
            playClickSound();
            if (isProfileEditing) return;
            const nickEl = document.getElementById('profileNickname');
            const currentNick = nickEl.textContent;
            nickEl.innerHTML =
                `<input type="text" id="nickInput" value="${currentNick}" style="width:100%; background:transparent; border:none; color:white; font-size:inherit; font-weight:inherit; outline:none;" />`;
            document.getElementById('nickInput').focus();
            showSaveButton();
        }

        function showSaveButton() {
            isProfileEditing = true;
            document.getElementById('profileSaveBtn').style.display = 'block';
        }

        document.getElementById('avatarEditInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    tempAvatar = ev.target.result;
                    document.getElementById('profileAvatar').src = tempAvatar;
                    showSaveButton();
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        document.getElementById('bgEditInput').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    tempBgImage = ev.target.result;
                    document.getElementById('profileBg').style.backgroundImage = `url('${tempBgImage}')`;
                    document.querySelector('.profile-left').style.backgroundImage = `url('${tempBgImage}')`;
                    showSaveButton();
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        function saveProfileChanges() {
            playClickSound();
            const nickInput = document.getElementById('nickInput');
            if (nickInput) {
                tempNickname = nickInput.value.trim();
                if (!tempNickname) {
                    alert('昵称不能为空！');
                    return;
                }
            }
            gData.user.nickname = tempNickname;
            gData.user.avatar = tempAvatar;
            gData.user.bgImage = tempBgImage;
            saveData();
            updateUI();

            if (confirm('信息已保存！是否下载更新后的 data.json 数据文件？')) {
                const blob = new Blob([JSON.stringify(gData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                a.click();
                URL.revokeObjectURL(url);
            }
            isProfileEditing = false;
            document.getElementById('profileSaveBtn').style.display = 'none';
            openModal('profile');
        }

        // ========== 领取功能 ==========
        function claimNotice() {
            playClickSound();
            if (gData.user.hasClaimedNotice) {
                alert('你已经领取过公告福利了！');
                return;
            }
            gData.user.coins = (gData.user.coins || 0) + 1000;
            gData.user.hasClaimedNotice = true;
            saveData();
            updateUI();
            const btn = document.getElementById('claimNoticeBtn');
            if (btn) {
                btn.innerText = '✅ 已领取';
                btn.disabled = true;
                btn.classList.add('disabled');
            }
            alert('🎉 恭喜领取 1000 广仙币！');
        }

        function claimDailyWelfare() {
            playClickSound();
            const today = new Date().toISOString().split('T')[0];
            if (gData.user.lastDailyWelfare === today) {
                alert('今日已领取，明天再来吧！');
                return;
            }
            const amount = Math.floor(Math.random() * 151) + 100;
            gData.user.coins = (gData.user.coins || 0) + amount;
            gData.user.lastDailyWelfare = today;
            saveData();
            updateUI();
            const btn = document.getElementById('claimDailyBtn');
            if (btn) {
                btn.innerText = '✅ 今日已签到';
                btn.disabled = true;
                btn.classList.add('disabled');
            }
            alert(`🎉 恭喜获得 ${amount} 广仙币！`);
        }

        function receiveFree() {
            playClickSound();
            const today = new Date().toISOString().split('T')[0];
            if (!gData.user.lastFreeClaim || gData.user.lastFreeClaim !== today) {
                gData.user.coins = (gData.user.coins || 0) + 250;
                gData.user.lastFreeClaim = today;
                saveData();
                updateUI();
                alert('🎉 领取成功！获得 250 广仙币');
                closeModal();
            } else {
                alert('今日已领取！');
            }
        }

        // ========== 设置功能 ==========
        function setBGMVol(val) {
            if (!gData.user.settings) gData.user.settings = {};
            gData.user.settings.bgmVolume = parseInt(val);
            saveData();
            let bgm = document.querySelector('audio.bgm-player');
            if (!bgm) {
                bgm = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/BGM1.mp3');
                bgm.loop = true;
                bgm.volume = parseInt(val) / 100;
                bgm.play().catch(e => {});
                bgm.classList.add('bgm-player');
                document.body.appendChild(bgm);
            } else {
                bgm.volume = parseInt(val) / 100;
            }
            event.target.nextElementSibling.textContent = val + '%';
        }

        function setSFXVol(val) {
            if (!gData.user.settings) gData.user.settings = {};
            gData.user.settings.sfxVolume = parseInt(val);
            saveData();
            event.target.nextElementSibling.textContent = val + '%';
        }

        function toggleBGM() {
            playClickSound();
            const icon = document.getElementById('volIcon');
            let bgm = document.querySelector('audio.bgm-player');
            if (!bgm) {
                bgm = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/BGM1.mp3');
                bgm.loop = true;
                bgm.volume = (gData.user.settings?.bgmVolume || 50) / 100;
                bgm.classList.add('bgm-player');
                document.body.appendChild(bgm);
            }
            if (bgm.paused) {
                bgm.play().catch(e => {});
                icon.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Volume on.png';
            } else {
                bgm.pause();
                icon.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Volume off.png';
            }
        }

        function clearData() {
            playClickSound();
            if (confirm('确定要清除所有数据吗？此操作不可恢复！')) {
                localStorage.removeItem('GuangXianData');
                alert('数据已清除！即将跳转回登录页。');
                window.location.href = 'Signin.html';
            }
        }

        function resetPass() {
            playClickSound();
            const newPass = prompt("请输入新的密码：");
            if (newPass && newPass.length > 0) {
                gData.user.password = newPass;
                saveData();
                alert("密码重置成功！");
                closeModal();
            }
        }

        function playClickSound() {
            let click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            click.volume = (gData.user.settings?.sfxVolume || 50) / 100;
            click.play().catch(e => {});
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('adventureBtn').addEventListener('click', function() {
            playClickSound();
            window.location.href = 'Game.html';
        });
    </script>
</body>
</html>
