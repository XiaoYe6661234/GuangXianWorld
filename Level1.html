<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>广仙世界 - 第一章</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: #2d5e2b;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            background: #87ceeb;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .ui-layer>* {
            pointer-events: auto;
        }

        /* 左上玩家信息 */
        #playerInfo {
            position: absolute;
            top: 1.5%;
            left: 1.5%;
            display: flex;
            align-items: center;
            gap: 0.6vw;
        }
        #avatarBox {
            width: 6vw;
            height: 6vw;
            border: 2px solid white;
            border-radius: 4px;
            overflow: hidden;
            background: #ccc;
        }
        #avatarBox img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-text {
            display: flex;
            flex-direction: column;
            gap: 0.3vw;
        }
        .info-text .nickname {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.3vw;
            font-weight: bold;
            padding: 0.15vw 1vw;
            border-radius: 4px;
        }
        .info-text .lvl {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.7vw;
            font-weight: bold;
            padding: 0.15vw 1vw;
            border-radius: 4px;
        }

        /* 血条 */
        #hpBarContainer {
            position: absolute;
            top: 2.5%;
            left: 30%;
            width: 35%;
            height: 3vw;
            background: #cc0000;
            border: 0.25vw solid #ff9900;
            border-radius: 5px;
            overflow: hidden;
        }
        #hpBarInner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d61a1a, #ff4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6vw;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px black;
        }

        /* 返回大厅按钮 */
        #backToHallBtn {
            position: absolute;
            top: 1.5%;
            right: 1.5%;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid #ffaa00;
            border-radius: 5px;
            padding: 0.2vw 1vw;
            font-size: 1vw;
            font-weight: bold;
            cursor: pointer;
            z-index: 12;
            pointer-events: auto;
            transition: 0.2s;
        }
        #backToHallBtn:hover {
            background: rgba(255, 170, 0, 0.3);
        }

        /* 任务面板 */
        #taskContainer {
            position: absolute;
            top: 12%;
            right: 1.5%;
            background: rgba(0, 0, 0, 0.7);
            padding: 0.6vw 1vw;
            border-radius: 5px;
            color: white;
            font-size: 1vw;
            line-height: 1.3;
            min-width: 16vw;
        }
        #taskContainer .task-title {
            font-size: 1.2vw;
            font-weight: bold;
            margin-bottom: 0.2vw;
            color: #fff;
        }
        #taskContainer .task-reward {
            margin-top: 0.15vw;
            color: #ffaa00;
            font-size: 0.85vw;
        }
        #claimTaskBtn {
            background: #ffaa00;
            color: black;
            font-weight: bold;
            border: none;
            padding: 0.15vw 1vw;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9vw;
            margin-top: 0.3vw;
            display: none;
        }

        /* 右侧控制按钮 */
        #controls {
            position: absolute;
            bottom: 3%;
            right: 2%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6vw;
        }
        .ctrl-row {
            display: flex;
            gap: 0.6vw;
            align-items: center;
        }
        .ctrl-btn {
            width: 7vw;
            height: 7vw;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .ctrl-btn:active {
            transform: scale(0.9);
        }
        .ctrl-btn.small {
            width: 5.5vw;
            height: 5.5vw;
        }
        .ctrl-btn img {
            width: 55%;
            height: 55%;
            object-fit: contain;
        }
        .ctrl-label {
            color: white;
            font-size: 0.85vw;
            text-shadow: 1px 1px 3px black;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.1vw 0.5vw;
            border-radius: 3px;
            font-weight: bold;
        }

        /* 摇杆 */
        #joystickZone {
            position: absolute;
            bottom: 3%;
            left: 3%;
            width: 12vw;
            height: 12vw;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystickKnob {
            width: 4.5vw;
            height: 4.5vw;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
            transition: 0.05s;
        }

        /* 背包弹窗 */
        #inventoryModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #inventoryPanel {
            width: 75%;
            height: 75%;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/settingbackground.jpg');
            background-size: cover;
            border-radius: 8px;
            padding: 2vw;
            position: relative;
        }
        #invHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 2.8vw;
            font-weight: bold;
            margin-bottom: 1.5vw;
            color: #000;
        }
        #invClose {
            font-size: 3.5vw;
            cursor: pointer;
            color: #000;
            line-height: 1;
        }
        #invGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(9vw, 1fr));
            gap: 1.2vw;
        }
        .inv-item {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1vw 0.6vw;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .inv-item:hover {
            border-color: #ffaa00;
            transform: translateY(-2px);
        }
        .inv-item img {
            width: 60%;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
        }
        .inv-item .item-name {
            color: white;
            font-size: 1vw;
            margin-top: 0.3vw;
            font-weight: bold;
        }
        .inv-item .item-qty {
            color: #ffaa00;
            font-size: 0.85vw;
            margin-top: 0.1vw;
        }

        /* 物品详情弹窗 */
        #itemDetailModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #detailPanel {
            width: 50%;
            max-width: 35vw;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            padding: 2vw;
            position: relative;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #detailClose {
            position: absolute;
            top: 1.2vw;
            right: 2vw;
            font-size: 3vw;
            cursor: pointer;
            color: #fff;
            line-height: 1;
        }
        #detailTitle {
            font-size: 2.4vw;
            font-weight: bold;
            margin-bottom: 1.2vw;
            color: #fff;
        }
        #detailImg {
            width: 10vw;
            height: 10vw;
            object-fit: contain;
            margin-bottom: 1.2vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            padding: 0.6vw;
        }
        #detailDesc {
            font-size: 1.3vw;
            margin-bottom: 2vw;
            text-align: center;
            color: #ccc;
        }
        #detailUseBtn {
            background: #ff8800;
            color: white;
            font-size: 1.5vw;
            padding: 0.6vw 3.5vw;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 结算/复活弹窗 */
        #settlementModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settlementPanel {
            width: 55%;
            max-width: 40vw;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            padding: 2.5vw;
            position: relative;
            color: white;
            text-align: center;
            border: 2px solid #ffd700;
        }
        #settlementPanel .title {
            font-size: 2.5vw;
            font-weight: bold;
            margin-bottom: 1vw;
            color: #ffd700;
        }
        #settlementPanel .info {
            font-size: 1.3vw;
            margin-bottom: 1vw;
            color: #ccc;
            line-height: 1.6;
        }
        #settlementPanel .info span {
            color: #ffaa00;
            font-weight: bold;
        }
        #settlementPanel .btns {
            display: flex;
            gap: 1.5vw;
            justify-content: center;
            margin-top: 1vw;
            flex-wrap: wrap;
        }
        #settlementPanel .btns button {
            padding: 0.6vw 2vw;
            border: none;
            border-radius: 5px;
            font-size: 1.2vw;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        #settlementPanel .btns button:hover {
            transform: scale(1.05);
        }
        .btn-gold {
            background: #ffd700;
            color: black;
        }
        .btn-red {
            background: #cc3333;
            color: white;
        }
        .btn-blue {
            background: #4488ff;
            color: white;
        }
        .btn-green {
            background: #44bb44;
            color: white;
        }

        @media (orientation: portrait) {
            #gameContainer {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiLayer" class="ui-layer">
            <!-- 返回大厅按钮 -->
            <div id="backToHallBtn">🏠 返回大厅</div>

            <!-- 玩家信息 -->
            <div id="playerInfo">
                <div id="avatarBox"><img id="avatarImg" src="https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg" /></div>
                <div class="info-text">
                    <div class="nickname" id="nickDisplay">昵称</div>
                    <div class="lvl" id="lvlDisplay">Lv.1</div>
                </div>
            </div>
            <!-- 血条 -->
            <div id="hpBarContainer">
                <div id="hpBarInner" style="width:100%">100%</div>
            </div>
            <!-- 任务面板 -->
            <div id="taskContainer">
                <div class="task-title">📜 任务</div>
                <div id="taskDesc">击杀怪物 (0/10)</div>
                <div class="task-reward" id="taskReward">奖励: 50经验+1披萨+20广仙币</div>
                <button id="claimTaskBtn">领取奖励</button>
            </div>
            <!-- 摇杆 -->
            <div id="joystickZone">
                <div id="joystickKnob"></div>
            </div>
            <!-- 控制按钮 -->
            <div id="controls">
                <div class="ctrl-row">
                    <span class="ctrl-label">B:背包</span>
                    <div class="ctrl-btn small" id="invBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Bag.png" alt="背包" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">R:恢复</span>
                    <div class="ctrl-btn small" id="healBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Restore HP.png" alt="恢复" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">Q:疾跑</span>
                    <div class="ctrl-btn small" id="sprintBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Sprint.png" alt="疾跑" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">H:攻击</span>
                    <div class="ctrl-btn" id="attackBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Beat.png" alt="攻击" /></div>
                </div>
            </div>
            <!-- 背包弹窗 -->
            <div id="inventoryModal">
                <div id="inventoryPanel">
                    <div id="invHeader">
                        <span>🎒 背包</span>
                        <div id="invClose">✕</div>
                    </div>
                    <div id="invGrid"></div>
                </div>
            </div>
            <!-- 物品详情弹窗 -->
            <div id="itemDetailModal">
                <div id="detailPanel">
                    <div id="detailClose">✕</div>
                    <div id="detailTitle">物品名称</div>
                    <img id="detailImg" src="" />
                    <div id="detailDesc">物品描述</div>
                    <button id="detailUseBtn">使用</button>
                </div>
            </div>
            <!-- 结算弹窗 -->
            <div id="settlementModal">
                <div id="settlementPanel">
                    <div class="title" id="settlementTitle">⚔️ 战斗结算</div>
                    <div class="info" id="settlementInfo">
                        击杀怪物: <span id="killCount">0</span>/10<br />
                        获得经验: <span id="rewardExp">0</span><br />
                        获得物品: <span id="rewardItems">-</span><br />
                        获得广仙币: <span id="rewardCoins">0</span>
                    </div>
                    <div class="btns" id="settlementBtns">
                        <button class="btn-gold" id="settlementContinue">✅ 通关晋级</button>
                        <button class="btn-red" id="settlementQuit">🚪 返回大厅</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ============================================================
        // 1. 全局配置与数据
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W = 0,
            H = 0;

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const rect = container.getBoundingClientRect();
            W = canvas.width = rect.width;
            H = canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 数据存储（从JSON加载）
        let monsterDB = {};
        let foodDB = {};
        let weaponDB = {};
        let taskDB = [];
        let gameConfig = {};

        // 游戏状态
        let gameData = {
            monsters: [],
            monsterIdCounter: 0,
            effects: [],
            taskIndex: 0,
            taskProgress: 0, // 击杀数
            taskClaimed1: false, // 基础奖励已领
            taskClaimed5: false, // 双倍奖励已领
            taskClaimed10: false, // 三倍奖励已领
            lastTime: 0,
            deltaTime: 0,
            terrainSeed: Math.random() * 10000,
            isDead: false,
            isCleared: false, // 是否通关
            showSettlement: false
        };

        // 玩家对象
        let player = {};

        // 按键状态
        const keys = { w: false, a: false, s: false, d: false };
        let joyX = 0,
            joyY = 0;

        // 长按检测
        let longPressTimer = null;
        let isLongPress = false;

        // BGM
        let bgm = null;
        let bgmPlaying = false;

        // 点击音效
        let clickAudio = null;

        // ============================================================
        // 2. 核心：从objects.json加载所有游戏数据
        // ============================================================
        async function loadGameData() {
            try {
                const res = await fetch('objects.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                gameConfig = {
                    resurrectionCost: 75,
                    drowningTime: 30,
                    swimImageMing: 'Ming-swim.png',
                    swimImageQing: 'Qing-swim.png',
                    mapBoundaryMultiplier: 20,
                    ...data.gameConfig
                };

                monsterDB = {};
                if (data.monsters && Array.isArray(data.monsters)) {
                    data.monsters.forEach(m => {
                        monsterDB[m.Lv] = m;
                        monsterDB[m.name] = m;
                    });
                }

                foodDB = {};
                if (data.foods && Array.isArray(data.foods)) {
                    data.foods.forEach(f => { foodDB[f.name] = f; });
                }

                weaponDB = {};
                if (data.weapons && Array.isArray(data.weapons)) {
                    data.weapons.forEach(w => { weaponDB[w.name] = w; });
                }

                taskDB = data.tasks || [];

                console.log('✅ JSON数据加载成功！');
                return true;
            } catch (e) {
                console.warn('⚠️ 无法加载objects.json，使用默认数据', e);
                gameConfig = {
                    resurrectionCost: 75,
                    drowningTime: 30,
                    swimImageMing: 'Ming-swim.png',
                    swimImageQing: 'Qing-swim.png',
                    mapBoundaryMultiplier: 20
                };
                // 默认数据
                monsterDB[1] = {
                    name: '恶魔小兵',
                    Lv: 1,
                    imc: 'https://xiaoye6661234.github.io/GuangXianWorld/Monster.png',
                    HP: 75,
                    Beat: 10,
                    Def: 0,
                    exp: 50,
                    money: 20
                };
                foodDB['披萨'] = {
                    name: '披萨',
                    HP: 50,
                    imc: 'https://xiaoye6661234.github.io/GuangXianWorld/Pizza.png'
                };
                foodDB['面条'] = {
                    name: '面条',
                    HP: 25,
                    imc: 'https://xiaoye6661234.github.io/GuangXianWorld/Noodle.png'
                };
                weaponDB['木剑'] = {
                    name: '木剑',
                    hit: 10,
                    imc: 'https://xiaoye6661234.github.io/GuangXianWorld/WoodSword.png',
                    Lv: 1
                };
                taskDB = [
                    { word: '击杀怪物', given: { name: '披萨', num: 1 } }
                ];
                return false;
            }
        }

        // ============================================================
        // 3. 玩家系统（只创建默认数据，后续由 loadSave 覆盖）
        // ============================================================
        function createPlayer() {
            // 固定地图大小为 2000x2000 (25*80)
            const MAP_PIXELS = 2000;
            const maxHP = 100;
            const baseAttack = 10;

            return {
                x: 1000,
                y: 1000,
                speed: 350,
                hp: maxHP,
                maxHP: maxHP,
                attack: baseAttack,
                defense: 0,
                level: 1,
                exp: 0,
                nextExp: 1000,
                coins: 0,
                nickname: '广仙道友',
                avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                inventory: [
                    { type: 'food', key: '披萨', qty: 2 },
                    { type: 'food', key: '面条', qty: 1 },
                    { type: 'weapon', key: '木剑', qty: 1 }
                ],
                equippedWeapon: null,
                attackCooldown: 0,
                attackCooldownMax: 0.4,
                isAttacking: false,
                attackTimer: 0,
                isSprinting: false,
                sprintTimer: 0,
                sprintCooldown: 0,
                invincible: 0,
                facing: 'down',
                inWater: false,
                waterTimer: 0,
                role: 'Ming',
                isDead: false
            };
        }

        player = createPlayer();

        // ============================================================
        // 4. 地形系统（25×25网格，规律生成）
        // ============================================================
        const MAP_SIZE = 25;
        const TILE_SIZE = 80;
        const MAP_PIXELS = MAP_SIZE * TILE_SIZE; // 2000px

        function getTerrainType(c, r, seed) {
            const x = c * 0.12 + seed * 0.001;
            const y = r * 0.12 + seed * 0.001;
            const n1 = Math.sin(x * 1.7 + y * 2.3) * 0.5 + Math.cos(x * 2.1 - y * 1.9) * 0.5;
            const n2 = Math.sin(x * 3.7 + y * 4.1) * 0.3 + Math.cos(x * 4.3 - y * 3.5) * 0.3;
            const n3 = Math.sin(x * 7.1 + y * 8.3) * 0.15 + Math.cos(x * 9.7 - y * 6.5) * 0.15;
            const value = n1 + n2 + n3;
            if (value < -0.5) return 'water';
            if (value < -0.05) return 'sand';
            return 'grass';
        }

        // 预生成地形
        let terrainMap = [];

        function generateTerrain() {
            terrainMap = [];
            for (let r = 0; r < MAP_SIZE; r++) {
                terrainMap[r] = [];
                for (let c = 0; c < MAP_SIZE; c++) {
                    terrainMap[r][c] = getTerrainType(c, r, gameData.terrainSeed);
                }
            }
        }
        generateTerrain();

        // ============================================================
        // 5. 怪物系统（10个，HP75，攻击10）
        // ============================================================
        function spawnMonster(forceLv) {
            const lv = forceLv || 1;
            const template = monsterDB[lv];
            if (!template) {
                const levels = Object.keys(monsterDB).filter(k => !isNaN(k)).map(Number).sort((a, b) => a - b);
                if (levels.length === 0) return null;
                let bestLv = levels[0];
                for (let l of levels) {
                    if (Math.abs(l - lv) < Math.abs(bestLv - lv)) bestLv = l;
                }
                return spawnMonster(bestLv);
            }
            // 在地图内随机位置生成，避开玩家初始位置
            let attempts = 0;
            let x, y;
            do {
                x = 80 + Math.random() * (MAP_PIXELS - 160);
                y = 80 + Math.random() * (MAP_PIXELS - 160);
                attempts++;
            } while (Math.sqrt((x - 1000) ** 2 + (y - 1000) ** 2) < 300 && attempts < 50);

            const m = {
                id: gameData.monsterIdCounter++,
                x: x,
                y: y,
                ...template,
                alive: true,
                attackCooldown: 0,
                hitFlash: 0,
                moveTimer: 0,
                moveAngle: Math.random() * Math.PI * 2,
                // 强制属性
                HP: 75,
                Beat: 10,
                exp: 50,
                money: 20
            };
            gameData.monsters.push(m);
            return m;
        }

        // 生成10个怪物
        function initMonsters() {

        function claimTaskReward() {

                player.exp += 50;

        function addItemToInventory(key, num) {
            let found = false;
            for (let item of player.inventory) {
                if (item.key === key) {
                    item.qty += num;
                    found = true;
                    break;
                }
            }
            if (!found) {
                let type = 'food';
                if (weaponDB[key]) type = 'weapon';
                player.inventory.push({ type: type, key: key, qty: num });
            }
        }

        // ============================================================
        // 7. 升级系统
        // ============================================================
        function checkLevelUp() {
            while (player.exp >= player.nextExp) {
                player.exp -= player.nextExp;
                player.level++;
                player.nextExp = 900 + player.level * 100;
                // 每升一级攻击+5
                player.attack += 5;
                // 每3级+10HP
                if ((player.level - 1) % 3 === 0) {
                    player.maxHP += 10;
                }
                player.hp = player.maxHP;
                alert(`🎉 升级！当前等级 ${player.level}，攻击力 +5`);
            }
        }

        // ============================================================
        // 8. 背包与物品系统
        // ============================================================
        function useFoodItem(foodKey) {
            const food = foodDB[foodKey];
            if (!food) { alert('无效食物'); return false; }
            if (player.hp >= player.maxHP) {
                alert('❤️ 生命值已满！');
                return false;
            }
            // 披萨恢复50%HP，面条恢复25HP
            let healAmount = 0;
            if (foodKey === '披萨') {
                healAmount = Math.floor(player.maxHP * 0.5);
            } else if (foodKey === '面条') {
                healAmount = 25;
            } else {
                healAmount = food.HP || 25;
            }
            player.hp = Math.min(player.hp + healAmount, player.maxHP);

            const idx = player.inventory.findIndex(item => item.type === 'food' && item.key === foodKey);
            if (idx !== -1) {
                player.inventory[idx].qty -= 1;
                if (player.inventory[idx].qty <= 0) {
                    player.inventory.splice(idx, 1);
                }
            }
            updateUI();
            updateInventoryGrid();
            saveGame();
            return true;
        }

        function equipWeapon(weaponKey) {
            const w = weaponDB[weaponKey];
            if (!w) return;
            player.equippedWeapon = w;
            // 攻击力 = 基础攻击 + 武器加成（木剑+10）
            const baseAttack = 10 + (player.level - 1) * 5;
            player.attack = baseAttack + (w.hit || 10);
            alert(`⚔️ 装备了 ${w.name}，攻击力 +${w.hit || 10}`);
            updateUI();
            saveGame();
        }

        function autoHeal() {
            // 优先使用面条（恢复量小，不浪费）
            const noodle = player.inventory.find(item => item.type === 'food' && item.key === '面条');
            if (noodle) {
                useFoodItem('面条');
                return;
            }
            const pizza = player.inventory.find(item => item.type === 'food' && item.key === '披萨');
            if (pizza) {
                useFoodItem('披萨');
                return;
            }
            alert('🍕 背包中没有食物！');
        }

        // ============================================================
        // 9. 存档系统（先尝试读取 data.json 文件，再读取 localStorage）
        // ============================================================
        async function loadSave() {
            try {
                // 第一步：尝试从服务器读取 data.json 文件
                const res = await fetch('data.json');
                if (res.ok) {
                    const fileData = await res.json();
                    console.log('📁 从 data.json 文件加载数据');
                    applySaveData(fileData);
                    // 同时写入 localStorage 作为缓存
                    localStorage.setItem('data.json', JSON.stringify(fileData));
                    return;
                }
            } catch (e) {
                // 文件不存在或无法读取，忽略
            }

            // 第二步：从 localStorage 读取
            const raw = localStorage.getItem('data.json');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    console.log('💾 从 localStorage 加载数据');
                    applySaveData(data);
                } catch (e) {
                    console.warn('localStorage 数据解析失败');
                }
            } else {
                console.log('🆕 无存档数据，使用默认初始数据');
            }
        }

        function applySaveData(data) {
            if (data.user) {
                player.nickname = data.user.nickname || player.nickname;
                player.avatar = data.user.avatar || player.avatar;
                player.level = parseInt(data.user.level) || player.level;
                player.coins = parseInt(data.user.coins) || player.coins;
                player.role = data.user.role || 'Ming';
                // 计算 HP 和攻击
                const hpBonus = Math.floor((player.level - 1) / 3) * 10;
                player.maxHP = 100 + hpBonus;
                player.hp = player.maxHP;
                player.nextExp = 900 + player.level * 100;
                player.attack = 10 + (player.level - 1) * 5;
            }
            if (data.inventory && Array.isArray(data.inventory)) {
                // 合并背包，保留初始物品
                const existingKeys = new Set(player.inventory.map(i => i.key));
                for (let item of data.inventory) {
                    if (existingKeys.has(item.key)) {
                        const found = player.inventory.find(i => i.key === item.key);
                        if (found) found.qty = (found.qty || 0) + (item.qty || 0);
                    } else {
                        player.inventory.push(item);
                    }
                }
            }
            if (data.equippedWeapon && weaponDB[data.equippedWeapon]) {
                player.equippedWeapon = weaponDB[data.equippedWeapon];
                const baseAttack = 10 + (player.level - 1) * 5;
                player.attack = baseAttack + (player.equippedWeapon.hit || 10);
            }
            if (data.taskProgress !== undefined) taskState.killCount = data.taskProgress;
            if (data.taskClaimed1 !== undefined) taskState.claimed1 = data.taskClaimed1;
            if (data.taskClaimed5 !== undefined) taskState.claimed5 = data.taskClaimed5;
            if (data.taskClaimed10 !== undefined) taskState.claimed10 = data.taskClaimed10;
        }

        function saveGame() {
            try {
                const data = {
                    user: {
                        nickname: player.nickname,
                        avatar: player.avatar,
                        level: player.level,
                        coins: player.coins,
                        role: player.role
                    },
                    inventory: player.inventory,
                    equippedWeapon: player.equippedWeapon ? player.equippedWeapon.name : null,

                    taskClaimed1: taskState.claimed1,
                    taskClaimed5: taskState.claimed5,

        // ============================================================
        // 10. 战斗系统
        // ============================================================
        function performAttack() {
            if (player.attackCooldown > 0 || player.isAttacking || player.isDead || gameData.showSettlement) return;
            player.attackCooldown = player.attackCooldownMax;
            player.isAttacking = true;
            player.attackTimer = 0.3;

            let target = null;
            let minDist = 220;
            for (let m of gameData.monsters) {
                if (!m.alive) continue;
                const dx = m.x - player.x;
                const dy = m.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    target = m;
                }
            }

            if (target) {
                const atk = player.attack + (player.equippedWeapon ? (player.equippedWeapon.hit || 10) : 0);
                const dmg = Math.max(1, atk - (target.Def || 0));
                target.hp -= dmg;
                target.hitFlash = 0.2;

                // 攻击特效
                const hitNum = Math.floor(Math.random() * 7) + 1;
                const effectImg = new Image();
                effectImg.src = `https://xiaoye6661234.github.io/GuangXianWorld/HitSound${hitNum}.png`;
                gameData.effects.push({
                    img: effectImg,
                    x: target.x,
                    y: target.y,
                    life: 0.4,
                    timer: 0
                });

                // 攻击音效
                try {
                    const audio = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/Beat.mp3');
                    audio.volume = 0.3;
                    audio.play().catch(() => {});
                } catch (e) {}

                if (target.hp <= 0) {
                    target.alive = false;
                    taskState.killCount++;
                    player.exp += target.exp || 50;
                    player.coins += target.money || 20;

                    // 检查是否全部击杀
                    const aliveCount = gameData.monsters.filter(m => m.alive).length;
                    if (aliveCount === 0) {
                        // 通关！
                        gameData.isCleared = true;
                        showSettlement(true);
                    }

                    checkLevelUp();
                    saveGame();
                    updateUI();
                    updateTaskUI();
                }
            }
            setTimeout(() => { player.isAttacking = false; }, 400);
        }

            const cost = gameConfig.resurrectionCost || 75;
            if (player.coins < cost) {

            player.coins -= cost;

        // 摇杆控制
        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');
        let touchId = null;
        joystickZone.addEventListener('touchstart', (e) => {
            const t = e.changedTouches[0];
            touchId = t.identifier;
            handleJoystick(t);
        });
        joystickZone.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchId) handleJoystick(t);
            }
        });
        joystickZone.addEventListener('touchend', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchId) {
                    joyX = 0;
                    joyY = 0;
                    joystickKnob.style.transform = 'translate(0, 0)';
                    touchId = null;
                }
            }
        });

        function handleJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxR = rect.width / 2 - 15;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const ratio = Math.min(1, dist / maxR);
            joyX = (dx / maxR) * ratio;
            joyY = (dy / maxR) * ratio;
            const kx = joyX * maxR;
            const ky = joyY * maxR;
            joystickKnob.style.transform = `translate(${kx}px, ${ky}px)`;
        }

                const div = document.createElement('div');
                div.className = 'inv-item';
                let imgSrc = '';
                let detailText = '';
                if (item.type === 'food' && foodDB[item.key]) {
                    imgSrc = foodDB[item.key].imc;
                    detailText = `❤️ 恢复 ${item.key === '披萨' ? '50%' : '25'} HP`;
                } else if (item.type === 'weapon' && weaponDB[item.key]) {
                    imgSrc = weaponDB[item.key].imc;
                    detailText = `⚔️ 攻击力 +${weaponDB[item.key].hit || 10} (Lv.${weaponDB[item.key].Lv || 1})`;
                } else {
                    imgSrc = 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg';
                    detailText = '📦 未知物品';
                }
                div.innerHTML = `
                    <img src="${imgSrc}" onerror="this.src='https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg'" />
                    <div class="item-name">${item.key}</div>
                    <div class="item-qty">×${item.qty}</div>
                `;
                div.addEventListener('click', (e) => {
                    if (isLongPress) {
                        isLongPress = false;
                        return;
                    }
                    if (item.type === 'food') {
                        useFoodItem(item.key);
                    } else if (item.type === 'weapon') {
                        equipWeapon(item.key);
                    }
                    e.stopPropagation();
                });
                div.addEventListener('touchstart', (e) => {
                    longPressTimer = setTimeout(() => {
                        isLongPress = true;
                        showDetail(item, idx);
                        longPressTimer = null;
                    }, 600);
                });
                div.addEventListener('touchend', () => {
                    if (longPressTimer) clearTimeout(longPressTimer);
                });
                div.addEventListener('mousedown', (e) => {
                    longPressTimer = setTimeout(() => {
                        isLongPress = true;
                        showDetail(item, idx);
                        longPressTimer = null;
                    }, 600);
                });
                div.addEventListener('mouseup', () => {
                    if (longPressTimer) clearTimeout(longPressTimer);
                });
                div.addEventListener('mouseleave', () => {
                    if (longPressTimer) clearTimeout(longPressTimer);
                });
                grid.appendChild(div);
            });
        }

        let currentDetailIdx = -1;

        function showDetail(item, idx) {
            currentDetailIdx = idx;
            const modal = document.getElementById('itemDetailModal');
            const title = document.getElementById('detailTitle');
            const img = document.getElementById('detailImg');
            const desc = document.getElementById('detailDesc');
            const btn = document.getElementById('detailUseBtn');
            title.innerText = item.key;
            let imgSrc = '';
            let description = '';
            let btnText = '使用';
            if (item.type === 'food' && foodDB[item.key]) {
                const food = foodDB[item.key];
                imgSrc = food.imc;
                description = `❤️ 可恢复 ${item.key === '披萨' ? '50% HP' : '25 HP'}`;
                btnText = '使用恢复';
            } else if (item.type === 'weapon' && weaponDB[item.key]) {
                const weapon = weaponDB[item.key];
                imgSrc = weapon.imc;
                description = `⚔️ 攻击力 +${weapon.hit || 10} (Lv.${weapon.Lv || 1})`;
                btnText = '装备武器';
            } else {
                imgSrc = 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg';
                description = '📦 未知物品';
                btnText = '关闭';
            }
            img.src = imgSrc;
            desc.innerText = description;
            btn.innerText = btnText;
            modal.style.display = 'flex';
        }

        function closeDetail() {
            document.getElementById('itemDetailModal').style.display = 'none';
            currentDetailIdx = -1;
        }

        function useDetailItem() {
            if (currentDetailIdx === -1) return;
            const item = player.inventory[currentDetailIdx];
            if (!item) return;
            if (item.type === 'food') {
                if (useFoodItem(item.key)) {
                    closeDetail();
                }
            } else if (item.type === 'weapon') {
                equipWeapon(item.key);
                closeDetail();
                updateInventoryGrid();
            }
            updateUI();
        }

        // ============================================================
        // 17. UI更新
        // ============================================================
        function updateUI() {
            document.getElementById('lvlDisplay').innerText = `Lv.${player.level}`;
            document.getElementById('nickDisplay').innerText = player.nickname;
            document.getElementById('avatarImg').src = player.avatar;
            const hpPercent = Math.max(0, (player.hp / player.maxHP) * 100);
            document.getElementById('hpBarInner').style.width = hpPercent + '%';
            document.getElementById('hpBarInner').innerText = Math.round(hpPercent) + '%';
            updateTaskUI();
        }

        // ============================================================
        // 18. 游戏更新循环
        // ============================================================
        function update(dt) {
            if (player.isDead || gameData.showSettlement) return;

            let dx = 0,
                dy = 0;
            if (keys.w) dy = -1;
            if (keys.s) dy = 1;
            if (keys.a) dx = -1;
            if (keys.d) dx = 1;
            if (joyX !== 0 || joyY !== 0) {
                dx = joyX;
                dy = joyY;
            }
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len > 0) {
                dx /= len;
                dy /= len;
                const speedMod = player.inWater ? 0.5 : 1;
                player.x += dx * player.speed * speedMod * dt;
                player.y += dy * player.speed * speedMod * dt;

                if (Math.abs(dx) >= Math.abs(dy)) {
                    player.facing = dx > 0 ? 'right' : 'left';
                } else {
                    player.facing = dy > 0 ? 'down' : 'up';
                }
            }

            // 边界限制（地图范围：0 ~ MAP_PIXELS）
            const margin = 30;
            player.x = Math.max(margin, Math.min(MAP_PIXELS - margin, player.x));
            player.y = Math.max(margin, Math.min(MAP_PIXELS - margin, player.y));

            // 检测玩家是否在水中
            const c = Math.floor(player.x / TILE_SIZE);
            const r = Math.floor(player.y / TILE_SIZE);
            if (c >= 0 && c < MAP_SIZE && r >= 0 && r < MAP_SIZE) {
                const terrainType = terrainMap[r][c];
                if (terrainType === 'water') {
                    if (!player.inWater) {
                        player.inWater = true;
                        player.waterTimer = 0;
                    }
                    player.waterTimer += dt;
                    if (player.waterTimer >= gameConfig.drowningTime) {
                        player.hp = 0;
                        handleDeath();
                        return;
                    }
                } else {
                    if (player.inWater) {
                        player.inWater = false;
                        player.waterTimer = 0;
                    }
                }
            }

            if (player.attackCooldown > 0) player.attackCooldown -= dt;
            if (player.attackTimer > 0) player.attackTimer -= dt;
            if (player.invincible > 0) player.invincible -= dt;
            if (player.sprintCooldown > 0) player.sprintCooldown -= dt;
            if (player.isSprinting) {
                player.sprintTimer -= dt;
                if (player.sprintTimer <= 0) {
                    player.isSprinting = false;
                    player.speed = 350;
                }
            }

            for (let m of gameData.monsters) {
                if (!m.alive) continue;
                if (m.hitFlash > 0) m.hitFlash -= dt;
                m.attackCooldown = Math.max(0, m.attackCooldown - dt);

                const dx2 = player.x - m.x;
                const dy2 = player.y - m.y;
                const dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);

                if (dist < 400) {
                    const speed = 50 + m.Lv * 12 + (player.isSprinting ? 20 : 0);
                    if (dist > 30) {
                        m.x += (dx2 / dist) * speed * dt;
                        m.y += (dy2 / dist) * speed * dt;
                    }
                } else if (dist < 600) {
                    m.moveTimer -= dt;
                    if (m.moveTimer <= 0) {
                        m.moveTimer = 0.5 + Math.random() * 1.5;
                        m.moveAngle += (Math.random() - 0.5) * 2;
                        m.x += Math.cos(m.moveAngle) * 30 * dt;
                        m.y += Math.sin(m.moveAngle) * 30 * dt;
                    }
                }

                // 边界限制
                m.x = Math.max(margin, Math.min(MAP_PIXELS - margin, m.x));
                m.y = Math.max(margin, Math.min(MAP_PIXELS - margin, m.y));

                if (dist < 70 && m.attackCooldown <= 0 && player.invincible <= 0) {
                    const dmg = Math.max(1, (m.Beat || 10) - player.defense);
                    player.hp -= dmg;
                    player.invincible = 0.5;
                    m.attackCooldown = 1.0;
                    if (player.hp <= 0) {
                        player.hp = 0;
                        handleDeath();
                        return;
                    }
                    updateUI();
                }
            }

            // 特效更新
            for (let i = gameData.effects.length - 1; i >= 0; i--) {
                const ef = gameData.effects[i];
                ef.timer += dt;
                if (ef.timer >= ef.life) {
                    gameData.effects.splice(i, 1);
                }
            }

            updateUI();
        }

        // ============================================================
        // 19. 渲染
        // ============================================================
        function render() {
            ctx.clearRect(0, 0, W, H);
            const offsetX = player.x - W / 2;
            const offsetY = player.y - H / 2;

            // 绘制地形
            const viewCols = Math.ceil(W / TILE_SIZE) + 3;
            const viewRows = Math.ceil(H / TILE_SIZE) + 3;
            const startCol = Math.floor((player.x - W / 2) / TILE_SIZE) - 2;
            const startRow = Math.floor((player.y - H / 2) / TILE_SIZE) - 2;

            const terrainImages = {
                grass: new Image(),
                sand: new Image(),
                water: new Image()
            };
            terrainImages.grass.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Grass.jpg';
            terrainImages.sand.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Sand.jpg';
            terrainImages.water.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Water.jpg';

            for (let r = startRow; r < startRow + viewRows; r++) {
                for (let c = startCol; c < startCol + viewCols; c++) {
                    if (c < 0 || c >= MAP_SIZE || r < 0 || r >= MAP_SIZE) {
                        // 边界外填充黑色
                        const x = c * TILE_SIZE - offsetX;
                        const y = r * TILE_SIZE - offsetY;
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        continue;
                    }
                    const type = terrainMap[r][c];
                    const img = terrainImages[type];
                    const x = c * TILE_SIZE - offsetX;
                    const y = r * TILE_SIZE - offsetY;
                    if (img.complete && img.naturalWidth > 0) {
                        ctx.drawImage(img, x, y, TILE_SIZE, TILE_SIZE);
                    } else {
                        if (type === 'grass') ctx.fillStyle = '#4CAF50';
                        else if (type === 'sand') ctx.fillStyle = '#f4e4b6';
                        else ctx.fillStyle = '#2196F3';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // 绘制边界线
            ctx.strokeStyle = 'rgba(255,0,0,0.3)';
            ctx.lineWidth = 3;
            ctx.strokeRect(-offsetX, -offsetY, MAP_PIXELS, MAP_PIXELS);

            // 绘制怪物
            for (let m of gameData.monsters) {
                if (!m.alive) continue;
                const x = m.x - offsetX;
                const y = m.y - offsetY;
                const size = 50;

                const img = new Image();
                img.src = m.imc;
                if (img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
                } else {
                    ctx.fillStyle = '#8B0000';
                    ctx.beginPath();
                    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = 'white';
                ctx.font = '1vw Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(`Lv.${m.Lv}`, x, y - size / 2 - 8);
                ctx.shadowBlur = 0;

                // 血条
                const hpW = 40;
                const hpH = 3;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(x - hpW / 2, y - size / 2 - 16, hpW, hpH);
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(x - hpW / 2, y - size / 2 - 16, hpW * (m.hp / m.maxHP), hpH);

                if (m.hitFlash > 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.beginPath();
                    ctx.arc(x, y, size / 2 + 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 绘制玩家
            const px = player.x - offsetX;
            const py = player.y - offsetY;
            const pSize = 50;
            let playerImgName = player.role === 'Qing' ? 'Qing.png' : 'Ming.png';
            const playerImg = new Image();
            playerImg.src = `https://xiaoye6661234.github.io/GuangXianWorld/${playerImgName}`;
            if (playerImg.complete && playerImg.naturalWidth > 0) {
                ctx.drawImage(playerImg, px - pSize / 2, py - pSize / 2, pSize, pSize);
            } else {
                ctx.fillStyle = '#4A90E2';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            if (player.invincible > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 4, 0, Math.PI * 2);
                ctx.fill();
            }
            if (player.inWater && !player.isDead) {
                ctx.fillStyle = 'rgba(100, 200, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // 攻击特效
            for (let ef of gameData.effects) {
                const ex = ef.x - offsetX;
                const ey = ef.y - offsetY;
                const size = 80 * (W / 1000);
                if (ef.img.complete && ef.img.naturalWidth > 0) {
                    ctx.drawImage(ef.img, ex - size / 2, ey - size / 2, size, size);
                }
            }

            // 攻击动作
            if (player.isAttacking) {
                const angle = player.facing === 'right' ? 0 : player.facing === 'left' ? Math.PI : player.facing === 'up' ? -Math
                    .PI / 2 : Math.PI / 2;
                const len = 30;
                const ex = px + Math.cos(angle) * len;
                const ey = py + Math.sin(angle) * len;
                ctx.strokeStyle = 'rgba(255,255,200,0.8)';
                ctx.lineWidth = 4;
                ctx.shadowColor = 'rgba(255,255,100,0.6)';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(ex, ey);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // 20. 游戏循环
        // ============================================================
        function loop(timestamp) {
            const dt = Math.min((timestamp - gameData.lastTime) / 1000, 0.05);
            gameData.lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        // ============================================================
        // 21. 初始化启动
        // ============================================================
        async function init() {
            await loadGameData();
            // 生成地形
            generateTerrain();
            // 加载玩家数据（优先读取 data.json 文件，其次 localStorage）
            await loadSave();
            // 确保玩家攻击力正确
            const baseAttack = 10 + (player.level - 1) * 5;
            if (player.equippedWeapon) {
                player.attack = baseAttack + (player.equippedWeapon.hit || 10);
            } else {
                player.attack = baseAttack;
            }
            // 修正玩家位置到地图中央
            player.x = 1000;
            player.y = 1000;
            // 初始化怪物（确保场内一定有怪物）
            initMonsters();

            updateUI();
            updateInventoryGrid();
            updateTaskUI();

            // 初始化BGM
            initAudio();
            // 添加点击音效
            addClickSounds();

            gameData.lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        init();
        window.addEventListener('resize', () => { resizeCanvas(); });
        document.addEventListener('contextmenu', e => e.preventDefault());

        console.log('🎮 广仙世界 - 第一章 已启动！');
        console.log('📖 快捷键: W/A/S/D 移动 | H 攻击 | Q 疾跑 | R 恢复 | B 背包 | F 领任务');
        console.log('🎯 目标: 击杀10只怪物通关晋级！');
    </script>
