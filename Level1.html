<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>广仙世界 · 第一章</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: #2d5e2b;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            background: #87ceeb;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .ui-layer>* {
            pointer-events: auto;
        }

        /* 左上玩家信息 */
        #playerInfo {
            position: absolute;
            top: 1.5%;
            left: 1.5%;
            display: flex;
            align-items: center;
            gap: 0.6vw;
        }
        #avatarBox {
            width: 6vw;
            height: 6vw;
            border: 2px solid white;
            border-radius: 4px;
            overflow: hidden;
            background: #ccc;
        }
        #avatarBox img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-text {
            display: flex;
            flex-direction: column;
            gap: 0.3vw;
        }
        .info-text .nickname {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.3vw;
            font-weight: bold;
            padding: 0.15vw 1vw;
            border-radius: 4px;
        }
        .info-text .lvl {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.7vw;
            font-weight: bold;
            padding: 0.15vw 1vw;
            border-radius: 4px;
        }

        /* 血条 */
        #hpBarContainer {
            position: absolute;
            top: 2.5%;
            left: 30%;
            width: 35%;
            height: 3vw;
            background: #cc0000;
            border: 0.25vw solid #ff9900;
            border-radius: 5px;
            overflow: hidden;
        }
        #hpBarInner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d61a1a, #ff4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6vw;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px black;
        }

        /* 返回大厅按钮 */
        #backToHallBtn {
            position: absolute;
            top: 1.5%;
            right: 1.5%;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid #ffaa00;
            border-radius: 5px;
            padding: 0.2vw 1vw;
            font-size: 1vw;
            font-weight: bold;
            cursor: pointer;
            z-index: 12;
            pointer-events: auto;
            transition: 0.2s;
        }
        #backToHallBtn:hover {
            background: rgba(255, 170, 0, 0.3);
        }

        /* 任务面板 */
        #taskContainer {
            position: absolute;
            top: 12%;
            right: 1.5%;
            background: rgba(0, 0, 0, 0.7);
            padding: 0.6vw 1vw;
            border-radius: 5px;
            color: white;
            font-size: 1vw;
            line-height: 1.3;
            min-width: 16vw;
        }
        #taskContainer .task-title {
            font-size: 1.2vw;
            font-weight: bold;
            margin-bottom: 0.2vw;
            color: #fff;
        }
        #taskContainer .task-reward {
            margin-top: 0.15vw;
            color: #ffaa00;
            font-size: 0.85vw;
        }
        #claimTaskBtn {
            background: #ffaa00;
            color: black;
            font-weight: bold;
            border: none;
            padding: 0.15vw 1vw;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9vw;
            margin-top: 0.3vw;
            display: none;
        }

        /* 右侧控制按钮 */
        #controls {
            position: absolute;
            bottom: 3%;
            right: 2%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6vw;
        }
        .ctrl-row {
            display: flex;
            gap: 0.6vw;
            align-items: center;
        }
        .ctrl-btn {
            width: 7vw;
            height: 7vw;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .ctrl-btn:active {
            transform: scale(0.9);
        }
        .ctrl-btn.small {
            width: 5.5vw;
            height: 5.5vw;
        }
        .ctrl-btn img {
            width: 55%;
            height: 55%;
            object-fit: contain;
        }
        .ctrl-label {
            color: white;
            font-size: 0.85vw;
            text-shadow: 1px 1px 3px black;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.1vw 0.5vw;
            border-radius: 3px;
            font-weight: bold;
        }

        /* 摇杆 */
        #joystickZone {
            position: absolute;
            bottom: 3%;
            left: 3%;
            width: 12vw;
            height: 12vw;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystickKnob {
            width: 4.5vw;
            height: 4.5vw;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
            transition: 0.05s;
        }

        /* 背包弹窗 */
        #inventoryModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #inventoryPanel {
            width: 75%;
            height: 75%;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/settingbackground.jpg');
            background-size: cover;
            border-radius: 8px;
            padding: 2vw;
            position: relative;
        }
        #invHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 2.8vw;
            font-weight: bold;
            margin-bottom: 1.5vw;
            color: #000;
        }
        #invClose {
            font-size: 3.5vw;
            cursor: pointer;
            color: #000;
            line-height: 1;
        }
        #invGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(9vw, 1fr));
            gap: 1.2vw;
        }
        .inv-item {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1vw 0.6vw;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .inv-item:hover {
            border-color: #ffaa00;
            transform: translateY(-2px);
        }
        .inv-item img {
            width: 60%;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
        }
        .inv-item .item-name {
            color: white;
            font-size: 1vw;
            margin-top: 0.3vw;
            font-weight: bold;
        }
        .inv-item .item-qty {
            color: #ffaa00;
            font-size: 0.85vw;
            margin-top: 0.1vw;
        }

        /* 物品详情弹窗 */
        #itemDetailModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #detailPanel {
            width: 50%;
            max-width: 35vw;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            padding: 2vw;
            position: relative;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #detailClose {
            position: absolute;
            top: 1.2vw;
            right: 2vw;
            font-size: 3vw;
            cursor: pointer;
            color: #fff;
            line-height: 1;
        }
        #detailTitle {
            font-size: 2.4vw;
            font-weight: bold;
            margin-bottom: 1.2vw;
            color: #fff;
        }
        #detailImg {
            width: 10vw;
            height: 10vw;
            object-fit: contain;
            margin-bottom: 1.2vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            padding: 0.6vw;
        }
        #detailDesc {
            font-size: 1.3vw;
            margin-bottom: 2vw;
            text-align: center;
            color: #ccc;
        }
        #detailUseBtn {
            background: #ff8800;
            color: white;
            font-size: 1.5vw;
            padding: 0.6vw 3.5vw;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 结算/复活弹窗 */
        #settlementModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settlementPanel {
            width: 55%;
            max-width: 40vw;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            padding: 2.5vw;
            position: relative;
            color: white;
            text-align: center;
            border: 2px solid #ffd700;
        }
        #settlementPanel .title {
            font-size: 2.5vw;
            font-weight: bold;
            margin-bottom: 1vw;
            color: #ffd700;
        }
        #settlementPanel .info {
            font-size: 1.3vw;
            margin-bottom: 1vw;
            color: #ccc;
            line-height: 1.6;
        }
        #settlementPanel .info span {
            color: #ffaa00;
            font-weight: bold;
        }
        #settlementPanel .btns {
            display: flex;
            gap: 1.5vw;
            justify-content: center;
            margin-top: 1vw;
            flex-wrap: wrap;
        }
        #settlementPanel .btns button {
            padding: 0.6vw 2vw;
            border: none;
            border-radius: 5px;
            font-size: 1.2vw;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        #settlementPanel .btns button:hover {
            transform: scale(1.05);
        }
        .btn-gold {
            background: #ffd700;
            color: black;
        }
        .btn-red {
            background: #cc3333;
            color: white;
        }
        .btn-blue {
            background: #4488ff;
            color: white;
        }
        .btn-green {
            background: #44bb44;
            color: white;
        }

        @media (orientation: portrait) {
            #gameContainer {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiLayer" class="ui-layer">
            <!-- 返回大厅按钮 -->
            <div id="backToHallBtn">🏠 返回大厅</div>

            <!-- 玩家信息 -->
            <div id="playerInfo">
                <div id="avatarBox"><img id="avatarImg" src="https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg" /></div>
                <div class="info-text">
                    <div class="nickname" id="nickDisplay">昵称</div>
                    <div class="lvl" id="lvlDisplay">Lv.1</div>
                </div>
            </div>
            <!-- 血条 -->
            <div id="hpBarContainer">
                <div id="hpBarInner" style="width:100%">100%</div>
            </div>
            <!-- 任务面板 -->
            <div id="taskContainer">
                <div class="task-title">📜 任务</div>
                <div id="taskDesc">击杀怪物 (0/10)</div>
                <div class="task-reward" id="taskReward">奖励: 50经验+1披萨+20广仙币</div>
                <button id="claimTaskBtn">领取奖励</button>
            </div>
            <!-- 摇杆 -->
            <div id="joystickZone">
                <div id="joystickKnob"></div>
            </div>
            <!-- 控制按钮 -->
            <div id="controls">
                <div class="ctrl-row">
                    <span class="ctrl-label">B:背包</span>
                    <div class="ctrl-btn small" id="invBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Bag.png" alt="背包" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">R:恢复</span>
                    <div class="ctrl-btn small" id="healBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Restore HP.png" alt="恢复" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">Q:疾跑</span>
                    <div class="ctrl-btn small" id="sprintBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Sprint.png" alt="疾跑" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">H:攻击</span>
                    <div class="ctrl-btn" id="attackBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Beat.png" alt="攻击" /></div>
                </div>
            </div>
            <!-- 背包弹窗 -->
            <div id="inventoryModal">
                <div id="inventoryPanel">
                    <div id="invHeader">
                        <span>🎒 背包</span>
                        <div id="invClose">✕</div>
                    </div>
                    <div id="invGrid"></div>
                </div>
            </div>
            <!-- 物品详情弹窗 -->
            <div id="itemDetailModal">
                <div id="detailPanel">
                    <div id="detailClose">✕</div>
                    <div id="detailTitle">物品名称</div>
                    <img id="detailImg" src="" />
                    <div id="detailDesc">物品描述</div>
                    <button id="detailUseBtn">使用</button>
                </div>
            </div>
            <!-- 结算弹窗 -->
            <div id="settlementModal">
                <div id="settlementPanel">
                    <div class="title" id="settlementTitle">⚔️ 战斗结算</div>
                    <div class="info" id="settlementInfo">
                        击杀怪物: <span id="killCount">0</span>/10<br />
                        获得经验: <span id="rewardExp">0</span><br />
                        获得物品: <span id="rewardItems">-</span><br />
                        获得广仙币: <span id="rewardCoins">0</span>
                    </div>
                    <div class="btns" id="settlementBtns">
                        <button class="btn-gold" id="settlementContinue">✅ 通关晋级</button>
                        <button class="btn-red" id="settlementQuit">🚪 返回大厅</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ================================================================
        //  1. 统一 data.json 操作函数（与所有页面共享）
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: ''
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        // ================================================================
        //  2. 全局配置与数据（硬编码配置，不变）
        // ================================================================

        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var W = 0,
            H = 0;

        function resizeCanvas() {
            var container = document.getElementById('gameContainer');
            var rect = container.getBoundingClientRect();
            W = canvas.width = rect.width;
            H = canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 所有数据硬编码（不变）
        var monsterDB = {};
        var foodDB = {};
        var weaponDB = {};
        var taskDB = [];
        var gameConfig = {};

        // 游戏状态
        var gameData = {
            monsters: [],
            monsterIdCounter: 0,
            effects: [],
            taskIndex: 0,
            taskProgress: 0,
            taskClaimed1: false,
            taskClaimed5: false,
            taskClaimed10: false,
            lastTime: 0,
            deltaTime: 0,
            terrainSeed: Math.random() * 10000,
            isDead: false,
            isCleared: false,
            showSettlement: false
        };

        // 玩家对象（将从 data.json 加载）
        var player = {};

        // 按键状态
        var keys = { w: false, a: false, s: false, d: false };
        var joyX = 0,
            joyY = 0;

        // 长按检测
        var longPressTimer = null;
        var isLongPress = false;

        // BGM
        var bgm = null;
        var bgmPlaying = false;

        // 点击音效
        var clickAudio = null;

        // ================================================================
        //  3. 加载游戏数据（硬编码）
        // ================================================================

        function loadGameData() {
            gameConfig = {
                resurrectionCost: 75,
                drowningTime: 30,
                swimImageMing: 'Ming-swim.png',
                swimImageQing: 'Qing-swim.png',
                mapBoundaryMultiplier: 20
            };

            monsterDB = {};
            monsterDB[1] = {
                name: '恶魔小兵',
                Lv: 1,
                imc: 'https://xiaoye6661234.github.io/GuangXianWorld/Monster.png',
                hp: 75,
                maxHp: 75,
                Beat: 10,
                Def: 0,
                exp: 50,
                money: 20
            };

            foodDB = {};
            foodDB['披萨'] = {
                name: '披萨',
                HP: 50,
                imc: 'https://xiaoye6661234.github.io/GuangXianWorld/Pizza.png'
            };
            foodDB['面条'] = {
                name: '面条',
                HP: 25,
                imc: 'https://xiaoye6661234.github.io/GuangXianWorld/Noodle.png'
            };

            weaponDB = {};
            weaponDB['木剑'] = {
                name: '木剑',
                hit: 10,
                imc: 'https://xiaoye6661234.github.io/GuangXianWorld/WoodSword.png',
                Lv: 1
            };

            taskDB = [
                { word: '击杀怪物', given: { name: '披萨', num: 1 } }
            ];

            console.log('✅ 游戏数据已加载（硬编码）');
            return true;
        }

        // ================================================================
        //  4. 玩家系统（从 data.json 加载）
        // ================================================================

        function createDefaultPlayer() {
            return {
                x: 1000,
                y: 1000,
                speed: 350,
                hp: 100,
                maxHP: 100,
                attack: 10,
                defense: 0,
                level: 1,
                exp: 0,
                nextExp: 1000,
                coins: 0,
                nickname: '广仙道友',
                avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                inventory: [
                    { type: 'food', key: '披萨', qty: 2 },
                    { type: 'food', key: '面条', qty: 1 },
                    { type: 'weapon', key: '木剑', qty: 1 }
                ],
                equippedWeapon: null,
                attackCooldown: 0,
                attackCooldownMax: 0.4,
                isAttacking: false,
                attackTimer: 0,
                isSprinting: false,
                sprintTimer: 0,
                sprintCooldown: 0,
                invincible: 0,
                facing: 'down',
                inWater: false,
                waterTimer: 0,
                role: 'Ming',
                isDead: false
            };
        }

        // 从 data.json 加载玩家数据
        function loadPlayerFromData(data) {
            if (!data || !data.user) return createDefaultPlayer();

            var u = data.user;
            var p = createDefaultPlayer();

            // 基础属性
            p.nickname = u.nickname || '广仙道友';
            p.avatar = u.avatar || 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg';
            p.level = parseInt(u.level) || 1;
            p.coins = parseInt(u.coins) || 0;
            p.exp = parseInt(u.exp) || 0;
            p.nextExp = u.nextExp || (900 + p.level * 100);
            p.role = u.role || 'Ming';

            // 计算 HP 和攻击力
            var hpBonus = Math.floor((p.level - 1) / 3) * 10;
            p.maxHP = 100 + hpBonus;
            p.hp = p.maxHP;
            p.attack = 10 + (p.level - 1) * 5;

            // 装备武器
            if (data.equippedWeapon && weaponDB[data.equippedWeapon]) {
                p.equippedWeapon = weaponDB[data.equippedWeapon];
                p.attack += (p.equippedWeapon.hit || 10);
            }

            // 背包
            if (data.inventory && Array.isArray(data.inventory)) {
                p.inventory = JSON.parse(JSON.stringify(data.inventory));
            }

            // 任务进度
            if (data.taskProgress !== undefined) gameData.taskProgress = data.taskProgress;
            if (data.taskClaimed1 !== undefined) gameData.taskClaimed1 = data.taskClaimed1;
            if (data.taskClaimed5 !== undefined) gameData.taskClaimed5 = data.taskClaimed5;
            if (data.taskClaimed10 !== undefined) gameData.taskClaimed10 = data.taskClaimed10;

            return p;
        }

        // ================================================================

        // ================================================================

        var MAP_SIZE = 25;
        var TILE_SIZE = 80;
        var MAP_PIXELS = MAP_SIZE * TILE_SIZE;

        function getTerrainType(c, r, seed) {
            var x = c * 0.12 + seed * 0.001;
            var y = r * 0.12 + seed * 0.001;
            var n1 = Math.sin(x * 1.7 + y * 2.3) * 0.5 + Math.cos(x * 2.1 - y * 1.9) * 0.5;
            var n2 = Math.sin(x * 3.7 + y * 4.1) * 0.3 + Math.cos(x * 4.3 - y * 3.5) * 0.3;
            var n3 = Math.sin(x * 7.1 + y * 8.3) * 0.15 + Math.cos(x * 9.7 - y * 6.5) * 0.15;
            var value = n1 + n2 + n3;
            if (value < -0.5) return 'water';
            if (value < -0.05) return 'sand';
            return 'grass';
        }

        var terrainMap = [];

        function generateTerrain() {
            terrainMap = [];
            for (var r = 0; r < MAP_SIZE; r++) {
                terrainMap[r] = [];
                for (var c = 0; c < MAP_SIZE; c++) {
                    terrainMap[r][c] = getTerrainType(c, r, gameData.terrainSeed);
                }
            }
        }
        generateTerrain();

        // ================================================================
        //  6. 怪物系统（10只，HP 75，攻击 10）
        // ================================================================

        function spawnMonster(forceLv) {
            var lv = forceLv || 1;
            var template = monsterDB[lv];
            if (!template) {
                var levels = Object.keys(monsterDB).filter(function(k) { return !isNaN(k); }).map(Number).sort(function(a, b) {
                    return a - b;
                });
                if (levels.length === 0) return null;
                var bestLv = levels[0];
                for (var i = 0; i < levels.length; i++) {
                    if (Math.abs(levels[i] - lv) < Math.abs(bestLv - lv)) bestLv = levels[i];
                }
                return spawnMonster(bestLv);
            }
            var attempts = 0;
            var x, y;
            do {
                x = 80 + Math.random() * (MAP_PIXELS - 160);
                y = 80 + Math.random() * (MAP_PIXELS - 160);
                attempts++;
            } while (Math.sqrt((x - 1000) * (x - 1000) + (y - 1000) * (y - 1000)) < 300 && attempts < 50);

            var m = {
                id: gameData.monsterIdCounter++,
                x: x,
                y: y,
                name: template.name,
                Lv: template.Lv,
                imc: template.imc,
                hp: template.hp,
                maxHp: template.maxHp,
                Beat: template.Beat,
                Def: template.Def,
                exp: template.exp,
                money: template.money,
                alive: true,
                attackCooldown: 0,
                hitFlash: 0,
                moveTimer: 0,
                moveAngle: Math.random() * Math.PI * 2
            };
            gameData.monsters.push(m);
            return m;
        }

        function initMonsters() {
            gameData.monsters = [];
            gameData.monsterIdCounter = 0;
            for (var i = 0; i < 10; i++) {

                player.exp -= player.nextExp;

                player.attack += 5;

        function useFoodItem(foodKey) {
            var food = foodDB[foodKey];
            if (!food) { alert('无效食物'); return false; }
            if (player.hp >= player.maxHP) {
                alert('❤️ 生命值已满！');
                return false;
            }
            var healAmount = 0;
            if (foodKey === '披萨') {
                healAmount = Math.floor(player.maxHP * 0.5);
            } else if (foodKey === '面条') {
                healAmount = 25;
            } else {
                healAmount = food.HP || 25;
            }
            player.hp = Math.min(player.hp + healAmount, player.maxHP);

            var idx = -1;
            for (var i = 0; i < player.inventory.length; i++) {
                if (player.inventory[i].type === 'food' && player.inventory[i].key === foodKey) {
                    idx = i;
                    break;
                }
            }
            if (idx !== -1) {
                player.inventory[idx].qty -= 1;
                if (player.inventory[idx].qty <= 0) {
                    player.inventory.splice(idx, 1);
                }
            }
            updateUI();
            updateInventoryGrid();
            saveGame();
            return true;
        }

        function equipWeapon(weaponKey) {
            var w = weaponDB[weaponKey];
            if (!w) return;
            player.equippedWeapon = w;
            var baseAttack = 10 + (player.level - 1) * 5;
            player.attack = baseAttack + (w.hit || 10);
            alert('⚔️ 装备了 ' + w.name + '，攻击力 +' + (w.hit || 10));
            updateUI();
            saveGame();
        }

            for (var i = 0; i < player.inventory.length; i++) {

                    noodle = player.inventory[i];

            if (noodle) {

            var pizza = null;
            for (var i = 0; i < player.inventory.length; i++) {
                if (player.inventory[i].type === 'food' && player.inventory[i].key === '披萨') {

        //  10. 战斗系统
        // ================================================================

        function performAttack() {
            if (player.attackCooldown > 0 || player.isAttacking || player.isDead || gameData.showSettlement) return;
            player.attackCooldown = player.attackCooldownMax;
            player.isAttacking = true;
            player.attackTimer = 0.3;

            var target = null;
            var minDist = 220;
            for (var i = 0; i < gameData.monsters.length; i++) {
                var m = gameData.monsters[i];
                if (!m.alive) continue;
                var dx = m.x - player.x;
                var dy = m.y - player.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    target = m;
                }
            }

            if (target) {
                var atk = player.attack + (player.equippedWeapon ? (player.equippedWeapon.hit || 10) : 0);
                var dmg = Math.max(1, atk - (target.Def || 0));
                target.hp -= dmg;
                target.hitFlash = 0.2;

                var hitNum = Math.floor(Math.random() * 7) + 1;
                var effectImg = new Image();
                effectImg.src = 'https://xiaoye6661234.github.io/GuangXianWorld/HitSound' + hitNum + '.png';
                gameData.effects.push({
                    img: effectImg,
                    x: target.x,
                    y: target.y,
                    life: 0.4,
                    timer: 0
                });

                try {
                    var audio = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/Beat.mp3');
                    audio.volume = 0.3;
                    audio.play().catch(function() {});
                } catch (e) {}

                if (target.hp <= 0) {
                    target.alive = false;
                    taskState.killCount++;
                    gameData.taskProgress = taskState.killCount;
                    player.exp += target.exp || 50;
                    player.coins += target.money || 20;

                    var aliveCount = 0;
                    for (var j = 0; j < gameData.monsters.length; j++) {
                        if (gameData.monsters[j].alive) aliveCount++;
                    }
                    if (aliveCount === 0) {
                        gameData.isCleared = true;
                        showSettlement(true);
                    }

                    checkLevelUp();
                    saveGame();
                    updateUI();
                    updateTaskUI();
                }
            }
            setTimeout(function() { player.isAttacking = false; }, 400);
        }

        // 摇杆控制
        var joystickZone = document.getElementById('joystickZone');
        var joystickKnob = document.getElementById('joystickKnob');
        var touchId = null;
        joystickZone.addEventListener('touchstart', function(e) {
            var t = e.changedTouches[0];
            touchId = t.identifier;
            handleJoystick(t);
        });
        joystickZone.addEventListener('touchmove', function(e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) handleJoystick(e.changedTouches[i]);
            }
        });
        joystickZone.addEventListener('touchend', function(e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    joyX = 0;
                    joyY = 0;
                    joystickKnob.style.transform = 'translate(0, 0)';
                    touchId = null;
                }
            }
        });

        function handleJoystick(touch) {
            var rect = joystickZone.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var dx = touch.clientX - cx;
            var dy = touch.clientY - cy;
            var maxR = rect.width / 2 - 15;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var ratio = Math.min(1, dist / maxR);
            joyX = (dx / maxR) * ratio;
            joyY = (dy / maxR) * ratio;
            var kx = joyX * maxR;
            var ky = joyY * maxR;
            joystickKnob.style.transform = 'translate(' + kx + 'px, ' + ky + 'px)';
        }

                } else {
                    imgSrc = 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg';
                    detailText = '📦 未知物品';
                }
                div.innerHTML = '<img src="' + imgSrc +
                    '" onerror="this.src=\'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg\'" />' +
                    '<div class="item-name">' + item.key + '</div>' +
                    '<div class="item-qty">×' + item.qty + '</div>';

                div.addEventListener('click', function(e) {
                    if (isLongPress) {
                        isLongPress = false;
                        return;
                    }
                    if (item.type === 'food') {
                        useFoodItem(item.key);
                    } else if (item.type === 'weapon') {
                        equipWeapon(item.key);
                    }
                    e.stopPropagation();
                });
                div.addEventListener('touchstart', function(e) {
                    longPressTimer = setTimeout(function() {
                        isLongPress = true;
                        showDetail(item, idx);
                        longPressTimer = null;
                    }, 600);
                });
                div.addEventListener('touchend', function() {
                    if (longPressTimer) clearTimeout(longPressTimer);
                });
                div.addEventListener('mousedown', function(e) {
                    longPressTimer = setTimeout(function() {
                        isLongPress = true;
                        showDetail(item, idx);
                        longPressTimer = null;
                    }, 600);
                });
                div.addEventListener('mouseup', function() {
                    if (longPressTimer) clearTimeout(longPressTimer);
                });
                div.addEventListener('mouseleave', function() {
                    if (longPressTimer) clearTimeout(longPressTimer);
                });
                grid.appendChild(div);
            });
        }

        var currentDetailIdx = -1;

        function showDetail(item, idx) {
            currentDetailIdx = idx;
            var modal = document.getElementById('itemDetailModal');
            var title = document.getElementById('detailTitle');
            var img = document.getElementById('detailImg');
            var desc = document.getElementById('detailDesc');
            var btn = document.getElementById('detailUseBtn');
            title.innerText = item.key;
            var imgSrc = '';
            var description = '';
            var btnText = '使用';
            if (item.type === 'food' && foodDB[item.key]) {
                var food = foodDB[item.key];
                imgSrc = food.imc;
                description = '❤️ 可恢复 ' + (item.key === '披萨' ? '50% HP' : '25 HP');
                btnText = '使用恢复';
            } else if (item.type === 'weapon' && weaponDB[item.key]) {
                var weapon = weaponDB[item.key];
                imgSrc = weapon.imc;
                description = '⚔️ 攻击力 +' + (weapon.hit || 10) + ' (Lv.' + (weapon.Lv || 1) + ')';
                btnText = '装备武器';
            } else {
                imgSrc = 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg';
                description = '📦 未知物品';
                btnText = '关闭';
            }
            img.src = imgSrc;
            desc.innerText = description;
            btn.innerText = btnText;
            modal.style.display = 'flex';
        }

        function closeDetail() {
            document.getElementById('itemDetailModal').style.display = 'none';
            currentDetailIdx = -1;
        }

        function useDetailItem() {
            if (currentDetailIdx === -1) return;
            var item = player.inventory[currentDetailIdx];
            if (!item) return;
            if (item.type === 'food') {
                if (useFoodItem(item.key)) {
                    closeDetail();
                }
            } else if (item.type === 'weapon') {
                equipWeapon(item.key);
                closeDetail();
                updateInventoryGrid();
            }
            updateUI();
        }

        // ================================================================
        //  17. UI更新
        // ================================================================

        function updateUI() {
            document.getElementById('lvlDisplay').innerText = 'Lv.' + player.level;
            document.getElementById('nickDisplay').innerText = player.nickname;
            document.getElementById('avatarImg').src = player.avatar;
            var hpPercent = Math.max(0, (player.hp / player.maxHP) * 100);
            document.getElementById('hpBarInner').style.width = hpPercent + '%';
            document.getElementById('hpBarInner').innerText = Math.round(hpPercent) + '%';
            updateTaskUI();
        }

        // ================================================================
        //  18. 游戏更新循环
        // ================================================================

        function update(dt) {
            if (player.isDead || gameData.showSettlement) return;

            var dx = 0,
                dy = 0;
            if (keys.w) dy = -1;
            if (keys.s) dy = 1;
            if (keys.a) dx = -1;
            if (keys.d) dx = 1;
            if (joyX !== 0 || joyY !== 0) {
                dx = joyX;
                dy = joyY;
            }
            var len = Math.sqrt(dx * dx + dy * dy);
            if (len > 0) {
                dx /= len;
                dy /= len;
                var speedMod = player.inWater ? 0.5 : 1;
                player.x += dx * player.speed * speedMod * dt;
                player.y += dy * player.speed * speedMod * dt;

                if (Math.abs(dx) >= Math.abs(dy)) {
                    player.facing = dx > 0 ? 'right' : 'left';
                } else {
                    player.facing = dy > 0 ? 'down' : 'up';
                }
            }

            var margin = 30;
            player.x = Math.max(margin, Math.min(MAP_PIXELS - margin, player.x));
            player.y = Math.max(margin, Math.min(MAP_PIXELS - margin, player.y));

            var c = Math.floor(player.x / TILE_SIZE);
            var r = Math.floor(player.y / TILE_SIZE);
            if (c >= 0 && c < MAP_SIZE && r >= 0 && r < MAP_SIZE) {
                var terrainType = terrainMap[r][c];
                if (terrainType === 'water') {
                    if (!player.inWater) {
                        player.inWater = true;
                        player.waterTimer = 0;
                    }
                    player.waterTimer += dt;
                    if (player.waterTimer >= gameConfig.drowningTime) {
                        player.hp = 0;
                        handleDeath();
                        return;
                    }
                } else {
                    if (player.inWater) {
                        player.inWater = false;
                        player.waterTimer = 0;
                    }
                }
            }

            if (player.attackCooldown > 0) player.attackCooldown -= dt;
            if (player.attackTimer > 0) player.attackTimer -= dt;
            if (player.invincible > 0) player.invincible -= dt;
            if (player.sprintCooldown > 0) player.sprintCooldown -= dt;
            if (player.isSprinting) {
                player.sprintTimer -= dt;
                if (player.sprintTimer <= 0) {
                    player.isSprinting = false;
                    player.speed = 350;
                }
            }

            for (var i = 0; i < gameData.monsters.length; i++) {
                var m = gameData.monsters[i];
                if (!m.alive) continue;
                if (m.hitFlash > 0) m.hitFlash -= dt;
                m.attackCooldown = Math.max(0, m.attackCooldown - dt);

                var dx2 = player.x - m.x;
                var dy2 = player.y - m.y;
                var dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);

                if (dist < 400) {
                    var speed = 50 + m.Lv * 12 + (player.isSprinting ? 20 : 0);
                    if (dist > 30) {
                        m.x += (dx2 / dist) * speed * dt;
                        m.y += (dy2 / dist) * speed * dt;
                    }
                } else if (dist < 600) {
                    m.moveTimer -= dt;
                    if (m.moveTimer <= 0) {
                        m.moveTimer = 0.5 + Math.random() * 1.5;
                        m.moveAngle += (Math.random() - 0.5) * 2;
                        m.x += Math.cos(m.moveAngle) * 30 * dt;
                        m.y += Math.sin(m.moveAngle) * 30 * dt;
                    }
                }

                m.x = Math.max(margin, Math.min(MAP_PIXELS - margin, m.x));
                m.y = Math.max(margin, Math.min(MAP_PIXELS - margin, m.y));

                if (dist < 70 && m.attackCooldown <= 0 && player.invincible <= 0) {
                    var dmg = Math.max(1, (m.Beat || 10) - player.defense);
                    player.hp -= dmg;
                    player.invincible = 0.5;
                    m.attackCooldown = 1.0;
                    if (player.hp <= 0) {
                        player.hp = 0;
                        handleDeath();
                        return;
                    }
                    updateUI();
                }
            }

            gameData.monsters = gameData.monsters.filter(function(m) { return m.alive; });
            var targetCount = 10;
            while (gameData.monsters.length < targetCount) {
                spawnMonster(1);
            }

            for (var j = gameData.effects.length - 1; j >= 0; j--) {
                var ef = gameData.effects[j];
                ef.timer += dt;
                if (ef.timer >= ef.life) {
                    gameData.effects.splice(j, 1);
                }
            }

            updateUI();
        }

        // ================================================================
        //  19. 渲染
        // ================================================================

        function render() {
            ctx.clearRect(0, 0, W, H);
            var offsetX = player.x - W / 2;
            var offsetY = player.y - H / 2;

            var viewCols = Math.ceil(W / TILE_SIZE) + 3;
            var viewRows = Math.ceil(H / TILE_SIZE) + 3;
            var startCol = Math.floor((player.x - W / 2) / TILE_SIZE) - 2;
            var startRow = Math.floor((player.y - H / 2) / TILE_SIZE) - 2;

            var terrainImages = {
                grass: new Image(),
                sand: new Image(),
                water: new Image()
            };
            terrainImages.grass.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Grass.jpg';
            terrainImages.sand.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Sand.jpg';
            terrainImages.water.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Water.jpg';

            for (var r = startRow; r < startRow + viewRows; r++) {
                for (var c = startCol; c < startCol + viewCols; c++) {
                    if (c < 0 || c >= MAP_SIZE || r < 0 || r >= MAP_SIZE) {
                        var x = c * TILE_SIZE - offsetX;
                        var y = r * TILE_SIZE - offsetY;
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        continue;
                    }
                    var type = terrainMap[r][c];
                    var img = terrainImages[type];
                    var px = c * TILE_SIZE - offsetX;
                    var py = r * TILE_SIZE - offsetY;
                    if (img.complete && img.naturalWidth > 0) {
                        ctx.drawImage(img, px, py, TILE_SIZE, TILE_SIZE);
                    } else {
                        if (type === 'grass') ctx.fillStyle = '#4CAF50';
                        else if (type === 'sand') ctx.fillStyle = '#f4e4b6';
                        else ctx.fillStyle = '#2196F3';
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            ctx.strokeStyle = 'rgba(255,0,0,0.3)';
            ctx.lineWidth = 3;
            ctx.strokeRect(-offsetX, -offsetY, MAP_PIXELS, MAP_PIXELS);

            for (var i = 0; i < gameData.monsters.length; i++) {
                var m = gameData.monsters[i];
                if (!m.alive) continue;
                var mx = m.x - offsetX;
                var my = m.y - offsetY;
                var size = 50;

                var img = new Image();
                img.src = m.imc;
                if (img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, mx - size / 2, my - size / 2, size, size);
                } else {
                    ctx.fillStyle = '#8B0000';
                    ctx.beginPath();
                    ctx.arc(mx, my, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = 'white';
                ctx.font = '1vw Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText('Lv.' + m.Lv, mx, my - size / 2 - 8);
                ctx.shadowBlur = 0;

                var hpW = 40;
                var hpH = 3;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(mx - hpW / 2, my - size / 2 - 16, hpW, hpH);
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(mx - hpW / 2, my - size / 2 - 16, hpW * (m.hp / m.maxHp), hpH);

                if (m.hitFlash > 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.beginPath();
                    ctx.arc(mx, my, size / 2 + 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            var px = player.x - offsetX;
            var py = player.y - offsetY;
            var pSize = 50;
            var playerImgName = player.role === '清' ? 'Qing.png' : 'Ming.png';
            var playerImg = new Image();
            playerImg.src = 'https://xiaoye6661234.github.io/GuangXianWorld/' + playerImgName;
            if (playerImg.complete && playerImg.naturalWidth > 0) {
                ctx.drawImage(playerImg, px - pSize / 2, py - pSize / 2, pSize, pSize);
            } else {
                ctx.fillStyle = '#4A90E2';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            if (player.invincible > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 4, 0, Math.PI * 2);
                ctx.fill();
            }
            if (player.inWater && !player.isDead) {
                ctx.fillStyle = 'rgba(100, 200, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 6, 0, Math.PI * 2);
                ctx.fill();
            }

            for (var k = 0; k < gameData.effects.length; k++) {
                var ef2 = gameData.effects[k];
                var ex = ef2.x - offsetX;
                var ey = ef2.y - offsetY;
                var size2 = 80 * (W / 1000);
                if (ef2.img.complete && ef2.img.naturalWidth > 0) {
                    ctx.drawImage(ef2.img, ex - size2 / 2, ey - size2 / 2, size2, size2);
                }
            }

            if (player.isAttacking) {
                var angle = player.facing === 'right' ? 0 : player.facing === 'left' ? Math.PI : player.facing === 'up' ? -Math
                    .PI / 2 : Math.PI / 2;
                var len2 = 30;
                var ex2 = px + Math.cos(angle) * len2;
                var ey2 = py + Math.sin(angle) * len2;
                ctx.strokeStyle = 'rgba(255,255,200,0.8)';
                ctx.lineWidth = 4;
                ctx.shadowColor = 'rgba(255,255,100,0.6)';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(ex2, ey2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // ================================================================
        //  20. 游戏循环
        // ================================================================

        function loop(timestamp) {
            var dt = Math.min((timestamp - gameData.lastTime) / 1000, 0.05);
            gameData.lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        // ================================================================
        //  21. 初始化启动
        // ================================================================

        function init() {
            // 加载硬编码数据
            loadGameData();
            generateTerrain();

            // 从 data.json 加载玩家数据
            var data = loadData();
            if (!data) {
                // 如果没有数据，创建默认数据并跳转登录
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user) {
                alert('数据异常，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user.role) {
                window.location.href = 'ChooseRole.html';
                return;
            }
            if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                window.location.href = 'PersonalInformation.html';
                return;
            }

            // 加载玩家数据
            player = loadPlayerFromData(data);

            // 初始化任务状态
            initTaskState();

            // 初始化怪物
            player.x = 1000;
            player.y = 1000;
            initMonsters();

            // 更新 UI
            updateUI();
            updateInventoryGrid();
            updateTaskUI();

            // 音频
            initAudio();
            addClickSounds();

            gameData.lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        init();
        window.addEventListener('resize', function() { resizeCanvas(); });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        console.log('🎮 广仙世界 · 第一章 已启动！');
        console.log('📖 快捷键: W/A/S/D 移动 | H 攻击 | Q 疾跑 | R 恢复 | B 背包 | F 领任务');
        console.log('🎯 目标: 击杀10只怪物通关晋级！');
        console.log('💾 数据与 data.json 完全互通');
    </script>
