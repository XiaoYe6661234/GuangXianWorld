<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择角色</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/Choose Character.png');
            background-size: cover;
            background-position: center;
        }
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.2vw; /* 调小标题字号 */
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        .characters {
            position: absolute;
            top: 28%; /* 微调上移 */
            width: 70%; /* 缩小容器宽度增加左右间距 */
            left: 15%; /* 居中对齐 */
            display: flex;
            justify-content: space-between; /* 均匀分布避免拥挤 */
            align-items: center;
        }
        .char-box {
            text-align: center;
            cursor: pointer;
        }
        .char-box img {
            height: 24vw; /* 大幅缩小人物尺寸 */
            border: 3px solid transparent;
            border-radius: 0; /* 去掉圆角匹配立绘效果 */
            transition: 0.3s;
        }
        .char-box.selected img {
            border: 3px solid #ffcc00;
            box-shadow: 0 0 25px rgba(255,204,0,0.6);
        }
        .char-name {
            color: white;
            font-size: 2.2vw; /* 调小角色名字号 */
            margin-top: 1.2vw;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            font-weight: 600;
        }
        .btn-confirm {
            position: absolute;
            bottom: 10%; /* 微调下移 */
            left: 50%;
            transform: translateX(-50%);
            background: #ffb300; /* 匹配设计图亮黄色 */
            color: white;
            font-size: 2.4vw; /* 调小按钮字号 */
            padding: 0.8vw 6vw; /* 缩小内边距 */
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-confirm:hover {
            background: #ffa000;
            transform: translateX(-50%) scale(1.02);
        }
        .btn-confirm:disabled {
            background: #888;
            cursor: not-allowed;
            transform: translateX(-50%) scale(1);
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">请选择角色</div>
        <div class="characters">
            <div class="char-box" id="charQing">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Qing.png" alt="清" />
                <div class="char-name">清</div>
            </div>
            <div class="char-box" id="charMing">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Ming.png" alt="铭" />
                <div class="char-name">铭</div>
            </div>
        </div>
        <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>
    <script>
        // ========== 核心功能100%保留 未做任何修改 ==========
        let selectedChar = '';
        // 检查是否有数据，没有则跳转回登录
        (function checkData() {
            const raw = localStorage.getItem('GuangXianData');
            if (!raw) {
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            try {
                const parsed = JSON.parse(raw);
                if (!parsed || !parsed.user) {
                    alert('数据异常，请重新登录！');
                    window.location.href = 'Signin.html';
                    return;
                }
                // 如果已有角色，直接跳转到完善信息
                if (parsed.user.role) {
                    window.location.href = 'PersonalInformation.html';
                    return;
                }
            } catch (e) {
                alert('数据损坏，请重新登录！');
                window.location.href = 'Signin.html';
            }
        })();
        document.querySelectorAll('.char-box').forEach(box => {
            box.addEventListener('click', function() {
                document.querySelectorAll('.char-box').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedChar = this.id === 'charQing' ? '清' : '铭';
                // 音效
                let click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
                click.volume = 0.5;
                click.play().catch(e => {});
            });
        });
        document.getElementById('confirmBtn').addEventListener('click', function() {
            let click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            click.volume = 0.5;
            click.play().catch(e => {});
            if (!selectedChar) {
                alert('请选择一个角色！');
                return;
            }
            // 读取数据并更新角色
            let raw = localStorage.getItem('GuangXianData');
            if (!raw) {
                alert('数据错误，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            try {
                let parsed = JSON.parse(raw);
                parsed.user.role = selectedChar;
                localStorage.setItem('GuangXianData', JSON.stringify(parsed));
                // 跳转到完善个人信息
                window.location.href = 'PersonalInformation.html';
            } catch (e) {
                alert('数据保存失败，请重新登录！');
                window.location.href = 'Signin.html';
            }
        });
    </script>
</body>
</html>
