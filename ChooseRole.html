<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>选择角色</title>
    <style>
        /* ===== 全局重置 & 防下载 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/Choose Character.png');
            background-size: cover;
            background-position: center;
        }

        /* ===== 标题 ===== */
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.6vw;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-weight: bold;
            letter-spacing: 0.04em;
        }

        /* ===== 角色容器 ===== */
        .characters {
            position: absolute;
            top: 28%;
            width: 70%;
            left: 15%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ===== 单个角色框 ===== */
        .char-box {
            text-align: center;
            cursor: pointer;
        }

        /* ===== 角色图片 (防下载) ===== */
        .char-box img {
            height: 24vw;
            border: 3px solid transparent;
            border-radius: 0;
            transition: 0.3s;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
            draggable: false;
        }

        .char-box.selected img {
            border: 3px solid #ffcc00;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.6);
        }

        /* ===== 角色名 ===== */
        .char-name {
            color: white;
            font-size: 1.8vw;
            margin-top: 1.2vw;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        /* ===== 确定按钮 ===== */
        .btn-confirm {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: #ffb300;
            color: white;
            font-size: 2.0vw;
            padding: 0.8vw 6vw;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .btn-confirm:hover {
            background: #ffa000;
            transform: translateX(-50%) scale(1.02);
        }
        .btn-confirm:disabled {
            background: #888;
            cursor: not-allowed;
            transform: translateX(-50%) scale(1);
        }
        .btn-confirm:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* ===== 竖屏适配 ===== */
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">请选择角色</div>

        <div class="characters">
            <!-- 角色 清 -->
            <div class="char-box" id="charQing">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Qing.png" alt="清" draggable="false" oncontextmenu="return false" />
                <div class="char-name">清</div>
            </div>
            <!-- 角色 铭 -->
            <div class="char-box" id="charMing">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Ming.png" alt="铭" draggable="false" oncontextmenu="return false" />
                <div class="char-name">铭</div>
            </div>
        </div>

        <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>

    <script>
        // ================================================================
        //  统一 data.json 操作函数
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: ''
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        // ================================================================
        //  核心功能
        // ================================================================

        var selectedChar = '';

        // 检查数据并确保存在 user
        (function checkData() {
            var data = loadData();
            if (!data) {
                // 若无数据，创建默认数据，但跳转登录
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user) {
                alert('数据异常，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            // 如果已有角色，直接跳转完善信息（如果昵称地区不完整）或大厅
            if (data.user.role) {
                // 如果昵称或地区缺失，跳转完善信息
                if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                    window.location.href = 'PersonalInformation.html';
                } else {
                    window.location.href = 'Hall.html';
                }
                return;
            }
            // 如果没有角色，显示当前页面
        })();

        document.querySelectorAll('.char-box').forEach(function(box) {
            box.addEventListener('click', function() {
                document.querySelectorAll('.char-box').forEach(function(b) {
                    b.classList.remove('selected');
                });
                this.classList.add('selected');
                selectedChar = this.id === 'charQing' ? '清' : '铭';

                // 音效
                var click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
                click.volume = 0.5;
                click.play().catch(function(e) {});
            });
        });

        document.getElementById('confirmBtn').addEventListener('click', function() {
            var click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            click.volume = 0.5;
            click.play().catch(function(e) {});

            if (!selectedChar) {
                alert('请选择一个角色！');
                return;
            }

            var data = loadData();
            if (!data) {
                alert('数据错误，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            try {
                data.user.role = selectedChar;
                saveData(data);
                // 跳转到完善个人信息
                window.location.href = 'PersonalInformation.html';
            } catch (e) {
                alert('数据保存失败，请重新登录！');
                window.location.href = 'Signin.html';
            }
        });
    </script>

</body>
</html>
