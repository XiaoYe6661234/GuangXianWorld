<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>选择角色 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: #f5efe6;
            overflow: hidden;
        }
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.6vw;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 0.06em;
        }
        .characters {
            position: absolute;
            top: 24%;
            left: 10%;
            width: 80%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6%;
        }
        .char-box {
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            flex: 0 0 30%;
            max-width: 180px;
        }
        .char-box:active {
            transform: scale(0.96);
        }
        .char-box img {
            width: 100%;
            height: auto;
            border: 4px solid transparent;
            border-radius: 8px;
            transition: 0.2s;
            pointer-events: none;
            draggable: false;
        }
        .char-box.selected img {
            border-color: #ffb300;
            box-shadow: 0 0 30px rgba(255, 179, 0, 0.4);
        }
        .char-name {
            color: #1a1a1a;
            font-size: 2.2vw;
            font-weight: 700;
            margin-top: 1vw;
        }
        .btn-confirm {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background: #ffb300;
            color: #fff;
            font-size: 2.2vw;
            padding: 0.8vw 6vw;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.15s;
            box-shadow: 0 4px 16px rgba(255, 179, 0, 0.3);
        }
        .btn-confirm:active {
            transform: translateX(-50%) scale(0.96);
            background: #ffa000;
        }
        .btn-confirm:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: translateX(-50%) scale(1);
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
        @media (max-width: 600px) {
            .title {
                font-size: 5vw;
            }
            .char-name {
                font-size: 3.5vw;
            }
            .btn-confirm {
                font-size: 3.5vw;
                padding: 1.2vw 8vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">请选择你的角色</div>
        <div class="characters">
            <div class="char-box" id="charQing">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Qing.png" draggable="false" alt="清" />
                <div class="char-name">清</div>
            </div>
            <div class="char-box" id="charMing">
                <img src="https://xiaoye6661234.github.io/GuangXianWorld/Ming.png" draggable="false" alt="铭" />
                <div class="char-name">铭</div>
            </div>
        </div>
        <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>

    <script>
        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch (e) { return null; }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        var selectedChar = '';

        // 检查数据
        (function() {
            var data = loadData();
            if (!data) {
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user) {
                alert('数据异常，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (data.user.role) {
                if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                    window.location.href = 'PersonalInformation.html';
                } else {
                    window.location.href = 'Hall.html';
                }
                return;
            }
        })();

        document.querySelectorAll('.char-box').forEach(function(box) {
            box.addEventListener('click', function() {
                document.querySelectorAll('.char-box').forEach(function(b) { b.classList.remove('selected'); });
                this.classList.add('selected');
                selectedChar = this.id === 'charQing' ? '清' : '铭';
            });
        });

        document.getElementById('confirmBtn').addEventListener('click', function() {
            if (!selectedChar) {
                alert('请选择一个角色！');
                return;
            }
            var data = loadData();
            if (!data) {
                alert('数据错误，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            data.user.role = selectedChar;
            saveData(data);
            window.location.href = 'PersonalInformation.html';
        });
    </script>
</body>
</html>
