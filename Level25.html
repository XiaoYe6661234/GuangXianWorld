<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>广仙世界 · 第二十五章 · 终极Boss</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: #2d5e2b;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            background: #87ceeb;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .ui-layer>* {
            pointer-events: auto;
        }

        /* 左上玩家信息 */
        #playerInfo {
            position: absolute;
            top: 1.5%;
            left: 1.5%;
            display: flex;
            align-items: center;
            gap: 0.6vw;
        }
        #avatarBox {
            width: 6vw;
            height: 6vw;
            border: 2px solid white;
            border-radius: 4px;
            overflow: hidden;
            background: #ccc;
        }
        #avatarBox img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-text {
            display: flex;
            flex-direction: column;
            gap: 0.3vw;
        }
        .info-text .nickname {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.3vw;
            font-weight: bold;
            padding: 0.15vw 1vw;
            border-radius: 4px;
        }
        .info-text .lvl {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.7vw;
            font-weight: bold;
            padding: 0.15vw 1vw;
            border-radius: 4px;
        }

        /* 血条 */
        #hpBarContainer {
            position: absolute;
            top: 2.5%;
            left: 30%;
            width: 35%;
            height: 3vw;
            background: #cc0000;
            border: 0.25vw solid #ff9900;
            border-radius: 5px;
            overflow: hidden;
        }
        #hpBarInner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d61a1a, #ff4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6vw;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px black;
        }

        /* 护盾条 */
        #shieldBarContainer {
            position: absolute;
            top: 6%;
            left: 30%;
            width: 35%;
            height: 1.8vw;
            background: #0044aa;
            border: 0.2vw solid #66ccff;
            border-radius: 5px;
            overflow: hidden;
            z-index: 15;
        }
        #shieldBarInner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0088ff, #66ccff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1vw;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px black;
            transition: width 0.2s;
        }

        /* 返回大厅按钮 */
        #backToHallBtn {
            position: absolute;
            top: 1.5%;
            right: 1.5%;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid #ffaa00;
            border-radius: 5px;
            padding: 0.2vw 1vw;
            font-size: 1vw;
            font-weight: bold;
            cursor: pointer;
            z-index: 12;
            pointer-events: auto;
            transition: 0.2s;
        }
        #backToHallBtn:hover {
            background: rgba(255, 170, 0, 0.3);
        }

        /* 任务面板 - Boss战 */
        #taskContainer {
            position: absolute;
            top: 12%;
            right: 1.5%;
            background: rgba(0, 0, 0, 0.7);
            padding: 0.6vw 1vw;
            border-radius: 5px;
            color: white;
            font-size: 1vw;
            line-height: 1.3;
            min-width: 18vw;
        }
        #taskContainer .task-title {
            font-size: 1.2vw;
            font-weight: bold;
            margin-bottom: 0.2vw;
            color: #fff;
        }
        #taskContainer .task-reward {
            margin-top: 0.15vw;
            color: #ffaa00;
            font-size: 0.85vw;
        }
        #claimTaskBtn {
            background: #ffaa00;
            color: black;
            font-weight: bold;
            border: none;
            padding: 0.15vw 1vw;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9vw;
            margin-top: 0.3vw;
            display: none;
        }
        #taskProgressList {
            font-size: 0.9vw;
            line-height: 1.5;
            margin-top: 0.2vw;
        }
        .task-progress-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-progress-item .label {
            color: #ccc;
        }
        .task-progress-item .count {
            color: #ffcc00;
            font-weight: bold;
        }
        .task-progress-item.done .count {
            color: #44ff44;
        }

        /* 右侧控制按钮 */
        #controls {
            position: absolute;
            bottom: 3%;
            right: 2%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6vw;
        }
        .ctrl-row {
            display: flex;
            gap: 0.6vw;
            align-items: center;
        }
        .ctrl-btn {
            width: 7vw;
            height: 7vw;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .ctrl-btn:active {
            transform: scale(0.9);
        }
        .ctrl-btn.small {
            width: 5.5vw;
            height: 5.5vw;
        }
        .ctrl-btn img {
            width: 55%;
            height: 55%;
            object-fit: contain;
        }
        .ctrl-label {
            color: white;
            font-size: 0.85vw;
            text-shadow: 1px 1px 3px black;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.1vw 0.5vw;
            border-radius: 3px;
            font-weight: bold;
        }

        /* 摇杆 */
        #joystickZone {
            position: absolute;
            bottom: 3%;
            left: 3%;
            width: 12vw;
            height: 12vw;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystickKnob {
            width: 4.5vw;
            height: 4.5vw;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
            transition: 0.05s;
        }

        /* 背包弹窗 */
        #inventoryModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #inventoryPanel {
            width: 75%;
            height: 75%;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/settingbackground.jpg');
            background-size: cover;
            border-radius: 8px;
            padding: 2vw;
            position: relative;
        }
        #invHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 2.8vw;
            font-weight: bold;
            margin-bottom: 1.5vw;
            color: #000;
        }
        #invClose {
            font-size: 3.5vw;
            cursor: pointer;
            color: #000;
            line-height: 1;
        }
        #invGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(9vw, 1fr));
            gap: 1.2vw;
        }
        .inv-item {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1vw 0.6vw;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .inv-item:hover {
            border-color: #ffaa00;
            transform: translateY(-2px);
        }
        .inv-item img {
            width: 60%;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
        }
        .inv-item .item-name {
            color: white;
            font-size: 1vw;
            margin-top: 0.3vw;
            font-weight: bold;
        }
        .inv-item .item-qty {
            color: #ffaa00;
            font-size: 0.85vw;
            margin-top: 0.1vw;
        }

        /* 物品详情弹窗 */
        #itemDetailModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #detailPanel {
            width: 50%;
            max-width: 35vw;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            padding: 2vw;
            position: relative;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #detailClose {
            position: absolute;
            top: 1.2vw;
            right: 2vw;
            font-size: 3vw;
            cursor: pointer;
            color: #fff;
            line-height: 1;
        }
        #detailTitle {
            font-size: 2.4vw;
            font-weight: bold;
            margin-bottom: 1.2vw;
            color: #fff;
        }
        #detailImg {
            width: 10vw;
            height: 10vw;
            object-fit: contain;
            margin-bottom: 1.2vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            padding: 0.6vw;
        }
        #detailDesc {
            font-size: 1.3vw;
            margin-bottom: 2vw;
            text-align: center;
            color: #ccc;
        }
        #detailUseBtn {
            background: #ff8800;
            color: white;
            font-size: 1.5vw;
            padding: 0.6vw 3.5vw;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 结算/复活弹窗 */
        #settlementModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #settlementPanel {
            width: 55%;
            max-width: 40vw;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            padding: 2.5vw;
            position: relative;
            color: white;
            text-align: center;
            border: 2px solid #ffd700;
        }
        #settlementPanel .title {
            font-size: 2.5vw;
            font-weight: bold;
            margin-bottom: 1vw;
            color: #ffd700;
        }
        #settlementPanel .info {
            font-size: 1.3vw;
            margin-bottom: 1vw;
            color: #ccc;
            line-height: 1.6;
        }
        #settlementPanel .info span {
            color: #ffaa00;
            font-weight: bold;
        }
        #settlementPanel .btns {
            display: flex;
            gap: 1.5vw;
            justify-content: center;
            margin-top: 1vw;
            flex-wrap: wrap;
        }
        #settlementPanel .btns button {
            padding: 0.6vw 2vw;
            border: none;
            border-radius: 5px;
            font-size: 1.2vw;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        #settlementPanel .btns button:hover {
            transform: scale(1.05);
        }
        .btn-gold {
            background: #ffd700;
            color: black;
        }
        .btn-red {
            background: #cc3333;
            color: white;
        }
        .btn-blue {
            background: #4488ff;
            color: white;
        }
        .btn-green {
            background: #44bb44;
            color: white;
        }

        @media (orientation: portrait) {
            #gameContainer {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiLayer" class="ui-layer">
            <!-- 返回大厅按钮 -->
            <div id="backToHallBtn">🏠 返回大厅</div>

            <!-- 玩家信息 -->
            <div id="playerInfo">
                <div id="avatarBox"><img id="avatarImg" src="https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg" /></div>
                <div class="info-text">
                    <div class="nickname" id="nickDisplay">昵称</div>
                    <div class="lvl" id="lvlDisplay">Lv.25</div>
                </div>
            </div>
            <!-- 血条 -->
            <div id="hpBarContainer">
                <div id="hpBarInner" style="width:100%">100%</div>
            </div>
            <!-- 护盾条 -->
            <div id="shieldBarContainer">
                <div id="shieldBarInner" style="width:0%">0/150</div>
            </div>
            <!-- 任务面板 - Boss战 -->
            <div id="taskContainer">
                <div class="task-title">👑 终焉审判</div>
                <div id="taskProgressList">
                    <div class="task-progress-item">
                        <span class="label">击败 终焉审判者</span>
                        <span class="count" id="killBoss">0/1</span>
                    </div>
                </div>
                <div class="task-reward" id="taskReward">奖励: 3000经验 + 1500金币 + 神器</div>
                <button id="claimTaskBtn">领取奖励</button>
            </div>
            <!-- 摇杆 -->
            <div id="joystickZone">
                <div id="joystickKnob"></div>
            </div>
            <!-- 控制按钮 -->
            <div id="controls">
                <div class="ctrl-row">
                    <span class="ctrl-label">B:背包</span>
                    <div class="ctrl-btn small" id="invBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Bag.png" alt="背包" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">R:恢复</span>
                    <div class="ctrl-btn small" id="healBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Restore HP.png" alt="恢复" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">Q:疾跑</span>
                    <div class="ctrl-btn small" id="sprintBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Sprint.png" alt="疾跑" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">J:破甲</span>
                    <div class="ctrl-btn small" id="armorBreakBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Sprint.png" alt="破甲" style="filter: hue-rotate(90deg);" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">K:护盾</span>
                    <div class="ctrl-btn small" id="shieldBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Shield.png" alt="护盾" style="filter: hue-rotate(180deg);" /></div>
                </div>
                <div class="ctrl-row">
                    <span class="ctrl-label">H:攻击</span>
                    <div class="ctrl-btn" id="attackBtn"><img src="https://xiaoye6661234.github.io/GuangXianWorld/Beat.png" alt="攻击" /></div>
                </div>
            </div>
            <!-- 背包弹窗 -->
            <div id="inventoryModal">
                <div id="inventoryPanel">
                    <div id="invHeader">
                        <span>🎒 背包</span>
                        <div id="invClose">✕</div>
                    </div>
                    <div id="invGrid"></div>
                </div>
            </div>
            <!-- 物品详情弹窗 -->
            <div id="itemDetailModal">
                <div id="detailPanel">
                    <div id="detailClose">✕</div>
                    <div id="detailTitle">物品名称</div>
                    <img id="detailImg" src="" />
                    <div id="detailDesc">物品描述</div>
                    <button id="detailUseBtn">使用</button>
                </div>
            </div>
            <!-- 结算弹窗 -->
            <div id="settlementModal">
                <div id="settlementPanel">
                    <div class="title" id="settlementTitle">⚔️ 战斗结算</div>
                    <div class="info" id="settlementInfo">
                        击败 Boss: <span id="killBossDisplay">0</span>/1<br />
                        获得经验: <span id="rewardExp">0</span><br />
                        获得广仙币: <span id="rewardCoins">0</span>
                    </div>
                    <div class="btns" id="settlementBtns">
                        <button class="btn-gold" id="settlementContinue">✅ 通关晋级</button>
                        <button class="btn-red" id="settlementQuit">🚪 返回大厅</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ================================================================
        //  1. 统一 data.json 操作函数
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: ''
                },
                inventory: [],
                equippedWeapon: null,
                chapterProgress: {
                    "25": { bossKills: 0, claimed: false }
                },
                chapter: 25
            };
        }

        // ================================================================
        //  2. 全局配置与数据（硬编码）
        // ================================================================

        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var W = 0,
            H = 0;

        function resizeCanvas() {
            var container = document.getElementById('gameContainer');
            var rect = container.getBoundingClientRect();
            W = canvas.width = rect.width;
            H = canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 怪物配置
        var monsterDB = {};
        var foodDB = {};
        var weaponDB = {};
        var gameConfig = {};

        var gameData = {
            monsters: [],
            monsterIdCounter: 0,
            effects: [],
            lastTime: 0,
            deltaTime: 0,
            terrainSeed: Math.random() * 10000,
            isDead: false,
            isCleared: false,
            showSettlement: false,
            // 第二十五章任务数据
            bossKills: 0,
            taskClaimed: false,
            armorBreakActive: false,
            armorBreakTimer: 0,
            shieldActive: false,
            shieldHP: 0,
            shieldMaxHP: 150
        };

        var player = {};
        var keys = { w: false, a: false, s: false, d: false };
        var joyX = 0,
            joyY = 0;
        var longPressTimer = null;
        var isLongPress = false;
        var bgm = null;
        var bgmPlaying = false;
        var clickAudio = null;

        // ================================================================
        //  3. 加载游戏数据（Lv.25 Boss战）
        // ================================================================

        function loadGameData() {
            gameConfig = {

            };

            // Lv.25 Boss —— 适配Lv25高难
            monsterDB['boss'] = {

            foodDB['蛋糕'] = {

            };
            foodDB['广仙果'] = {

            weaponDB = {};
            weaponDB['木剑'] = {

            };
            weaponDB['铁剑'] = {

            weaponDB['青铜剑'] = {

                hit: 5,
                imc: 'https://xiaoye6661234.github.io/GuangXianWorld/WoodSword.png',

            p.level = parseInt(u.level) || 25;

            p.nextExp = u.nextExp || (900 + p.level * 100);

            // 适配Lv25的血量与攻击
            p.maxHP = 575;
            p.hp = p.maxHP;
            p.attack = 175;
            p.damageBonus = 75;
            p.shieldMax = 150;

            // 自动装备终焉裁决
            var hasWeapon = false;
            for (var i = 0; i < p.inventory.length; i++) {
                if (p.inventory[i].type === 'weapon' && p.inventory[i].key === '终焉裁决') {
                    hasWeapon = true;
                    break;
                }
            }
            if (!hasWeapon) {
                p.inventory.push({ type: 'weapon', key: '终焉裁决', qty: 1 });
            }

            // 装备终焉裁决
            if (weaponDB['终焉裁决']) {
                p.equippedWeapon = weaponDB['终焉裁决'];
                p.attack = 175 + (p.equippedWeapon.hit || 75);
                if (p.equippedWeapon.damageBonus) {
                    p.damageBonus = 75 + p.equippedWeapon.damageBonus;
                }
            }

            // 确保食物数量正确
            var foodCount = { '披萨': 0, '蛋糕': 0, '面条': 0, '广仙果': 0 };
            for (var i = 0; i < p.inventory.length; i++) {
                if (p.inventory[i].type === 'food') {
                    foodCount[p.inventory[i].key] = (foodCount[p.inventory[i].key] || 0) + p.inventory[i].qty;
                }
            }
            var required = { '披萨': 3, '蛋糕': 3, '面条': 3, '广仙果': 3 };
            for (var key in required) {
                if (foodCount[key] < required[key]) {
                    var need = required[key] - foodCount[key];
                    var found = false;
                    for (var i = 0; i < p.inventory.length; i++) {
                        if (p.inventory[i].type === 'food' && p.inventory[i].key === key) {
                            p.inventory[i].qty += need;
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        p.inventory.push({ type: 'food', key: key, qty: need });
                    }
                }
            }

            if (data.inventory && Array.isArray(data.inventory)) {
                var existingKeys = {};
                for (var i = 0; i < p.inventory.length; i++) {
                    existingKeys[p.inventory[i].key] = true;
                }
                for (var i = 0; i < data.inventory.length; i++) {
                    var item = data.inventory[i];
                    if (existingKeys[item.key]) {
                        for (var j = 0; j < p.inventory.length; j++) {
                            if (p.inventory[j].key === item.key) {
                                p.inventory[j].qty += item.qty;
                                break;
                            }
                        }
                    } else {
                        p.inventory.push(item);
                        existingKeys[item.key] = true;
                    }
                }

                gameData.taskClaimed = cp.claimed || false;

                gameData.taskClaimed = false;
            }

        }

        var MAP_SIZE = 25;
        var TILE_SIZE = 80;
        var MAP_PIXELS = MAP_SIZE * TILE_SIZE;

        function getTerrainType(c, r, seed) {
            var x = c * 0.12 + seed * 0.001;
            var y = r * 0.12 + seed * 0.001;
            var n1 = Math.sin(x * 1.7 + y * 2.3) * 0.5 + Math.cos(x * 2.1 - y * 1.9) * 0.5;
            var n2 = Math.sin(x * 3.7 + y * 4.1) * 0.3 + Math.cos(x * 4.3 - y * 3.5) * 0.3;
            var n3 = Math.sin(x * 7.1 + y * 8.3) * 0.15 + Math.cos(x * 9.7 - y * 6.5) * 0.15;
            var value = n1 + n2 + n3;
            if (value < -0.5) return 'water';
            if (value < -0.05) return 'sand';
            return 'grass';
        }

        var terrainMap = [];

        function generateTerrain() {
            terrainMap = [];
            for (var r = 0; r < MAP_SIZE; r++) {
                terrainMap[r] = [];
                for (var c = 0; c < MAP_SIZE; c++) {
                    terrainMap[r][c] = getTerrainType(c, r, gameData.terrainSeed);
                }
            }
        }
        generateTerrain();

        function useFoodItem(foodKey) {
            var food = foodDB[foodKey];
            if (!food) { alert('无效食物'); return false; }
            if (player.hp >= player.maxHP) {
                alert('❤️ 生命值已满！');
                return false;
            }
            var healAmount = 0;
            if (foodKey === '披萨') {
                healAmount = Math.floor(player.maxHP * 0.5);
            } else if (foodKey === '面条' || foodKey === '蛋糕') {
                healAmount = 25;
            } else if (foodKey === '广仙果') {
                healAmount = 75;
            } else {
                healAmount = food.HP || 25;
            }
            player.hp = Math.min(player.hp + healAmount, player.maxHP);

            var idx = -1;
            for (var i = 0; i < player.inventory.length; i++) {
                if (player.inventory[i].type === 'food' && player.inventory[i].key === foodKey) {
                    idx = i;
                    break;
                }
            }
            if (idx !== -1) {
                player.inventory[idx].qty -= 1;
                if (player.inventory[idx].qty <= 0) {
                    player.inventory.splice(idx, 1);
                }
            }
            updateUI();
            updateInventoryGrid();
            saveGame();
            return true;
        }

        // ================================================================
        //  12. 战斗系统（核心机制）
        // ================================================================

        function performAttack() {
            if (player.attackCooldown > 0 || player.isAttacking || player.isDead || gameData.showSettlement) return;
            player.attackCooldown = player.attackCooldownMax;
            player.isAttacking = true;
            player.attackTimer = 0.3;

            var target = null;
            var minDist = 220;
            for (var i = 0; i < gameData.monsters.length; i++) {
                var m = gameData.monsters[i];
                if (!m.alive) continue;
                var dx = m.x - player.x;
                var dy = m.y - player.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    target = m;
                }
            }

            if (target) {
                // 计算伤害
                var atk = player.attack;
                var def = target.Def;
                var immunity = target.immunity || 50;
                var armorPen = 0;
                if (player.equippedWeapon && player.equippedWeapon.armorPenetration) {
                    armorPen = player.equippedWeapon.armorPenetration / 100;
                }
                // 破甲效果
                if (gameData.armorBreakActive) {
                    def = def * 0.5;
                }
                // 护甲穿透
                var effectiveDef = def * (1 - armorPen);

                // 基础伤害
                var baseDmg = atk - effectiveDef;
                if (baseDmg < 0) {
                    baseDmg = atk * 0.15;
                }
                // 免疫减免
                baseDmg = baseDmg * (1 - immunity / 100);
                // 伤害加成
                baseDmg = baseDmg * (1 + player.damageBonus / 100);
                // 暴击
                var isCrit = Math.random() * 100 < target.critRate;
                var finalDmg = baseDmg;
                if (isCrit) {
                    finalDmg = baseDmg * (target.critDmg / 100);
                }
                finalDmg = Math.max(1, Math.round(finalDmg));

                target.hp -= finalDmg;
                target.hitFlash = 0.2;

                // 伤害特效
                var hitNum = Math.floor(Math.random() * 7) + 1;
                var effectImg = new Image();
                effectImg.src = 'https://xiaoye6661234.github.io/GuangXianWorld/HitSound' + hitNum + '.png';
                gameData.effects.push({
                    img: effectImg,
                    x: target.x,
                    y: target.y,
                    life: 0.5,
                    timer: 0
                });

                console.log('⚔️ 造成 ' + finalDmg + ' 点伤害' + (isCrit ? ' (暴击!)' : ''));

                try {
                    var audio = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/Beat.mp3');
                    audio.volume = 0.3;
                    audio.play().catch(function() {});
                } catch (e) {}

                if (target.hp <= 0) {
                    target.alive = false;
                    gameData.bossKills++;
                    player.exp += target.exp || 3000;
                    player.coins += target.money || 1500;

                    // 检查是否所有目标达成
                    if (gameData.bossKills >= 1 && !gameData.isCleared) {
                        gameData.isCleared = true;
                        autoPromote();
                    }

                    checkLevelUp();
                    saveGame();
                    updateUI();
                    updateTaskUI();
                }
            }
            setTimeout(function() { player.isAttacking = false; }, 400);
        }

        var joystickZone = document.getElementById('joystickZone');
        var joystickKnob = document.getElementById('joystickKnob');
        var touchId = null;
        joystickZone.addEventListener('touchstart', function(e) {
            var t = e.changedTouches[0];
            touchId = t.identifier;
            handleJoystick(t);
        });
        joystickZone.addEventListener('touchmove', function(e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) handleJoystick(e.changedTouches[i]);
            }
        });
        joystickZone.addEventListener('touchend', function(e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    joyX = 0;
                    joyY = 0;
                    joystickKnob.style.transform = 'translate(0, 0)';
                    touchId = null;
                }
            }
        });

        function handleJoystick(touch) {
            var rect = joystickZone.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var dx = touch.clientX - cx;
            var dy = touch.clientY - cy;
            var maxR = rect.width / 2 - 15;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var ratio = Math.min(1, dist / maxR);
            joyX = (dx / maxR) * ratio;
            joyY = (dy / maxR) * ratio;
            var kx = joyX * maxR;
            var ky = joyY * maxR;
            joystickKnob.style.transform = 'translate(' + kx + 'px, ' + ky + 'px)';
        }

        // ================================================================
        //  20. 游戏更新循环
        // ================================================================

        function update(dt) {
            if (player.isDead || gameData.showSettlement) return;

            // 破甲计时器
            if (gameData.armorBreakActive) {
                gameData.armorBreakTimer -= dt;
                if (gameData.armorBreakTimer <= 0) {
                    gameData.armorBreakActive = false;
                    console.log('⏳ 破甲效果已结束');
                }
            }

            var dx = 0,
                dy = 0;
            if (keys.w) dy = -1;
            if (keys.s) dy = 1;
            if (keys.a) dx = -1;
            if (keys.d) dx = 1;
            if (joyX !== 0 || joyY !== 0) {
                dx = joyX;
                dy = joyY;
            }
            var len = Math.sqrt(dx * dx + dy * dy);
            if (len > 0) {
                dx /= len;
                dy /= len;
                var speedMod = player.inWater ? 0.5 : 1;
                player.x += dx * player.speed * speedMod * dt;
                player.y += dy * player.speed * speedMod * dt;
                if (Math.abs(dx) >= Math.abs(dy)) {
                    player.facing = dx > 0 ? 'right' : 'left';
                } else {
                    player.facing = dy > 0 ? 'down' : 'up';
                }
            }

            var margin = 30;
            player.x = Math.max(margin, Math.min(MAP_PIXELS - margin, player.x));
            player.y = Math.max(margin, Math.min(MAP_PIXELS - margin, player.y));

            var c = Math.floor(player.x / TILE_SIZE);
            var r = Math.floor(player.y / TILE_SIZE);
            if (c >= 0 && c < MAP_SIZE && r >= 0 && r < MAP_SIZE) {
                var terrainType = terrainMap[r][c];
                if (terrainType === 'water') {
                    if (!player.inWater) {
                        player.inWater = true;
                        player.waterTimer = 0;
                    }
                    player.waterTimer += dt;
                    if (player.waterTimer >= gameConfig.drowningTime) {
                        player.hp = 0;
                        handleDeath();
                        return;
                    }
                } else {
                    if (player.inWater) {
                        player.inWater = false;
                        player.waterTimer = 0;
                    }
                }
            }

            if (player.attackCooldown > 0) player.attackCooldown -= dt;
            if (player.attackTimer > 0) player.attackTimer -= dt;
            if (player.invincible > 0) player.invincible -= dt;
            if (player.sprintCooldown > 0) player.sprintCooldown -= dt;
            if (player.isSprinting) {
                player.sprintTimer -= dt;
                if (player.sprintTimer <= 0) {
                    player.isSprinting = false;
                    player.speed = 350;
                }
            }

            for (var i = 0; i < gameData.monsters.length; i++) {
                var m = gameData.monsters[i];
                if (!m.alive) continue;
                if (m.hitFlash > 0) m.hitFlash -= dt;
                m.attackCooldown = Math.max(0, m.attackCooldown - dt);

                var dx2 = player.x - m.x;
                var dy2 = player.y - m.y;
                var dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);

                if (dist < 550) {
                    var speed = 70 + m.Lv * 12 + (player.isSprinting ? 20 : 0);
                    if (dist > 40) {
                        m.x += (dx2 / dist) * speed * dt;
                        m.y += (dy2 / dist) * speed * dt;
                    }
                } else if (dist < 600) {
                    m.moveTimer -= dt;
                    if (m.moveTimer <= 0) {
                        m.moveTimer = 0.5 + Math.random() * 1.5;
                        m.moveAngle += (Math.random() - 0.5) * 2;
                        m.x += Math.cos(m.moveAngle) * 30 * dt;
                        m.y += Math.sin(m.moveAngle) * 30 * dt;
                    }
                }

                m.x = Math.max(margin, Math.min(MAP_PIXELS - margin, m.x));
                m.y = Math.max(margin, Math.min(MAP_PIXELS - margin, m.y));

                if (dist < 100 && m.attackCooldown <= 0 && player.invincible <= 0) {
                    // 玩家闪避
                    var dodgeChance = 30;
                    if (Math.random() * 100 < dodgeChance) {
                        console.log('💨 闪避！');
                    } else {
                        var dmg = Math.max(1, (m.Beat || 0) - player.defense);
                        // Boss暴击
                        var isCrit = Math.random() * 100 < (m.critRate || 0);
                        if (isCrit) {
                            dmg = dmg * ((m.critDmg || 200) / 100);
                            console.log('💥 Boss暴击！');
                        }
                        // 护盾吸收
                        if (gameData.shieldActive && gameData.shieldHP > 0) {
                            if (dmg <= gameData.shieldHP) {
                                gameData.shieldHP -= dmg;
                                dmg = 0;
                                console.log('🛡️ 护盾吸收了 ' + dmg + ' 点伤害');
                            } else {
                                dmg -= gameData.shieldHP;
                                gameData.shieldHP = 0;
                                gameData.shieldActive = false;
                                console.log('🛡️ 护盾破碎！');
                            }
                            updateShieldUI();
                        }
                        if (dmg > 0) {
                            player.hp -= dmg;
                            player.invincible = 0.5;
                            m.attackCooldown = 1.5;
                            if (player.hp <= 0) {
                                player.hp = 0;
                                handleDeath();
                                return;
                            }
                            updateUI();
                        }
                    }
                }
            }

            // 清理已死亡的怪物
            gameData.monsters = gameData.monsters.filter(function(m) { return m.alive; });

            for (var j = gameData.effects.length - 1; j >= 0; j--) {
                var ef = gameData.effects[j];
                ef.timer += dt;
                if (ef.timer >= ef.life) {
                    gameData.effects.splice(j, 1);
                }
            }

            updateUI();
        }

        // ================================================================
        //  21. 渲染
        // ================================================================

        function render() {
            ctx.clearRect(0, 0, W, H);
            var offsetX = player.x - W / 2;
            var offsetY = player.y - H / 2;

            var viewCols = Math.ceil(W / TILE_SIZE) + 3;
            var viewRows = Math.ceil(H / TILE_SIZE) + 3;
            var startCol = Math.floor((player.x - W / 2) / TILE_SIZE) - 2;
            var startRow = Math.floor((player.y - H / 2) / TILE_SIZE) - 2;

            var terrainImages = {
                grass: new Image(),
                sand: new Image(),
                water: new Image()
            };
            terrainImages.grass.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Grass.jpg';
            terrainImages.sand.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Sand.jpg';
            terrainImages.water.src = 'https://xiaoye6661234.github.io/GuangXianWorld/Water.jpg';

            for (var r = startRow; r < startRow + viewRows; r++) {
                for (var c = startCol; c < startCol + viewCols; c++) {
                    if (c < 0 || c >= MAP_SIZE || r < 0 || r >= MAP_SIZE) {
                        var x = c * TILE_SIZE - offsetX;
                        var y = r * TILE_SIZE - offsetY;
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        continue;
                    }
                    var type = terrainMap[r][c];
                    var img = terrainImages[type];
                    var px = c * TILE_SIZE - offsetX;
                    var py = r * TILE_SIZE - offsetY;
                    if (img.complete && img.naturalWidth > 0) {
                        ctx.drawImage(img, px, py, TILE_SIZE, TILE_SIZE);
                    } else {
                        if (type === 'grass') ctx.fillStyle = '#4CAF50';
                        else if (type === 'sand') ctx.fillStyle = '#f4e4b6';
                        else ctx.fillStyle = '#2196F3';
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            ctx.strokeStyle = 'rgba(255,0,0,0.3)';
            ctx.lineWidth = 3;
            ctx.strokeRect(-offsetX, -offsetY, MAP_PIXELS, MAP_PIXELS);

            for (var i = 0; i < gameData.monsters.length; i++) {
                var m = gameData.monsters[i];
                if (!m.alive) continue;
                var mx = m.x - offsetX;
                var my = m.y - offsetY;
                var size = m.size || 50;

                var img = new Image();
                img.src = m.imc;
                if (img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, mx - size / 2, my - size / 2, size, size);
                } else {
                    ctx.fillStyle = '#8B0000';
                    ctx.beginPath();
                    ctx.arc(mx, my, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (m.isBoss) {
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(mx, my, size / 2 + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = 'white';
                ctx.font = (m.isBoss ? '1.8vw' : '1vw') + ' Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                var label = m.isBoss ? '👑 ' : '';
                ctx.fillText(label + 'Lv.' + m.Lv, mx, my - size / 2 - 8);
                ctx.shadowBlur = 0;

                var hpW = m.isBoss ? 120 : 40;
                var hpH = m.isBoss ? 7 : 3;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(mx - hpW / 2, my - size / 2 - 16, hpW, hpH);
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(mx - hpW / 2, my - size / 2 - 16, hpW * (m.hp / m.maxHp), hpH);

                if (m.isBoss) {
                    ctx.fillStyle = 'white';
                    ctx.font = '0.9vw Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(Math.round(m.hp) + '/' + m.maxHp, mx, my - size / 2 - 22);
                }

                if (m.hitFlash > 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.beginPath();
                    ctx.arc(mx, my, size / 2 + 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            var px = player.x - offsetX;
            var py = player.y - offsetY;
            var pSize = 50;
            var playerImgName = player.role === '清' ? 'Qing.png' : 'Ming.png';
            var playerImg = new Image();
            playerImg.src = 'https://xiaoye6661234.github.io/GuangXianWorld/' + playerImgName;
            if (playerImg.complete && playerImg.naturalWidth > 0) {
                ctx.drawImage(playerImg, px - pSize / 2, py - pSize / 2, pSize, pSize);
            } else {
                ctx.fillStyle = '#4A90E2';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            if (player.invincible > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 4, 0, Math.PI * 2);
                ctx.fill();
            }
            if (player.inWater && !player.isDead) {
                ctx.fillStyle = 'rgba(100, 200, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 6, 0, Math.PI * 2);
                ctx.fill();
            }

            for (var k = 0; k < gameData.effects.length; k++) {
                var ef2 = gameData.effects[k];
                var ex = ef2.x - offsetX;
                var ey = ef2.y - offsetY;
                var size2 = 80 * (W / 1000);
                if (ef2.img.complete && ef2.img.naturalWidth > 0) {
                    ctx.drawImage(ef2.img, ex - size2 / 2, ey - size2 / 2, size2, size2);
                }
            }

            if (player.isAttacking) {
                var angle = player.facing === 'right' ? 0 : player.facing === 'left' ? Math.PI : player.facing === 'up' ? -Math
                    .PI / 2 : Math.PI / 2;
                var len2 = 30;
                var ex2 = px + Math.cos(angle) * len2;
                var ey2 = py + Math.sin(angle) * len2;
                ctx.strokeStyle = 'rgba(255,255,200,0.8)';
                ctx.lineWidth = 4;
                ctx.shadowColor = 'rgba(255,255,100,0.6)';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(ex2, ey2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 破甲特效
            if (gameData.armorBreakActive) {
                ctx.fillStyle = 'rgba(255, 200, 100, 0.15)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ffaa00';
                ctx.font = '2vw Arial';
                ctx.textAlign = 'center';
                ctx.fillText('⚔️ 破甲', W / 2, H * 0.2);
            }

            // 护盾特效
            if (gameData.shieldActive && gameData.shieldHP > 0) {
                ctx.fillStyle = 'rgba(100, 200, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2 + 20, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // ================================================================
        //  22. 游戏循环
        // ================================================================

        function loop(timestamp) {
            var dt = Math.min((timestamp - gameData.lastTime) / 1000, 0.05);
            gameData.lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        // ================================================================
        //  23. 初始化启动
        // ================================================================

        function init() {
            loadGameData();
            generateTerrain();

            var data = loadData();
            if (!data) {
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user) {
                alert('数据异常，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user.role) {
                window.location.href = 'ChooseRole.html';
                return;
            }
            if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                window.location.href = 'PersonalInformation.html';
                return;
            }

            player = loadPlayerFromData(data);
            updateUI();
            updateInventoryGrid();
            updateTaskUI();

            player.x = 1000;
            player.y = 1000;
            initMonsters();

            initAudio();
            addClickSounds();

            gameData.lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        init();
        window.addEventListener('resize', function() { resizeCanvas(); });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        console.log('👑 广仙世界 · 第二十五章 Boss战 已启动！');
        console.log('📖 玩家属性: HP 575, 攻击 175 (+75终焉裁决=250), 伤害加成 75%, 护盾 150');
        console.log('📖 Boss属性: HP 2750, 攻击 475, 防御 500, 免疫 50%, 暴击率 50%, 暴击伤害 525%');
        console.log('📖 任务目标: 击败 终焉审判者 1次');
        console.log('⌨️ 快捷键: W/A/S/D 移动 | H 攻击 | Q 疾跑 | R 恢复 | B 背包 | J 破甲 | K 护盾 | F 领任务');
        console.log('💾 数据与 data.json 完全互通，第二十五章任务数据独立存储');
    </script>
