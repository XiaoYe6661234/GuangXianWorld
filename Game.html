<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>难度选择 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/Choose%20Character.png');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .back-btn {
            position: absolute;
            top: 3%;
            left: 4%;
            font-size: 2.2vw;
            font-weight: 700;
            cursor: pointer;
            color: #000;
            z-index: 10;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.3vw 1.2vw;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            border: none;
            transition: 0.2s;
        }
        .back-btn:active {
            transform: scale(0.95);
        }
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.8vw;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .difficulty-container {
            position: absolute;
            top: 22%;
            left: 4%;
            width: 92%;
            height: 58%;
            display: flex;
            gap: 2%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2%;
        }
        .difficulty-container::-webkit-scrollbar {
            display: none;
        }
        .difficulty-card {
            flex-shrink: 0;
            width: 23.5%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .difficulty-card:hover {
            transform: translateY(-4px);
        }
        .card-top {
            width: 100%;
            height: 75%;
            background: #fff;
            border: 0.5vw solid #666;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            position: relative;
        }
        .difficulty-card.selected .card-top {
            border-color: #ff8800;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
        }
        .difficulty-card.locked .card-top {
            opacity: 0.6;
            border-color: #999;
            filter: grayscale(0.6);
        }
        .difficulty-card.locked .card-top::after {
            content: "🔒";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4vw;
            opacity: 0.8;
        }
        .card-level {
            font-size: 3vw;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 1vw;
        }
        .card-monster {
            width: 75%;
            height: 70%;
            object-fit: contain;
        }
        .card-btn {
            width: 100%;
            height: 20%;
            margin-top: 5%;
            border: none;
            border-radius: 12px;
            font-size: 2vw;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
        }
        .card-btn.unlocked {
            background: #ff8800;
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 136, 0, 0.3);
        }
        .card-btn.unlocked:active {
            transform: scale(0.96);
        }
        .card-btn.locked {
            background: #666;
            color: #fff;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .progress-bar {
            position: absolute;
            bottom: 8%;
            left: 4%;
            width: 92%;
            height: 3.5%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8800, #ffcc00);
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .player-level-badge {
            position: absolute;
            bottom: 13%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.6vw;
            padding: 0.4vw 2vw;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
        }
        .player-level-badge span {
            color: #ffcc00;
            font-weight: 700;
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
                transform-origin: center center;
            }
        }
        @media (max-width: 600px) {
            .title {
                font-size: 5vw;
            }
            .card-level {
                font-size: 4vw;
            }
            .card-btn {
                font-size: 3vw;
            }
            .player-level-badge {
                font-size: 2.8vw;
                padding: 0.8vw 3vw;
            }
            .back-btn {
                font-size: 3.5vw;
                padding: 0.6vw 2vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='Hall.html'">← 返回大厅</button>
        <div class="title">选择等级</div>
        <div class="difficulty-container" id="difficultyContainer"></div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="player-level-badge">当前等级: <span id="playerLevelDisplay">Lv.1</span></div>
    </div>

    <script>
        // ================================================================
        //  统一数据操作
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch (e) { return null; }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        // ================================================================
        //  难度配置（新增 Lv.10、Lv.15、Lv.20）
        // ================================================================

        var difficultyList = [
            { level: 1, name: 'Lv.1', scene: 'Level1.html', desc: '未开智', reward: '无' },
            { level: 2, name: 'Lv.2', scene: 'Level2.html', desc: '开智了', reward: '无' },
            { level: 3, name: 'Lv.3', scene: 'Level3.html', desc: '暗影刺客', reward: '无' },
            { level: 4, name: 'Lv.4', scene: 'Level4.html', desc: '那咋了那咋了', reward: '无' },
            { level: 5, name: 'Lv.5', scene: 'Level5.html', desc: '更新配置中', reward: '无' },
            { level: 6, name: 'Lv.6', scene: 'Level6.html', desc: '加载中', reward: '无' },
            { level: 7, name: 'Lv.7', scene: 'Level7.html', desc: '3A大作', reward: '无' },
            { level: 8, name: 'Lv.8', scene: 'Level8.html', desc: 'Look my eyes', reward: '无' },
            { level: 10, name: 'Lv.10', scene: 'Level10.html', desc: '夯', reward: '无' },
            { level: 15, name: 'Lv.15', scene: 'Level15.html', desc: '急急如律令', reward: '无' },
            { level: 20, name: 'Lv.20', scene: 'Level20.html', desc: '不如喘口气吧小大人', reward: '无' },
            { level: 25, name: 'Lv.25', scene: 'Level25.html', desc: '阿帕次阿帕次', reward: '无' },
             { level: 30, name: 'Lv.30', scene: 'Level30.html', desc: '懒得更新了', reward: '无' }
        ];

        // ================================================================
        //  数据加载与渲染
        // ================================================================

        var gData = {};
        var selectedDifficulty = 0;

        function loadDataAndCheck() {
            var data = loadData();
            if (!data) { alert('请先登录！');
                window.location.href = 'Signin.html'; return; }
            if (!data.user) { alert('数据异常！');
                window.location.href = 'Signin.html'; return; }
            if (!data.user.role) { window.location.href = 'ChooseRole.html'; return; }
            if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                window.location.href = 'PersonalInformation.html';
                return;
            }
            gData = data;
            renderDifficultyCards();
            initScrollSync();
            updateLevelBadge();
        }

        function renderDifficultyCards() {
            var container = document.getElementById('difficultyContainer');
            var userLevel = gData.user.level || 1;
            container.innerHTML = '';
            difficultyList.forEach(function(diff, index) {
                var isUnlocked = userLevel >= diff.level;
                var card = document.createElement('div');
                card.className = 'difficulty-card' + (index === 0 ? ' selected' : '') + (isUnlocked ? '' : ' locked');
                card.dataset.index = index;
                card.dataset.unlocked = isUnlocked;
                card.dataset.scene = diff.scene;
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-level">${diff.name}</div>
                        <img src="https://xiaoye6661234.github.io/GuangXianWorld/Monster1-Ice.png" class="card-monster" alt="怪物" />
                        <div style="font-size:1.2vw;color:#555;margin-top:0.5vw;">${diff.desc}</div>
                    </div>
                    <button class="card-btn ${isUnlocked ? 'unlocked' : 'locked'}" ${!isUnlocked ? 'disabled' : ''}>
                        ${isUnlocked ? '⚔️ 开始挑战' : '🔒 暂未解锁'}
                    </button>
                `;
                card.addEventListener('click', function() { selectDifficulty(index); });
                card.querySelector('.card-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (isUnlocked) { startGame(diff.scene); } else {
                        alert('🔒 需要达到 ' + diff.name + ' 才能解锁！当前等级: Lv.' + userLevel);
                    }
                });
                container.appendChild(card);
            });
        }

        function selectDifficulty(index) {
            document.querySelectorAll('.difficulty-card').forEach(function(c) { c.classList.remove('selected'); });
            var card = document.querySelector('.difficulty-card[data-index="' + index + '"]');
            if (card) { card.classList.add('selected');
                selectedDifficulty = index;
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
        }

        function startGame(scene) { window.location.href = scene; }

        function initScrollSync() {
            var container = document.getElementById('difficultyContainer');
            var progressFill = document.getElementById('progressFill');
            container.addEventListener('scroll', function() {
                var scrollLeft = container.scrollLeft;
                var scrollWidth = container.scrollWidth - container.clientWidth;
                var progress = scrollWidth > 0 ? (scrollLeft / scrollWidth) * 100 : 0;
                progressFill.style.width = progress + '%';
            });
            setTimeout(function() {
                var scrollLeft = container.scrollLeft;
                var scrollWidth = container.scrollWidth - container.clientWidth;
                var progress = scrollWidth > 0 ? (scrollLeft / scrollWidth) * 100 : 0;
                progressFill.style.width = progress + '%';
            }, 100);
        }

        function updateLevelBadge() {
            document.getElementById('playerLevelDisplay').innerText = 'Lv.' + (gData.user.level || 1);
        }

        // ================================================================
        //  键盘快捷键（支持 1-9, 0 对应 Lv.10，后续可扩展）
        // ================================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { window.location.href = 'Hall.html'; return; }
            var num = parseInt(e.key);
            // 数字键 1-9 对应前9个难度，0 对应第10个（Lv.10），后续可扩展
            if (num >= 1 && num <= 9 && num <= difficultyList.length) {
                var index = num - 1;
                var card = document.querySelector('.difficulty-card[data-index="' + index + '"]');
                if (card && card.dataset.unlocked === 'true') {
                    selectDifficulty(index);
                    setTimeout(function() { startGame(card.dataset.scene); }, 300);
                } else {
                    alert('🔒 需要达到 ' + difficultyList[index].name + ' 才能解锁！');
                }
            } else if (num === 0 && difficultyList.length >= 10) {
                var index = 9; // 第10个难度（Lv.10）
                var card = document.querySelector('.difficulty-card[data-index="' + index + '"]');
                if (card && card.dataset.unlocked === 'true') {
                    selectDifficulty(index);
                    setTimeout(function() { startGame(card.dataset.scene); }, 300);
                } else {
                    alert('🔒 需要达到 ' + difficultyList[index].name + ' 才能解锁！');
                }
            }
        });

        loadDataAndCheck();

        console.log('🎯 广仙世界 · 难度选择已加载');
        console.log('📖 当前等级: Lv.' + (gData.user.level || 1));
        console.log('📖 共 ' + difficultyList.length + ' 个难度，新增 Lv.10、Lv.15、Lv.20');
        console.log('⌨️ 快捷键: 数字键 1-9 对应前9个难度，0 对应 Lv.10，ESC 返回大厅');
    </script>
</body>
</html>
