<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择难度 · 广仙世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/Choose%20Character.png');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .back-btn {
            position: absolute;
            top: 3%;
            left: 4%;
            font-size: 2.2vw;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            z-index: 10;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.3vw 1.2vw;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .back-btn:active {
            transform: scale(0.95);
        }
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.8vw;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .difficulty-container {
            position: absolute;
            top: 22%;
            left: 4%;
            width: 92%;
            height: 58%;
            display: flex;
            gap: 2%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2%;
        }
        .difficulty-container::-webkit-scrollbar {
            display: none;
        }
        .difficulty-card {
            flex-shrink: 0;
            width: 23.5%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .difficulty-card:hover {
            transform: translateY(-4px);
        }
        .card-top {
            width: 100%;
            height: 75%;
            background: #fff;
            border: 0.5vw solid #666;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            position: relative;
        }
        .difficulty-card.selected .card-top {
            border-color: #ff8800;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
        }
        .difficulty-card.locked .card-top {
            opacity: 0.6;
            border-color: #999;
            filter: grayscale(0.6);
        }
        .difficulty-card.locked .card-top::after {
            content: "🔒";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4vw;
            opacity: 0.8;
        }
        .card-level {
            font-size: 3vw;
            font-weight: bold;
            color: #000;
            margin-bottom: 1vw;
        }
        .card-monster {
            width: 75%;
            height: 70%;
            object-fit: contain;
        }
        .card-btn {
            width: 100%;
            height: 20%;
            margin-top: 5%;
            border: none;
            border-radius: 12px;
            font-size: 2vw;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
        }
        .card-btn.unlocked {
            background: #ff8800;
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 136, 0, 0.3);
        }
        .card-btn.unlocked:hover {
            background: #ff7700;
            transform: scale(1.03);
        }
        .card-btn.unlocked:active {
            transform: scale(0.96);
        }
        .card-btn.locked {
            background: #666;
            color: #fff;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .card-btn .lock-icon {
            margin-right: 0.5vw;
        }
        .progress-bar {
            position: absolute;
            bottom: 8%;
            left: 4%;
            width: 92%;
            height: 3.5%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8800, #ffcc00);
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .player-level-badge {
            position: absolute;
            bottom: 13%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.6vw;
            padding: 0.4vw 2vw;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
        }
        .player-level-badge span {
            color: #ffcc00;
            font-weight: bold;
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-btn" onclick="window.location.href='Hall.html'">← 返回大厅</div>
        <div class="title">🗡️ 选择难度</div>
        <div class="difficulty-container" id="difficultyContainer"></div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="player-level-badge" id="levelBadge">当前等级: <span id="playerLevelDisplay">Lv.1</span></div>
    </div>
    <script>
        // ================================================================
        //  统一 data.json 操作函数（与所有页面共享）
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: ''
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        // ================================================================
        //  全局数据
        // ================================================================

        var gData = {};
        var selectedDifficulty = 0;

        // ================================================================
        //  难度配置（可无限扩展，自动生成卡片）
        // ================================================================

        var difficultyList = [
            { level: 1, name: "Lv.1 · 初出茅庐", scene: "Level1.html", desc: "恶魔小兵 ×10", reward: "50经验 + 20金币" },
            { level: 2, name: "Lv.2 · 小试牛刀", scene: "Level2.html", desc: "骷髅战士 ×10", reward: "80经验 + 35金币" },
            { level: 3, name: "Lv.3 · 渐入佳境", scene: "Level3.html", desc: "暗影刺客 ×10", reward: "120经验 + 50金币" },
            { level: 4, name: "Lv.4 · 锋芒毕露", scene: "Level4.html", desc: "石巨人 ×10", reward: "180经验 + 70金币" },
            { level: 5, name: "Lv.5 · 声名鹊起", scene: "Level5.html", desc: "火焰魔像 ×10", reward: "250经验 + 100金币" },
            { level: 6, name: "Lv.6 · 威震四方", scene: "Level6.html", desc: "冰霜巨龙 ×10", reward: "350经验 + 140金币" },
            { level: 7, name: "Lv.7 · 名动天下", scene: "Level7.html", desc: "暗影领主 ×10", reward: "500经验 + 200金币" },
            { level: 8, name: "Lv.8 · 登峰造极", scene: "Level8.html", desc: "混沌魔王 ×10", reward: "700经验 + 300金币" }
        ];

        // ================================================================
        //  数据检查与加载
        // ================================================================

        function loadDataAndCheck() {
            var data = loadData();
            if (!data) {
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user) {
                alert('数据异常，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user.role) {
                window.location.href = 'ChooseRole.html';
                return;
            }
            if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                window.location.href = 'PersonalInformation.html';
                return;
            }
            gData = data;
            renderDifficultyCards();
            initScrollSync();
            updateLevelBadge();
        }

        // ================================================================
        //  渲染难度卡片
        // ================================================================

        function renderDifficultyCards() {
            var container = document.getElementById('difficultyContainer');
            var userLevel = gData.user.level || 1;

            container.innerHTML = '';
            difficultyList.forEach(function(diff, index) {
                var isUnlocked = userLevel >= diff.level;
                var card = document.createElement('div');
                card.className = 'difficulty-card' + (index === 0 ? ' selected' : '') + (isUnlocked ? '' : ' locked');
                card.dataset.index = index;
                card.dataset.unlocked = isUnlocked;
                card.dataset.scene = diff.scene;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-level">${diff.name}</div>
                        <img src="https://xiaoye6661234.github.io/GuangXianWorld/Monster.png" class="card-monster" alt="怪物" />
                        <div style="font-size:1.2vw;color:#555;margin-top:0.5vw;">${diff.desc}</div>
                    </div>
                    <button class="card-btn ${isUnlocked ? 'unlocked' : 'locked'}" 
                            ${!isUnlocked ? 'disabled' : ''}>
                        ${isUnlocked ? '⚔️ 开始挑战' : '🔒 暂未解锁'}
                    </button>
                `;

                // 卡片点击事件
                card.addEventListener('click', function() {
                    playClickSound();
                    selectDifficulty(index);
                });

                // 按钮点击事件（开始游戏）
                card.querySelector('.card-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (isUnlocked) {
                        playClickSound();
                        startGame(diff.scene);
                    } else {
                        alert('🔒 需要达到 ' + diff.name + ' 才能解锁此难度！\n当前等级: Lv.' + userLevel);
                    }
                });

                container.appendChild(card);
            });
        }

        // ================================================================
        //  选择难度
        // ================================================================

        function selectDifficulty(index) {
            document.querySelectorAll('.difficulty-card').forEach(function(card) {
                card.classList.remove('selected');
            });
            var card = document.querySelector('.difficulty-card[data-index="' + index + '"]');
            if (card) {
                card.classList.add('selected');
                selectedDifficulty = index;
                // 滚动到选中的卡片
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // ================================================================
        //  开始游戏
        // ================================================================

        function startGame(scene) {
            // 检查关卡文件是否存在（通过尝试加载，或者直接跳转）
            // 这里直接跳转，如果文件不存在会显示404，用户可自行创建
            window.location.href = scene;
        }

        // ================================================================
        //  滚动与进度条同步
        // ================================================================

        function initScrollSync() {
            var container = document.getElementById('difficultyContainer');
            var progressFill = document.getElementById('progressFill');

            container.addEventListener('scroll', function() {
                var scrollLeft = container.scrollLeft;
                var scrollWidth = container.scrollWidth - container.clientWidth;
                var progress = scrollWidth > 0 ? (scrollLeft / scrollWidth) * 100 : 0;
                progressFill.style.width = progress + '%';
            });

            // 初始触发一次，让进度条显示正确位置
            setTimeout(function() {
                var scrollLeft = container.scrollLeft;
                var scrollWidth = container.scrollWidth - container.clientWidth;
                var progress = scrollWidth > 0 ? (scrollLeft / scrollWidth) * 100 : 0;
                progressFill.style.width = progress + '%';
            }, 100);
        }

        // ================================================================
        //  更新等级徽章
        // ================================================================

        function updateLevelBadge() {
            var level = gData.user.level || 1;
            document.getElementById('playerLevelDisplay').innerText = 'Lv.' + level;
        }

        // ================================================================
        //  播放点击音效
        // ================================================================

        function playClickSound() {
            var click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            click.volume = (gData.user.settings?.sfxVolume || 50) / 100;
            click.play().catch(function(e) {});
        }

        // ================================================================
        //  页面加载
        // ================================================================

        loadDataAndCheck();

        // ================================================================
        //  键盘快捷键支持
        // ================================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                window.location.href = 'Hall.html';
            }
            // 数字键快速选择关卡 (1-9)
            var num = parseInt(e.key);
            if (num >= 1 && num <= 9 && num <= difficultyList.length) {
                var index = num - 1;
                var card = document.querySelector('.difficulty-card[data-index="' + index + '"]');
                if (card) {
                    var isUnlocked = card.dataset.unlocked === 'true';
                    if (isUnlocked) {
                        selectDifficulty(index);
                        playClickSound();
                        setTimeout(function() {
                            startGame(card.dataset.scene);
                        }, 300);
                    } else {
                        alert('🔒 需要达到 ' + difficultyList[index].name + ' 才能解锁此难度！\n当前等级: Lv.' + (gData.user
                            .level || 1));
                    }
                }
            }
        });

        console.log('🎯 广仙世界 · 难度选择已加载');
        console.log('📖 当前等级: Lv.' + (gData.user.level || 1));
        console.log('🔑 已解锁关卡: ' + difficultyList.filter(function(d) { return (gData.user.level || 1) >= d.level; }).map(
            function(d) { return d.name; }).join(', '));
        console.log('⌨️ 快捷键: 数字键 1-' + difficultyList.length + ' 快速选择关卡, ESC 返回大厅');
    </script>
</body>
</html>
