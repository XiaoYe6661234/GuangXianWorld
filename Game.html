<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择难度</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto;
        }
        .container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background-image: url('https://xiaoye6661234.github.io/GuangXianWorld/Choose%20Character.png');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .back-btn {
            position: absolute;
            top: 3%;
            left: 4%;
            font-size: 2.2vw;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            z-index: 10;
        }
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.8vw;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .difficulty-container {
            position: absolute;
            top: 22%;
            left: 4%;
            width: 92%;
            height: 58%;
            display: flex;
            gap: 2%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2%;
        }
        .difficulty-container::-webkit-scrollbar {
            display: none;
        }
        .difficulty-card {
            flex-shrink: 0;
            width: 23.5%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .card-top {
            width: 100%;
            height: 75%;
            background: #fff;
            border: 0.5vw solid #666;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .difficulty-card.selected .card-top {
            border-color: #ff8800;
            box-shadow: 0 0 15px rgba(255, 136, 0, 0.5);
        }
        .card-level {
            font-size: 3vw;
            font-weight: bold;
            color: #000;
            margin-bottom: 1vw;
        }
        .card-monster {
            width: 75%;
            height: 70%;
            object-fit: contain;
        }
        .card-btn {
            width: 100%;
            height: 20%;
            margin-top: 5%;
            border: none;
            border-radius: 12px;
            font-size: 2vw;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .card-btn.unlocked {
            background: #ff8800;
            color: #fff;
        }
        .card-btn.locked {
            background: #666;
            color: #fff;
            cursor: not-allowed;
        }
        .card-btn.unlocked:active {
            transform: scale(0.97);
        }
        .progress-bar {
            position: absolute;
            bottom: 8%;
            left: 4%;
            width: 92%;
            height: 3.5%;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #666;
            border-radius: 20px;
            transition: width 0.2s ease;
        }
        @media (orientation: portrait) {
            .container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-btn" onclick="window.location.href='Hall.html'">← 返回</div>
        <div class="title">选择难度</div>
        <div class="difficulty-container" id="difficultyContainer"></div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
    <script>
        // ================================================================
        //  统一 data.json 操作函数
        // ================================================================

        function loadData() {
            var raw = localStorage.getItem('data.json');
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function saveData(data) {
            localStorage.setItem('data.json', JSON.stringify(data));
            localStorage.setItem('GuangXianData', JSON.stringify(data));
        }

        function createDefaultData() {
            var now = new Date().toISOString().split('T')[0];
            return {
                user: {
                    username: '',
                    password: '',
                    nickname: '云游仙友',
                    avatar: 'https://xiaoye6661234.github.io/GuangXianWorld/Default avatar.jpg',
                    region: '',
                    bgImage: '',
                    level: 1,
                    coins: 1000,
                    exp: 0,
                    nextExp: 1000,
                    role: '',
                    joinedDate: now,
                    lastLoginDate: now,
                    loginStreak: 0,
                    signHistory: [],
                    settings: { bgm: true, bgmVolume: 40, sfxVolume: 50 },
                    hasClaimedNotice: false,
                    lastDailyWelfare: '',
                    lastFreeClaim: ''
                },
                inventory: [],
                equippedWeapon: null,
                taskProgress: 0,
                taskClaimed1: false,
                taskClaimed5: false,
                taskClaimed10: false,
                chapter: 1
            };
        }

        // ================================================================
        //  全局数据
        // ================================================================

        var gData = {};
        var selectedDifficulty = 0;

        // 难度配置（可无限扩展，自动生成卡片）
        var difficultyList = [
            { level: 1, name: "Lv.1", scene: "Level1.html" },
            { level: 2, name: "Lv.2", scene: "Level2.html" },
            { level: 3, name: "Lv.3", scene: "Level3.html" },
            { level: 4, name: "Lv.4", scene: "Level4.html" },
            { level: 5, name: "Lv.5", scene: "Level5.html" },
            { level: 6, name: "Lv.6", scene: "Level6.html" },
            { level: 7, name: "Lv.7", scene: "Level7.html" },
            { level: 8, name: "Lv.8", scene: "Level8.html" }
        ];

        // ================================================================
        //  数据检查
        // ================================================================

        function loadDataAndCheck() {
            var data = loadData();
            if (!data) {
                alert('请先登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user) {
                alert('数据异常，请重新登录！');
                window.location.href = 'Signin.html';
                return;
            }
            if (!data.user.role) {
                window.location.href = 'ChooseRole.html';
                return;
            }
            if (!data.user.nickname || data.user.nickname === '云游仙友' || !data.user.region) {
                window.location.href = 'PersonalInformation.html';
                return;
            }
            gData = data;
            renderDifficultyCards();
            initScrollSync();
        }

        // ================================================================
        //  渲染难度卡片
        // ================================================================

        function renderDifficultyCards() {
            var container = document.getElementById('difficultyContainer');
            var userLevel = gData.user.level || 1;

            container.innerHTML = '';
            difficultyList.forEach(function(diff, index) {
                var isUnlocked = userLevel >= diff.level;
                var card = document.createElement('div');
                card.className = 'difficulty-card ' + (index === 0 ? 'selected' : '');
                card.dataset.index = index;
                card.dataset.unlocked = isUnlocked;
                card.dataset.scene = diff.scene;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-level">${diff.name}</div>
                        <img src="https://xiaoye6661234.github.io/GuangXianWorld/Monster.png" class="card-monster" alt="怪物" />
                    </div>
                    <button class="card-btn ${isUnlocked ? 'unlocked' : 'locked'}" 
                            ${!isUnlocked ? 'disabled' : ''}>
                        ${isUnlocked ? '开始游玩' : '暂未解锁'}
                    </button>
                `;

                // 卡片点击事件
                card.addEventListener('click', function() {
                    playClickSound();
                    selectDifficulty(index);
                });

                // 按钮点击事件（开始游戏）
                card.querySelector('.card-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (isUnlocked) {
                        playClickSound();
                        startGame(diff.scene);
                    } else {
                        alert('需要达到 Lv.' + diff.level + ' 才能解锁此难度！');
                    }
                });

                container.appendChild(card);
            });
        }

        // ================================================================
        //  选择难度
        // ================================================================

        function selectDifficulty(index) {
            document.querySelectorAll('.difficulty-card').forEach(function(card) {
                card.classList.remove('selected');
            });
            document.querySelector('.difficulty-card[data-index="' + index + '"]').classList.add('selected');
            selectedDifficulty = index;
        }

        // ================================================================
        //  开始游戏
        // ================================================================

        function startGame(scene) {
            // 这里可以添加游戏开始前的准备逻辑
            window.location.href = scene;
        }

        // ================================================================
        //  滚动与进度条同步
        // ================================================================

        function initScrollSync() {
            var container = document.getElementById('difficultyContainer');
            var progressFill = document.getElementById('progressFill');

            container.addEventListener('scroll', function() {
                var scrollLeft = container.scrollLeft;
                var scrollWidth = container.scrollWidth - container.clientWidth;
                var progress = (scrollLeft / scrollWidth) * 100;
                progressFill.style.width = progress + '%';
            });
        }

        // ================================================================
        //  播放点击音效
        // ================================================================

        function playClickSound() {
            var click = new Audio('https://xiaoye6661234.github.io/GuangXianWorld/click.mp3');
            click.volume = (gData.user.settings?.sfxVolume || 50) / 100;
            click.play().catch(function(e) {});
        }

        // 页面加载
        loadDataAndCheck();
    </script>
</body>
</html>
