<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>广仙世界</title>
    <style>
        /* ===== 全局重置 & 防下载 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .game-container {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            position: relative;
            background: url('https://xiaoye6661234.github.io/GuangXianWorld/background.jpg') center/cover no-repeat;
        }

        /* ===== 适龄提示 (彻底防下载) ===== */
        .age-rating {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 70px;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            /* 禁止所有交互 → 无法长按 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            draggable: false;
        }

        /* ===== Logo (彻底防下载) ===== */
        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 52%;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            pointer-events: none;
            /* 禁止所有交互 → 无法长按 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            draggable: false;
        }

        /* ===== 登录按钮 (字体调小) ===== */
        .login-btn {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 38px;
            /* 字体从 22px → 16px，更小巧 */
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #ffb300;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 179, 0, 0.3);
            /* 防止按钮文字被选中 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .login-btn:hover {
            background: #ffa000;
            transform: translateX(-50%) scale(1.03);
            box-shadow: 0 6px 16px rgba(255, 179, 0, 0.4);
        }
        .login-btn:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* ===== 竖屏适配 ===== */
        @media (orientation: portrait) {
            .game-container {
                transform: rotate(-90deg) scale(0.8);
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 适龄提示图片：完全防长按/右键/拖拽 -->
        <img
        src="https://xiaoye6661234.github.io/GuangXianWorld/CADPA.png"
        alt="12+适龄提示"
        class="age-rating"
        draggable="false"
        oncontextmenu="return false"
        />

        <!-- Logo图片：完全防长按/右键/拖拽 -->
        <img
        src="https://xiaoye6661234.github.io/GuangXianWorld/logo.png"
        alt="广仙世界"
        class="logo"
        draggable="false"
        oncontextmenu="return false"
        />

        <!-- 登录按钮 -->
        <button class="login-btn" id="loginBtn">登录/注册</button>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" loop>
        <source src="https://xiaoye6661234.github.io/GuangXianWorld/BGM1.mp3" type="audio/mpeg" />
    </audio>

    <!-- 点击音效 -->
    <audio id="clickSound">
        <source src="https://xiaoye6661234.github.io/GuangXianWorld/click.mp3" type="audio/mpeg" />
    </audio>

    <script>
        // ================================================================
        //  核心功能 100% 保留 (仅增加防下载属性 & 字体调小)
        // ================================================================

        var bgm = document.getElementById('bgm');
        var clickSound = document.getElementById('clickSound');

        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play().catch(function(e) {
                console.log('音效播放失败:', e);
            });
        }

        // 检查用户数据是否存在（统一使用 GuangXianData）
        function checkUserData() {
            var userData = localStorage.getItem('GuangXianData');
            if (userData) {
                try {
                    var parsed = JSON.parse(userData);
                    if (parsed && parsed.user) {
                        document.getElementById('loginBtn').textContent = '进入游戏';
                        return true;
                    }
                } catch (e) { /* 数据解析失败，视为无数据 */ }
            }
            document.getElementById('loginBtn').textContent = '登录/注册';
            return false;
        }

        // 页面加载时检查
        window.addEventListener('load', function() {
            var hasData = checkUserData();
            // 尝试自动播放背景音乐
            bgm.volume = 0.5;
            document.addEventListener('click', function startBGM() {
                bgm.play().catch(function(e) {
                    console.log('背景音乐播放失败:', e);
                });
                document.removeEventListener('click', startBGM);
            }, { once: true });
        });

        // 登录按钮根据数据状态跳转
        document.getElementById('loginBtn').addEventListener('click', function() {
            playClickSound();
            var userData = localStorage.getItem('GuangXianData');
            if (userData) {
                try {
                    var parsed = JSON.parse(userData);
                    if (parsed && parsed.user) {
                        var user = parsed.user;
                        // 如果缺少角色，先去选角色
                        if (!user.role) {
                            window.location.href = 'ChooseRole.html';
                            return;
                        }
                        // 如果缺少昵称或地区，先去完善信息
                        if (!user.nickname || user.nickname === '云游仙友' || !user.region) {
                            window.location.href = 'PersonalInformation.html';
                            return;
                        }
                        // 数据完整 → 直接进入大厅
                        window.location.href = 'Hall.html';
                        return;
                    }
                } catch (e) { /* 数据损坏，重新登录 */ }
            }
            // 无数据或数据损坏 → 进入登录页
            window.location.href = 'Signin.html';
        });
    </script>

</body>
</html>
